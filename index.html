<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self' https://cdn.jsdelivr.net https://api.anthropic.com https://*.googleapis.com https://*.firebaseio.com https://*.firebaseapp.com wss://*.firebaseio.com; worker-src 'self' blob: https://cdn.jsdelivr.net; frame-src https://*.firebaseapp.com; object-src 'none'; base-uri 'none'; form-action 'none'">

<script>
/* Tema: aplica a classe .dark/.light no <html> antes de pintar a página.
   Com isso o CSS só precisa de html.dark — sem duplicar regras em @media. */
(function(){try{
  var s=localStorage.getItem('pfp-theme');
  var d=s==='dark'||(s!=='light'&&window.matchMedia('(prefers-color-scheme:dark)').matches);
  document.documentElement.classList.add(d?'dark':'light');
}catch(e){document.documentElement.classList.add('light');}})();
</script>
<style>
:root{
  --blue:#2563EB;--blue-light:#EFF6FF;--blue-mid:#DBEAFE;
  --green:#047857;--green-light:#ECFDF5;--green-mid:#D1FAE5;
  --red:#C81E1E;--red-light:#FEF2F2;--red-mid:#FECACA;
  --amber:#B45309;--amber-light:#FFFBEB;--amber-mid:#FDE68A;
  --purple:#7C3AED;--purple-light:#F5F3FF;--purple-mid:#EDE9FE;
  --gray-50:#F8FAFC;--gray-100:#F1F5F9;--gray-200:#E2E8F0;
  --gray-300:#CBD5E1;--gray-400:#64748B;--gray-500:#526177;
  --gray-600:#475569;--gray-700:#334155;--gray-800:#1E293B;--gray-900:#0F172A;
  /* gray-400 era #94A3B8 (contraste 2,6:1); agora 4,8:1 sobre branco — WCAG AA */
  /* ── Cores semânticas: use SEMPRE estas para receita/despesa/transferência ── */
  --income:var(--green);--income-bg:var(--green-light);--income-border:var(--green-mid);
  --expense:var(--red);--expense-bg:var(--red-light);--expense-border:var(--red-mid);
  --transfer:var(--purple);--transfer-bg:var(--purple-light);--transfer-border:var(--purple-mid);
  --danger:var(--red);--success:var(--green);--warning:var(--amber);
  --radius-sm:8px;--radius-md:12px;--radius-lg:16px;--radius-xl:20px;
  --shadow-sm:0 1px 3px rgba(15,23,42,.06),0 1px 2px rgba(15,23,42,.04);
  --shadow-md:0 4px 16px rgba(15,23,42,.08),0 2px 6px rgba(15,23,42,.04);
  --shadow-lg:0 8px 32px rgba(15,23,42,.12),0 4px 12px rgba(15,23,42,.06);
}
/* Map legacy CSS vars to our new system so old JS still works */
:root{
  --color-background-primary:#fff;
  --color-background-secondary:var(--gray-50);
  --color-background-tertiary:var(--gray-100);
  --color-border-tertiary:var(--gray-200);
  --color-border-secondary:var(--gray-300);
  --color-text-primary:var(--gray-900);
  --color-text-secondary:var(--gray-600);
  --color-text-tertiary:var(--gray-400);
  --border-radius-md:var(--radius-md);
  --border-radius-lg:var(--radius-lg);
  --font-sans:'DM Sans',system-ui,sans-serif;
  --font-mono:'DM Mono',monospace;
}

/* ─── DARK TOKENS ─── */
html.dark{
  --blue:#60A5FA;--blue-light:#1E3A5F;--blue-mid:#1E3A8A;
  --green:#34D399;--green-light:#064E3B;--green-mid:#065F46;
  --red:#F87171;--red-light:#450A0A;--red-mid:#7F1D1D;
  --amber:#FCD34D;--amber-light:#451A03;--amber-mid:#78350F;
  --purple:#A78BFA;--purple-light:#2E1065;--purple-mid:#3B0764;
  --gray-50:#111827;--gray-100:#1a2235;--gray-200:#233047;
  --gray-300:#2e3d55;--gray-400:#7B8DAA;--gray-500:#8a9db5;
  --gray-600:#C8D8E8;--gray-700:#E2EBF5;--gray-800:#EAF1FA;--gray-900:#F0F6FF;
  --color-background-primary:#0d1424;
  --color-background-secondary:#111827;
  --color-background-tertiary:#1a2235;
  --color-border-tertiary:#233047;
  --color-border-secondary:#2e3d55;
  --color-text-primary:#F0F6FF;
  --color-text-secondary:#C8D8E8;
  --color-text-tertiary:#7B8DAA;
}


/* ═══════════════════════════════════════════════
   DARK MODE — redesign completo
   ═══════════════════════════════════════════════ */

/* Body background */
html.dark body { background: #0a0f1a; }

/* ── Topbar e Tabs: escuros ── */
html.dark .topbar {
  background: #0d1424;
  border-bottom-color: #1e2d45;
  box-shadow: 0 1px 0 #1e2d45, 0 2px 12px rgba(0,0,0,.4);
}
html.dark .topbar h1 { color: #e8f0fe; }
html.dark .topbar select {
  background: #162035;
  color: #a8bdd8;
  border-color: #1e2d45;
}
html.dark .tabs {
  background: transparent;
  border-bottom-color: transparent;
}
html.dark .tab { color: #6b84a3; }
html.dark .tab:hover { color: #8aafd4; background: #162035; }
html.dark .tab.on { color: #60a5fa; border-bottom-color: transparent; background: #0c2a4a; }
html.dark .sidebar {
  background: #0d1424;
  border-right-color: #1e2d45;
  box-shadow: 2px 0 8px rgba(0,0,0,.3);
}
html.dark .sidebar-brand h1 { color: #e8f0fe; }
html.dark .sidebar-footer { border-top-color: #1e2d45; }
html.dark .topbar .sidebar-toggle { background: #162035; border-color: #1e2d45; color: #a8bdd8; }

/* dark btn toggle */
html.dark .resultado-lbl { color: #fff !important; }
html.dark .resultado-val { color: #fff !important; }
html.dark #dk-btn { border-color: #1e2d45; color: #a8bdd8; }
html.dark #dk-btn:hover { background: #162035; border-color: #2e4060; }

/* ── Cards, Stats, etc ── */
html.dark .card,
html.dark .stat,
html.dark .acc-c,
html.dark .fixa-card,
html.dark .cat-card,
html.dark .proj-body,
html.dark .nav-btn,
html.dark .btn-g {
  background: #0f1e35;
  border-color: #1e2d45;
}

html.dark .card { box-shadow: 0 2px 12px rgba(0,0,0,.3); }
html.dark .stat:hover { box-shadow: 0 4px 20px rgba(0,0,0,.4); }

/* ── Textos gerais ── */
html.dark .ph h3 { color: #c8daf0; }
html.dark .stat .lbl { color: var(--gray-400); }
html.dark .fixa-name, html.dark .tx-desc { color: #d4e4f7; }
html.dark .fixa-sub, html.dark .tx-cat-name { color: var(--gray-500); }
html.dark .tx-acc-name, html.dark .tx-dot-sep { color: #3a5575; }
html.dark .id { color: #c8daf0; }
html.dark .im2 { color: var(--gray-400); }
html.dark .iv { color: #c8daf0; }

/* ── Item rows ── */
html.dark .item:hover { background: #162035; }
html.dark .tx-card:hover { background: #162035; }
html.dark .tx-day-label { color: #3a5575; }

/* ── TX Group ── */
html.dark .tx-group-header { background: #0a0f1a; border-color: #1e2d45; }
html.dark .tx-group-title { color: #7a9fcc; }
html.dark .tx-group-totals { color: #7a9fcc; }

/* ── Section label ── */
html.dark .sl { color: #3a5575; border-color: #1e2d45; }

/* ── Projection ── */
html.dark .proj-header { background: #0a0f1a; }
html.dark .proj-header:hover { background: #162035; }
html.dark .proj-header .ph-name { color: #c8daf0; }
html.dark .proj-row { border-color: #1e2d45; }
html.dark .proj-row .pr-name { color: #8aafd4; }
html.dark .proj-body { background: #0f1e35; }

/* ── Projeção — Detalhamento por mês (dark) ── */
html.dark .proj-month-mes-badge { background: #0c2a4a !important; color: #7ec8f7 !important; font-weight: 700 !important; }
html.dark .proj-header-month-name { color: #c8daf0 !important; font-weight: 700 !important; }
html.dark .proj-header-rec  { color: #34d399 !important; font-weight: 700 !important; }
html.dark .proj-header-exp  { color: #f87171 !important; font-weight: 700 !important; }
html.dark .proj-header-saldo-pos { color: #34d399 !important; font-weight: 700 !important; }
html.dark .proj-header-saldo-neg { color: #f87171 !important; font-weight: 700 !important; }
html.dark .proj-section-label { color: var(--gray-400) !important; font-weight: 700 !important; }
html.dark .proj-section-label-plan { color: #a78bfa !important; font-weight: 700 !important; }

/* ── Period & Fam chips ── */
html.dark .period-btn { background: #162035; color: var(--gray-400); border-color: #1e2d45; }
html.dark .period-btn:hover { color: #8aafd4; border-color: #2e4060; }
html.dark .period-btn.on { background: #1d4ed8; color: #e0eeff; border-color: #2563eb; box-shadow: 0 2px 10px rgba(37,99,235,.4); }
html.dark .fam-chip { background: #162035; color: var(--gray-400); border-color: #1e2d45; }
html.dark .fam-chip:hover { border-color: #2e4060; color: #8aafd4; }
html.dark .fam-chip.sel { background: #1e1050; color: #a78bfa; border-color: #5b21b6; }
html.dark .fam-badge { background: #1e1050; color: #a78bfa; }
html.dark .fam-edit-box { background: #1a1040; border-color: #3b1f80; }
html.dark .fam-edit-chip { background: #2e1070; color: #c4b5fd; }
html.dark .fam-edit-chip button { color: #a78bfa; }
html.dark .fam-edit-input { background: #162035; color: #c8daf0; border-color: #5b21b6; }

/* ── Forms ── */
html.dark .fr label { color: #3a5575; }
html.dark .fr input, html.dark .fr select, html.dark .fr textarea {
  background: #162035;
  color: #c8daf0;
  border-color: #1e2d45;
}
html.dark .fr input:focus, html.dark .fr select:focus, html.dark .fr textarea:focus {
  border-color: #3b82f6;
  box-shadow: 0 0 0 3px rgba(59,130,246,.15);
}

/* ── Type toggle ── */
html.dark .tb { background: #162035; color: var(--gray-400); border-color: #1e2d45; }
html.dark .tb.rec { background: #042f1e; color: #6ee7b7; border-color: #065f46; }
html.dark .tb.exp { background: #2d0a0a; color: #fca5a5; border-color: #7f1d1d; }
html.dark .tb.tr-type { background: #1e1050; color: #c4b5fd; border-color: #3b0764; }

/* ── Buttons ── */
html.dark .btn-r { background: #1d4ed8; color: #e0eeff; }
html.dark .btn-r:hover { background: #2563eb; box-shadow: 0 4px 16px rgba(37,99,235,.4); }
html.dark .btn-p { background: #5b21b6; color: #ede9fe; }
html.dark .btn-p:hover { background: #7c3aed; }
html.dark .btn-grn { background: #065f46; color: #d1fae5; }
html.dark .btn-grn:hover { background: #059669; }
html.dark .btn-g { background: #162035; border-color: #1e2d45; color: #7a9fcc; }
html.dark .btn-g:hover { background: #1e2d45; border-color: #2e4060; }
html.dark .btn-d { background: #2d0a0a; border-color: #7f1d1d; color: #fca5a5; }
html.dark .btn-d:hover { background: #450a0a; border-color: #ef4444; }
html.dark .btn-e { background: #0c1f40; border-color: #1e3a8a; color: #93c5fd; }
html.dark .btn-e:hover { background: #1e3a8a; border-color: #3b82f6; }
html.dark .copy-btn { background: #0c1f40; color: #93c5fd; border: 1px solid #1e3a8a; }
html.dark .copy-btn:hover { background: #1e3a8a; }
html.dark .nav-btn { background: #162035; border-color: #1e2d45; color: #7a9fcc; }
html.dark .nav-btn:hover { background: #1e2d45; border-color: #2e4060; }

/* ── Badges ── */
html.dark .b-pend { background: #291500; color: #fcd34d; }
html.dark .b-venc { background: #2d0a0a; color: #fca5a5; }
html.dark .b-rep  { background: #1e1050; color: #c4b5fd; }
html.dark .b-ok   { background: #042f1e; color: #6ee7b7; }
html.dark .b-tr   { background: #1e1050; color: #c4b5fd; }
html.dark .b-inativo { background: #162035; color: #3a5575; }

/* ── TX chips ── */
html.dark .tx-fam   { background: #1e1050; color: #c4b5fd; }
html.dark .tx-recur { background: #0c1f40; color: #93c5fd; }
html.dark .tx-recur-tip { background: #0a0f1a; color: #c8daf0; border: 1px solid #1e2d45; }
html.dark .tx-recur-tip::after { border-top-color: #0a0f1a; }

/* ── Transfer box ── */
html.dark .trbox { background: #1e1050; border-color: #4c1d95; }
html.dark .trs .tn { color: #ede9fe; }
html.dark .trs .tl, html.dark .trm .tv { color: #a78bfa; }
html.dark .trm .ti { color: #a78bfa; }

/* ── Misc ── */
html.dark .bar-bg { background: #162035; }
html.dark .progress-bar { background: #162035; }
html.dark .confirm { background: #2d0a0a; border-color: #7f1d1d; }
html.dark .confirm-dialog { background: #0f1e35; box-shadow: 0 24px 60px rgba(0,0,0,.5),0 8px 24px rgba(0,0,0,.35); }
html.dark .toast { background: #1e2d45; color: #e0eeff; box-shadow: 0 8px 32px rgba(0,0,0,.5); }
html.dark .swatch.sel { border-color: #60a5fa; box-shadow: 0 0 0 2px #0d1424, 0 0 0 4px #1e3a8a; }
html.dark .empty { color: #3a5575; }
html.dark #fam-chart-card { background: #0f1e35; border-color: #1e2d45; }
html.dark #fam-chart-card .ph { border-color: #1e2d45; }

/* ── Aba Cadastros — dark mode ── */
html.dark .cat-name { color: #c8daf0; }
html.dark .cat-card { background: #0f1e35; border-color: #1e2d45; }
html.dark .cat-card:hover { box-shadow: 0 4px 16px rgba(0,0,0,.35); }
html.dark .fam-member-chip { background: #1e1050 !important; border-color: #3b1f80 !important; }
html.dark .fam-member-chip span { color: #c4b5fd !important; }
html.dark .fam-member-chip button { color: #a78bfa !important; }
html.dark .fam-member-input { background: #162035 !important; color: #c8daf0 !important; border-color: #2e3d55 !important; }
html.dark .fam-member-input:focus { border-color: #3b82f6 !important; box-shadow: 0 0 0 3px rgba(59,130,246,.15) !important; }
html.dark .bar-row-label { color: #8aafd4 !important; }
html.dark .bar-row-pct { color: var(--gray-400) !important; }
html.dark .bar-row-val { color: #8aafd4 !important; }

/* ─── DARK TOGGLE BUTTON ─── */
#dk-btn{background:none;border:1.5px solid var(--gray-200);border-radius:var(--radius-lg);padding:6px 10px;font-size:16px;cursor:pointer;line-height:1;transition:background .2s,border-color .2s,transform .15s;flex-shrink:0}
#dk-btn:hover{background:var(--gray-50);border-color:var(--gray-300);transform:scale(1.05)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-sans);font-size:16px;background:var(--gray-100);color:var(--color-text-primary);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}

/* ─── APP SHELL (sidebar layout) ─── */
.app{background:var(--gray-100);min-height:100vh;max-width:100%}
.app-shell{display:flex;align-items:stretch;min-height:100vh}
.main-area{flex:1;min-width:0;display:flex;flex-direction:column;min-height:100vh}

/* ─── SIDEBAR ─── */
.sidebar{width:236px;flex-shrink:0;background:#fff;border-right:1px solid var(--gray-200);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;box-shadow:2px 0 8px rgba(15,23,42,.03);z-index:40}
.sidebar-brand{display:flex;align-items:center;gap:10px;padding:18px 16px;flex-shrink:0}
.sidebar-brand h1{font-size:16px;font-weight:700;color:var(--gray-900);letter-spacing:-.3px;line-height:1.2}

/* ─── TOPBAR (barra superior de filtros, dentro da área de conteúdo) ─── */
.topbar{background:#fff;border-bottom:1px solid var(--gray-200);padding:12px 20px;display:flex;align-items:center;justify-content:flex-end;gap:12px;box-shadow:0 1px 0 var(--gray-200),0 2px 8px rgba(15,23,42,.04);flex-shrink:0}
.topbar .sidebar-toggle{display:none}
.topbar select{font-size:14px;padding:7px 12px;border-radius:var(--radius-md);border:1.5px solid var(--gray-200);background:var(--gray-50);color:var(--gray-700);font-family:var(--font-sans);cursor:pointer;outline:none;transition:border-color .15s}
.topbar select:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.12)}

/* ─── TABS (navegação vertical na sidebar) ─── */
.tabs{display:flex;flex-direction:column;background:transparent;border-bottom:none;overflow-x:visible;overflow-y:auto;gap:2px;padding:4px 12px;flex:1;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:10px 12px;font-size:13.5px;font-weight:500;cursor:pointer;border:none;border-bottom:none;color:var(--gray-500);background:none;white-space:nowrap;display:flex;align-items:center;gap:10px;justify-content:flex-start;width:100%;transition:color .15s,background-color .15s;border-radius:var(--radius-md);font-family:var(--font-sans);letter-spacing:.01em;text-align:left}
.tab span{font-size:15px;flex-shrink:0}
.tab:hover{color:var(--gray-800);background:var(--gray-50)}
.tab.on{color:var(--blue);border-bottom-color:transparent;font-weight:600;background:var(--blue-light)}
.tab i{font-size:15px}

/* ─── Início: card principal "Saldo previsto" ─── */
.hero-card{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:20px;align-items:center;background:var(--color-background-primary);border:1px solid var(--gray-200);border-radius:var(--radius-lg);padding:22px 24px;box-shadow:var(--shadow-sm);position:relative;overflow:hidden}
.hero-card::before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:linear-gradient(180deg,var(--blue),var(--transfer))}
.hero-lbl{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--gray-500)}
.hero-val{font-family:var(--font-mono);font-size:38px;font-weight:600;letter-spacing:-1.2px;line-height:1.1;margin:6px 0 6px}
.hero-sub{font-size:13px;color:var(--gray-500);line-height:1.45}
.hero-break{margin:0;display:flex;flex-direction:column;gap:8px;border-left:1px solid var(--gray-200);padding-left:20px}
.hero-break>div{display:flex;justify-content:space-between;gap:12px;font-size:13.5px}
.hero-break dt{color:var(--color-text-secondary)}
.hero-hint{font-size:11px;color:var(--gray-400)}
.hero-break dd{margin:0;font-family:var(--font-mono);font-weight:600;white-space:nowrap;color:var(--color-text-primary)}
.hero-break .hero-link{align-self:flex-start;padding:4px 0 0;text-decoration:none;font-size:13px}
.hero-break .hero-link:hover{text-decoration:underline}
.hero-ok{font-size:12.5px;color:var(--income);display:flex;align-items:center;gap:6px;padding-top:4px}
@media(max-width:700px){
  .hero-card{grid-template-columns:1fr;padding:18px}
  .hero-val{font-size:30px}
  .hero-break{border-left:none;padding-left:0;border-top:1px solid var(--gray-200);padding-top:12px}
}

/* ─── Contas: subtítulo dos cards e grupos ─── */
.stat-sub{font-size:11.5px;color:var(--gray-500);margin-top:6px}
.acc-group-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--gray-500);margin:8px 2px 0}
.acc-group-title:first-child{margin-top:0}

/* ─── Relatórios: cabeçalho e filtros ─── */
.rel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.rel-btns{display:flex;gap:8px}
.rel-btns button{display:inline-flex;align-items:center;gap:6px;font-size:13px}
.rel-filt-toggle{display:none}
.rh-logo{color:var(--blue)}
/* ─── Início: despesas por categoria ─── */
.pie-wrap{display:flex;gap:16px;align-items:flex-start}
.pie-box{position:relative;width:130px;height:130px;flex-shrink:0}
.pie-list{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;padding-top:2px}
.pl-name{font-size:12.5px;color:var(--color-text-secondary);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl-pct{font-size:12.5px;font-weight:600;min-width:34px;text-align:right}
.pl-val{font-size:12.5px;color:var(--gray-500);font-family:var(--font-mono);white-space:nowrap;min-width:92px;text-align:right}
/* ─── Categorias: barra de seleção ─── */
.cat-sel-bar{display:none}
.lbl-short{display:none}
.cat-act-btn .ic{width:15px;height:15px}

.ia-spin{width:36px;height:36px;margin:0 auto;border-radius:50%;border:3px solid var(--blue-mid);border-top-color:var(--blue);animation:iaGira .8s linear infinite}
@keyframes iaGira{to{transform:rotate(360deg)}}
.ia-resumo{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px;flex-shrink:0}
.ia-resumo>div{background:var(--gray-50);border:1px solid var(--gray-200);border-radius:10px;padding:8px 12px;display:flex;flex-direction:column;gap:2px;min-width:120px}
.ia-resumo span{font-size:11px;font-weight:700;color:var(--gray-500);text-transform:uppercase;letter-spacing:.04em}
.ia-resumo strong{font-family:var(--font-mono);font-size:14px;color:var(--color-text-primary)}
.ia-resumo select{font-size:13px;padding:3px 6px;border-radius:6px;border:1px solid var(--gray-200);background:var(--color-background-primary);color:var(--color-text-primary)}
.ia-nota{font-size:12px;color:var(--gray-500);margin-bottom:12px;line-height:1.45;flex-shrink:0}
.ia-cfg{display:flex;flex-direction:column;gap:8px;width:100%;max-width:440px;padding:10px 12px;border:1px solid var(--gray-200);border-radius:10px;background:var(--gray-50)}
.ia-cfg label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:700;color:var(--gray-500);margin:0}
.ia-cfg input,.ia-cfg select{font-size:13px;padding:8px 10px;border-radius:8px;border:1.5px solid var(--gray-200);background:var(--color-background-primary);color:var(--color-text-primary);font-family:inherit}

/* ─── Cartões de crédito ─── */
.cc-cfg{background:var(--gray-50);border:1.5px solid var(--gray-200);border-radius:var(--radius-md);padding:10px 12px}
.cc-cfg-title{font-size:12px;font-weight:700;color:var(--color-text-primary);display:flex;align-items:center;gap:6px;margin-bottom:8px}
.cc-cfg-grid{display:grid;grid-template-columns:1fr 1fr 1.4fr;gap:10px;align-items:end}
.cc-cfg-grid label,.cc-cfg-lbl{display:flex;flex-direction:column;gap:4px;font-size:11px;font-weight:700;color:var(--gray-500);text-transform:uppercase;letter-spacing:.04em;margin:0}
.cc-cfg-grid>div{display:flex;flex-direction:column;gap:4px}
.cc-cfg-hint{font-size:11.5px;color:var(--gray-500);margin-top:8px}
.cc-parc-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.cc-parc-row select{width:auto;min-width:110px}
.cc-parc-info{font-size:12.5px;color:var(--gray-500)}
.cc-tabs{display:flex;gap:6px;flex-wrap:wrap}
.cc-tab{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:99px;border:1.5px solid var(--gray-200);background:var(--color-background-primary);color:var(--color-text-secondary);font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}
.cc-tab.on{border-color:var(--blue);color:var(--blue);background:var(--blue-light)}
.cc-head{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:20px;align-items:center}
.cc-name{display:flex;align-items:center;gap:8px;font-size:18px;font-weight:700;color:var(--color-text-primary)}
.cc-name .ic{color:var(--amber)}
.cc-dias{font-size:12.5px;color:var(--gray-500);margin-top:4px}
.cc-lim-top{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--gray-500);flex-wrap:wrap}
.cc-lim-top strong{color:var(--color-text-primary);font-family:var(--font-mono)}
.cc-lim-sub{font-size:11.5px;color:var(--gray-500)}
.cc-fat-nav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.cc-fat-tit{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:16px;color:var(--color-text-primary)}
.cc-st{display:inline-block;font-size:11px;font-weight:700;border-radius:99px;padding:2px 9px;white-space:nowrap}
.cc-st-blue{background:var(--blue-light);color:var(--blue)}
.cc-st-amber{background:var(--amber-light);color:var(--amber)}
.cc-st-red{background:var(--expense-bg);color:var(--expense)}
.cc-st-green{background:var(--income-bg);color:var(--income)}
.cc-st-gray{background:var(--gray-100);color:var(--gray-500)}
.cc-fat-resumo{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:12px}
.cc-fat-resumo>div{background:var(--gray-50);border:1px solid var(--gray-200);border-radius:var(--radius-md);padding:10px 12px;display:flex;flex-direction:column;gap:3px;min-width:0}
.cc-fat-resumo span{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--gray-500)}
.cc-fat-resumo strong{font-family:var(--font-mono);font-size:15px;color:var(--color-text-primary);white-space:nowrap}
.cc-fat-resumo .cc-datas{font-size:13px}
.cc-fat-acoes{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.cc-fat-acoes button{display:inline-flex;align-items:center;gap:6px}
.cc-itens{display:flex;flex-direction:column;border-top:1px solid var(--gray-100);margin-top:6px}
.cc-itens.sel-modo .cc-item{grid-template-columns:22px 48px minmax(0,1fr) auto}
.cc-item.marcado{background:var(--blue-light)}
.cc-chk{width:16px;height:16px;margin:0;accent-color:var(--blue);pointer-events:none}
.cc-tag-pdf{font-size:10px;font-weight:700;color:var(--gray-500);border:1px solid var(--gray-200);border-radius:4px;padding:0 4px}
.cc-sel-barra{position:sticky;top:64px;z-index:5;display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px;padding:8px 10px;border:1px solid var(--blue);border-radius:var(--radius-md);background:var(--color-background-primary);box-shadow:0 4px 14px rgba(15,23,42,.12)}
.cc-sel-todos{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;margin:0;text-transform:none;letter-spacing:0;color:var(--color-text-primary);cursor:pointer}
.cc-sel-todos input{width:16px;height:16px;accent-color:var(--blue);margin:0}
.cc-sel-rapido{display:flex;gap:6px;flex-wrap:wrap}
.cc-sel-info{margin-left:auto;font-size:13px;color:var(--color-text-secondary);white-space:nowrap}
.cc-sel-barra .btn-del{display:flex;align-items:center;gap:6px;background:var(--expense);color:#fff;border:1px solid var(--expense);border-radius:var(--radius-md);padding:8px 14px;font-weight:700;font-size:13px;cursor:pointer;font-family:inherit}
.cc-sel-barra .btn-del:disabled{opacity:.45;cursor:not-allowed}
.cc-del-lista{margin:6px 0 8px;padding-left:18px;font-size:12.5px;text-align:left;max-height:150px;overflow:auto}
html.dark .cc-item.marcado{background:#13254a}
html.dark .cc-sel-barra{background:#0f1e35;border-color:#3b82f6}
html.dark .cc-sel-barra .btn-del{background:#dc2626;border-color:#dc2626}
@media (max-width:600px){ .cc-sel-barra{top:auto;bottom:12px;position:sticky} .cc-sel-info{margin-left:0;flex:1 1 100%} .cc-sel-barra .btn-del,.cc-sel-barra .btn-g{flex:1;justify-content:center} }
.cc-item{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--gray-100);cursor:pointer}
.cc-item:hover{background:var(--gray-50)}
.cc-item.pag{cursor:default;background:var(--income-bg)}
.cc-item-dt{font-size:12.5px;color:var(--gray-500);font-family:var(--font-mono)}
.cc-item-desc{display:flex;flex-direction:column;min-width:0}
.cc-item-desc>span{font-size:14px;font-weight:600;color:var(--color-text-primary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cc-item-desc small{font-size:12px;color:var(--gray-500);display:flex;align-items:center;gap:5px}
.cc-item-val{font-family:var(--font-mono);font-weight:600;font-size:14px;white-space:nowrap;color:var(--color-text-primary)}
.cc-mini{font-size:12px;color:var(--gray-500)}
.cc-prox{display:flex;flex-direction:column;gap:4px}
.cc-prox-row{display:grid;grid-template-columns:62px minmax(0,1fr) 110px 110px;gap:10px;align-items:center;padding:7px 8px;border-radius:8px;border:1px solid transparent;background:none;cursor:pointer;font-family:inherit;text-align:left;color:var(--color-text-primary)}
.cc-prox-row:hover{background:var(--gray-50)}
.cc-prox-row.on{border-color:var(--blue-mid);background:var(--blue-light)}
.cc-prox-mes{font-size:13px;font-weight:600}
.cc-prox-bar{height:8px;border-radius:99px;background:var(--gray-100);overflow:hidden}
.cc-prox-bar span{display:block;height:100%;background:var(--amber);border-radius:99px}
.cc-prox-val{font-family:var(--font-mono);font-size:13px;font-weight:600;text-align:right}
.cc-pay-chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.cc-chip{font-size:12px;font-weight:600;border:1.5px solid var(--gray-200);background:var(--color-background-primary);color:var(--color-text-secondary);border-radius:99px;padding:5px 11px;cursor:pointer;font-family:inherit}
.cc-chip:hover{border-color:var(--blue);color:var(--blue)}
.cc-alerta{display:flex;flex-direction:column;gap:8px;border-color:var(--amber-mid)}
.cc-alerta-row{display:flex;align-items:center;gap:12px}
.cc-alerta-row>.ic{color:var(--amber)}
.cc-alerta-row.venc>.ic{color:var(--expense)}
.cc-alerta-txt{flex:1;min-width:0;display:flex;flex-direction:column;font-size:13px;color:var(--gray-500)}
.cc-alerta-txt strong{font-size:14px;color:var(--color-text-primary)}
.cc-alerta-row.venc .cc-alerta-txt span{color:var(--expense);font-weight:600}
.tx-fat{font-size:10px;font-weight:700;color:var(--amber);background:var(--amber-light);border-radius:99px;padding:1px 7px;white-space:nowrap}

.rg-wrap{display:flex;flex-direction:column;gap:12px}
.rg-wrap select,.rg-wrap input{font-size:14px;padding:10px 12px;border-radius:var(--radius-md);border:1.5px solid var(--gray-200);background:var(--color-background-primary);color:var(--color-text-primary);min-height:44px;font-family:inherit;box-sizing:border-box;outline:none}
.rg-wrap select:focus,.rg-wrap input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.15)}
html.dark .rg-wrap select,html.dark .rg-wrap input{background:#162035;border-color:#1e2d45;color:#c8daf0}
.rg-teste input{min-height:38px}
.rg-intro{font-size:13px;color:var(--color-text-secondary);line-height:1.55;margin:0}
.rg-form{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) auto;gap:10px;align-items:end;padding:12px;border:1px solid var(--gray-200);border-radius:var(--radius-lg);background:var(--color-background-secondary)}
.rg-form.editando{border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.rg-campo label{display:block;font-size:11px;font-weight:700;color:var(--gray-500);text-transform:uppercase;letter-spacing:.04em;margin-bottom:5px}
.rg-linha{display:flex;gap:6px}
.rg-linha select{flex:0 0 auto;width:auto;min-width:118px}
.rg-linha input{flex:1;min-width:0}
.rg-botoes{display:flex;gap:6px}
.rg-botoes .btn-r,.rg-botoes .btn-g{display:flex;align-items:center;gap:6px;white-space:nowrap;min-height:44px}
.rg-teste{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px}
.rg-teste label{font-size:11px;font-weight:700;color:var(--gray-500);text-transform:uppercase;letter-spacing:.04em;margin:0}
.rg-teste input{flex:1 1 260px;min-width:0;font-size:13px!important;padding:7px 10px!important}
.rg-teste-res{flex:1 1 100%;display:flex;align-items:center;gap:6px;flex-wrap:wrap;min-height:20px}
.rg-teste-sim{display:inline-flex;align-items:center;gap:6px;font-weight:700;color:var(--color-text-primary)}
.rg-teste-por,.rg-teste-vazio{color:var(--gray-500)}
.rg-teste-nao{color:var(--amber)}
.rg-barra{display:flex;align-items:center;gap:10px;flex-wrap:wrap;border-top:1px solid var(--gray-100);padding-top:12px}
.rg-busca{display:flex;align-items:center;gap:6px;flex:1 1 200px;border:1px solid var(--gray-200);border-radius:8px;padding:0 10px;color:var(--gray-500)}
.rg-busca input{border:0!important;background:transparent!important;box-shadow:none!important;padding:8px 0!important;font-size:13px!important;flex:1;min-width:0}
.rg-qtd{font-size:12px;color:var(--gray-500)}
.rg-barra .btn-g{display:flex;align-items:center;gap:6px}
.rg-lista{display:flex;flex-direction:column;border:1px solid var(--gray-200);border-radius:var(--radius-lg);overflow:hidden}
.rg-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-bottom:1px solid var(--gray-100);font-size:13.5px}
.rg-item:last-child{border-bottom:0}
.rg-item:hover{background:var(--gray-50)}
.rg-item.editando{background:var(--blue-light)}
.rg-se{flex:1 1 40%;min-width:0;display:flex;align-items:center;gap:7px}
.rg-modo{font-size:11px;color:var(--gray-500);white-space:nowrap}
.rg-txt{font-weight:700;font-family:var(--font-mono,ui-monospace,monospace);font-size:13px;background:var(--gray-100);border-radius:6px;padding:2px 8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rg-seta{color:var(--gray-400);flex-shrink:0}
.rg-cat{flex:1 1 40%;min-width:0;display:flex;align-items:center;gap:7px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.rg-cat span:last-child{overflow:hidden;text-overflow:ellipsis}
.rg-orfa{color:var(--expense);font-style:italic}
.rg-usos{font-size:11.5px;color:var(--gray-500);white-space:nowrap}
.rg-item .row-actions{display:flex;gap:2px}
.csv-regra{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:6px;border:1px solid var(--gray-200);background:none;color:var(--gray-500);cursor:pointer;font-size:13px;flex-shrink:0;padding:0}
.csv-regra:hover{border-color:var(--amber);color:var(--amber);background:var(--amber-light)}
.csv-filtro{display:flex;align-items:center;gap:6px;flex:1 1 260px;min-width:220px;max-width:420px;padding:0 8px 0 10px;height:30px;border-radius:8px;border:1px solid var(--gray-200);background:var(--color-background-primary,#fff);color:var(--gray-500)}
.csv-filtro:focus-within{border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.15)}
.csv-filtro.on{border-color:var(--blue)}
.csv-filtro input{flex:1;min-width:0;border:none;outline:none;background:none;font-size:12.5px;font-family:var(--font-sans);color:var(--color-text-primary);padding:0;height:100%}
.csv-filtro input::-webkit-search-cancel-button{display:none}
.csv-filtro-n{font-size:11px;font-weight:600;color:var(--blue);white-space:nowrap}
.csv-filtro-x{border:none;background:none;cursor:pointer;color:var(--gray-500);font-size:12px;padding:2px 4px;line-height:1}
.csv-filtro-x:hover{color:var(--expense)}
html.dark .csv-filtro{background:#162035;border-color:#2e3d55;color:#8aafd4}
html.dark .csv-filtro input{color:#e0eeff}
html.dark .csv-filtro.on,html.dark .csv-filtro:focus-within{border-color:#3b82f6}
html.dark .csv-filtro-n{color:#93c5fd}
.csv-ver{display:inline-flex;border:1px solid var(--gray-200);border-radius:8px;overflow:hidden;height:30px;flex-shrink:0}
.csv-ver button{border:none;border-right:1px solid var(--gray-200);background:var(--color-background-primary,#fff);color:var(--gray-500);font-size:12px;font-family:var(--font-sans);padding:0 10px;cursor:pointer;white-space:nowrap}
.csv-ver button:last-child{border-right:none}
.csv-ver button b{font-weight:700;margin-left:2px}
.csv-ver button:hover{color:var(--color-text-primary)}
.csv-ver button.on{background:var(--blue);color:#fff}
.csv-ver button.sim.on{background:var(--income)}
.csv-ver button.nao.on{background:#64748B}
html.dark .csv-ver{border-color:#2e3d55}
html.dark .csv-ver button{background:#162035;color:#8aafd4;border-color:#2e3d55}
html.dark .csv-ver button.on{color:#fff;background:#2563EB}
html.dark .csv-ver button.sim.on{background:#047857}
html.dark .csv-ver button.nao.on{background:#475569}
.csv-tot{margin-right:auto;display:flex;flex-direction:column;gap:4px;min-width:0}
.csv-tot-lin{display:flex;align-items:stretch;gap:6px;flex-wrap:wrap}
.csv-tot-tit{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--gray-500);padding:4px 6px 0 0;line-height:1.35}
.csv-tot-tit span{font-weight:500;text-transform:none;letter-spacing:0}
.csv-tot-c{display:flex;flex-direction:column;gap:1px;padding:5px 12px;border-radius:10px;border:1px solid var(--gray-200);background:var(--gray-50);min-width:110px}
.csv-tot-c span{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--gray-500)}
.csv-tot-c strong{font-family:var(--font-mono);font-size:14px;font-variant-numeric:tabular-nums;white-space:nowrap}
.csv-tot-c.rec strong{color:var(--income)}
.csv-tot-c.desp strong{color:var(--expense)}
.csv-tot-c.saldo.pos{border-color:var(--income)}.csv-tot-c.saldo.pos strong{color:var(--income)}
.csv-tot-c.saldo.neg{border-color:var(--expense)}.csv-tot-c.saldo.neg strong{color:var(--expense)}
.csv-tot-filtro{font-size:11.5px;color:var(--gray-500)}
.csv-tot-filtro strong{color:var(--color-text-primary);font-family:var(--font-mono)}
html.dark .csv-tot-c{background:#0a0f1a;border-color:#1e2d45}
html.dark .csv-tot-c.rec strong,html.dark .csv-tot-c.saldo.pos strong{color:#34d399}
html.dark .csv-tot-c.desp strong,html.dark .csv-tot-c.saldo.neg strong{color:#f87171}
html.dark .csv-tot-c.saldo.pos{border-color:#065f46}html.dark .csv-tot-c.saldo.neg{border-color:#7f1d1d}
html.dark .csv-tot-filtro strong{color:#e0eeff}
.tx-semconta{border:1px dashed var(--amber);background:var(--amber-light);color:var(--amber);font-size:11px;font-weight:700;border-radius:6px;padding:2px 7px;cursor:pointer;white-space:nowrap;font-family:var(--font-sans)}
.tx-semconta:hover{border-style:solid}
.tx-semconta-btn{border-color:var(--amber)!important;color:var(--amber)!important}
html.dark .tx-semconta{background:#3a2a06;color:#fbbf24;border-color:#b45309}
.recat-n{display:inline-block;min-width:18px;padding:0 5px;margin-left:2px;border-radius:999px;background:var(--gray-200);color:var(--color-text-primary);font-size:11px;font-weight:700;line-height:18px;text-align:center}
html.dark .recat-n{background:#2e3d55;color:#e0eeff}
.csv-orig{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;border-radius:6px;font-size:11px;cursor:help;flex-shrink:0;background:var(--gray-50);color:var(--gray-500)}
.csv-orig.vazio{opacity:.5}
.csv-orig.o-ia{background:#f3e8ff}.csv-orig.o-historico{background:#e0f2fe}.csv-orig.o-palavra{background:#f1f5f9}.csv-orig.o-planilha{background:#ecfdf5}.csv-orig.o-regra{background:#fef3c7}.csv-orig.o-manual{background:#eff6ff}
.csv-cat-resumo{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:12px;color:var(--gray-500);margin:-4px 0 10px;flex-shrink:0}
.csv-cat-resumo strong{color:var(--color-text-primary);font-weight:600;margin-right:2px}
.csv-cr{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;border:1px solid var(--gray-200);background:var(--gray-50);white-space:nowrap;cursor:help}
.csv-cr.o-nenhuma{border-style:dashed}
.csv-cat-nota{font-size:11.5px;color:var(--gray-500);margin:-4px 0 10px;line-height:1.5;flex-shrink:0}
html.dark .csv-orig,html.dark .csv-cr{background:#162035;border-color:#1e2d45}
.csv-regra.on{border-color:var(--amber);background:var(--amber-light);color:var(--amber)}
.csv-rg-auto{display:flex;align-items:center;gap:10px;border:1px dashed var(--gray-300,#cbd5e1);border-radius:10px;padding:8px 14px;font-size:12px;cursor:pointer;margin:0;text-transform:none;letter-spacing:0;font-weight:400}
.csv-rg-auto.on{border-style:solid;border-color:var(--amber);background:var(--amber-light)}
.csv-rg-auto input{width:16px;height:16px;accent-color:var(--amber);margin:0}
.csv-rg-tit{color:var(--color-text-secondary)}
.csv-rg-auto strong{font-size:16px;color:var(--color-text-primary)}
.csv-rg-sub{color:var(--color-text-secondary)}
html.dark .csv-rg-auto{border-color:#2b4672}
html.dark .csv-rg-auto.on{background:#2a1f06;border-color:#b45309}
.rg-auto{font-size:10.5px;font-weight:700;color:#92400e;background:var(--amber-light);border:1px solid #f59e0b;border-radius:99px;padding:0 7px;white-space:nowrap;cursor:help}
html.dark .rg-auto{color:#fcd34d;background:#2a1f06;border-color:#b45309}
.rg-item.auto{background:linear-gradient(90deg,rgba(245,158,11,.08),transparent 40%)}
.icon-btn.ok-rg{color:var(--income)}
.rg-filtros{display:flex;gap:6px;flex-wrap:wrap}
.rg-chip{font-size:12px;font-weight:600;padding:5px 11px;border-radius:99px;border:1px solid var(--gray-200);background:none;color:var(--color-text-secondary);cursor:pointer;font-family:inherit}
.rg-chip.on{background:var(--blue-light);border-color:var(--blue);color:var(--blue)}
html.dark .rg-chip{border-color:#1e2d45}
.rg-opcao{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--color-text-secondary);text-transform:none;letter-spacing:0;font-weight:500;margin:0;cursor:pointer}
.rg-opcao input{width:16px!important;height:16px!important;min-height:0!important;padding:0!important;accent-color:var(--amber)}
.csv-cat-cel{display:flex;align-items:center;gap:6px;justify-content:flex-start}
html.dark .rg-form{background:#0b1729;border-color:#1e2d45}
html.dark .rg-lista,html.dark .rg-busca{border-color:#1e2d45}
html.dark .rg-item{border-color:#1e2d45}
html.dark .rg-item:hover{background:#13213a}
html.dark .rg-item.editando{background:#13254a}
html.dark .rg-txt{background:#1e2d45}
html.dark .rg-barra{border-color:#1e2d45}
html.dark .csv-regra{border-color:#1e2d45}
html.dark .csv-regra:hover,html.dark .csv-regra.on{background:#3a2a06;color:#fbbf24;border-color:#b45309}
@media (max-width:600px){
  .rg-form{grid-template-columns:minmax(0,1fr)}
  .rg-botoes{justify-content:flex-end}
  .rg-item{flex-wrap:wrap;gap:6px 8px}
  .rg-se{flex:1 1 100%}
  .rg-seta{display:none}
  .rg-cat{flex:1 1 auto}
  .cat-tabs{display:flex!important;overflow-x:auto;scrollbar-width:none}
  .cat-tabs::-webkit-scrollbar{display:none}
  .cat-tab-btn{flex:0 0 auto;padding:9px 10px!important}
  .rg-linha select{min-width:104px}
}

/* ─── Bloqueio de exclusão ─── */
.vinc-lista{margin:8px 0 10px;padding-left:20px;text-align:left;font-size:13px;line-height:1.6;color:var(--color-text-primary)}
.vinc-dica{display:block;font-size:12.5px;color:var(--color-text-secondary);line-height:1.5;text-align:left}
/* ─── Painel de controles ─── */
canvas{max-width:100%}
.ctl-panel{box-sizing:border-box}
#accSel{width:190px;max-width:190px;text-overflow:ellipsis}
.ctl-panel{position:absolute;top:calc(100% + 4px);left:0;z-index:80;background:var(--color-background-primary);border:1px solid var(--gray-200);border-radius:var(--radius-md);box-shadow:0 8px 24px rgba(0,0,0,.25);min-width:260px;max-height:340px;overflow-y:auto;padding:8px}
.ctl-panel-title{font-size:10.5px;font-weight:700;color:var(--gray-500);text-transform:uppercase;letter-spacing:.3px;padding:2px 6px 6px}
.ctl-row{display:flex;align-items:stretch;gap:4px;border-radius:8px;margin-bottom:2px}
.ctl-abrir{flex:1;min-width:0;display:flex;align-items:center;gap:9px;padding:9px 8px;background:none;border:1px solid transparent;border-radius:8px;cursor:pointer;font-family:inherit;font-size:13px;font-weight:500;color:var(--color-text-primary);text-align:left}
.ctl-abrir:hover{background:var(--gray-100)}
.ctl-abrir:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
.ctl-radio{width:16px;height:16px;border-radius:50%;border:2px solid var(--gray-300,#cbd5e1);flex-shrink:0;box-sizing:border-box}
.ctl-row.atual .ctl-abrir{background:var(--blue-light);border-color:var(--blue-mid);font-weight:700}
.ctl-row.atual .ctl-radio{border:5px solid var(--blue)}
.ctl-nome{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.ctl-ativo{font-size:10px;font-weight:700;color:var(--blue);background:var(--color-background-primary);border-radius:99px;padding:1px 7px;flex-shrink:0}
.ctl-somar{display:flex;align-items:center;align-self:center;gap:4px;height:24px;padding:0 7px;margin:0 4px 0 0;border:1px solid var(--gray-200);border-radius:6px;cursor:pointer;font-size:10.5px;font-weight:600;color:var(--color-text-secondary);text-transform:none;letter-spacing:0;flex-shrink:0;user-select:none}
.ctl-somar:hover{background:var(--gray-100)}
.ctl-somar input{width:12px;height:12px;margin:0;cursor:pointer;accent-color:var(--blue)}
.ctl-somar.unico{opacity:.55;cursor:default}.ctl-somar.unico input{cursor:default}
.ctl-somar.on{border-color:var(--blue-mid);color:var(--blue);background:var(--blue-light)}
.ctl-panel-btns{display:flex;gap:6px;margin-top:6px;padding-top:6px;border-top:1px solid var(--gray-100)}
.ctl-panel-btns button{flex:1;font-size:11px;font-weight:600;color:var(--color-text-secondary);background:var(--color-background-secondary);border:1px solid var(--gray-200);border-radius:6px;padding:6px;cursor:pointer;font-family:inherit}
.ctl-panel-note{font-size:11.5px;color:var(--amber);padding:8px 4px 2px;line-height:1.45;min-height:4.4em}
.ctl-panel-note.neutra{color:var(--gray-500)}

/* ─── Estados vazios ─── */
.empty-state{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:34px 16px}
.es-ic{width:52px;height:52px;border-radius:16px;background:var(--blue-light);color:var(--blue);display:flex;align-items:center;justify-content:center;margin-bottom:6px}
.es-ic .ic{width:24px;height:24px}
.es-title{font-size:15px;font-weight:700;color:var(--color-text-primary)}
.es-text{font-size:13px;color:var(--gray-500);max-width:380px;line-height:1.5}
.es-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:10px}
.es-actions button{display:inline-flex;align-items:center;gap:6px}
/* ─── Primeiros passos ─── */
.onb{border:1.5px solid var(--blue-mid)}
.onb-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.onb-title{font-size:16px;font-weight:700;color:var(--color-text-primary)}
.onb-sub{font-size:12.5px;color:var(--gray-500);margin-top:2px}
.onb-bar{height:6px;border-radius:99px;background:var(--gray-100);margin:12px 0 6px;overflow:hidden}
.onb-bar div{height:100%;background:var(--blue);border-radius:99px;transition:width .3s}
.onb-steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.onb-steps li{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--gray-100)}
.onb-steps li:first-child{border-top:none}
.onb-n{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;background:var(--gray-100);color:var(--gray-500);flex-shrink:0}
.onb-steps li.next .onb-n{background:var(--blue);color:#fff}
.onb-steps li.done .onb-n{background:var(--income-bg);color:var(--income)}
.onb-steps li.done strong{text-decoration:line-through;color:var(--gray-500)}
.onb-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.onb-txt strong{font-size:14px;color:var(--color-text-primary)}
.onb-txt span{font-size:12.5px;color:var(--gray-500)}
.onb-steps button{flex-shrink:0;white-space:nowrap}
.onb-foot{font-size:12.5px;color:var(--gray-500);border-top:1px solid var(--gray-100);padding-top:10px;margin-top:2px}
/* ─── Contas fixas vencidas ─── */
.alert-overdue{display:flex;gap:12px;align-items:flex-start;background:var(--expense-bg);border:1px solid var(--expense-border);color:var(--expense);border-radius:var(--radius-md);padding:12px 14px;margin:6px 0 12px;font-size:13.5px}
.alert-overdue strong{color:var(--expense)}
.alert-overdue>div{color:var(--color-text-primary)}
.ao-list{font-size:12.5px;color:var(--gray-500);margin-top:3px}
.tag-venc{display:inline-block;font-size:11px;font-weight:700;color:var(--expense);background:var(--expense-bg);border:1px solid var(--expense-border);border-radius:99px;padding:1px 7px;margin-left:6px;vertical-align:1px}
.tx-card.overdue .tx-cell-icon{box-shadow:inset 3px 0 0 var(--expense)}
/* ─── Orçamento ─── */
.orc-empty{font-size:13px;color:var(--gray-500);line-height:1.5}
.orc-total{font-size:13px;color:var(--gray-500);margin:-6px 0 12px}
.orc-total strong{color:var(--color-text-primary);font-family:var(--font-mono)}
.orc-list{display:flex;flex-direction:column;gap:14px}
.orc-top{display:flex;align-items:center;gap:8px;font-size:13.5px}
.orc-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;display:inline-block}
.orc-name{flex:1;min-width:0;font-weight:600;color:var(--color-text-primary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.orc-val{font-family:var(--font-mono);font-size:13px;font-weight:600;white-space:nowrap;color:var(--color-text-primary)}
.orc-val span{color:var(--gray-500);font-weight:400}
.orc-bar{height:8px;border-radius:99px;background:var(--gray-100);margin:6px 0 4px;overflow:hidden}
.orc-bar div{height:100%;border-radius:99px;background:var(--income)}
.orc-row.warn .orc-bar div{background:var(--amber)}
.orc-row.over .orc-bar div{background:var(--expense)}
.orc-info{font-size:12px;color:var(--gray-500)}
.orc-row.warn .orc-info{color:var(--amber)}
.orc-row.over .orc-info{color:var(--expense);font-weight:600}
.orc-help{font-size:12.5px;color:var(--gray-500);margin:-4px 0 12px;line-height:1.5}
.orc-form{display:flex;flex-direction:column;gap:8px;max-height:55vh;overflow:auto;padding-right:2px}
.orc-form-row{display:grid;grid-template-columns:minmax(0,1fr) 170px;gap:10px;align-items:center}
.orc-form-row label{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600;color:var(--color-text-primary);text-transform:none;letter-spacing:0;margin:0;flex-wrap:wrap}
.orc-form-row small{font-weight:400;color:var(--gray-500);font-size:11.5px;width:100%;padding-left:16px}
/* ─── Projeção ─── */
.proj-chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.proj-chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--gray-500);background:var(--gray-50);border:1px solid var(--gray-200);border-radius:99px;padding:6px 12px}
.proj-chip strong{color:var(--color-text-primary)}
.proj-chip .val-income,.proj-chip .val-expense{font-family:var(--font-mono);font-weight:600}
.proj-sec{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--gray-500);margin:14px 2px 6px}
.proj-sec:first-of-type{margin-top:4px}
.proj-sec span{text-transform:none;letter-spacing:0;font-weight:400}
.proj-sec-futuro{color:var(--transfer)}
.proj-month.proj-futuro{border-style:dashed;background:transparent}
.proj-month.proj-futuro .proj-header-month-name{color:var(--gray-600)}

/* ─── Título da página na topbar ─── */
.page-title{margin:0 auto 0 0;display:flex;align-items:center;gap:9px;font-size:18px;font-weight:700;letter-spacing:-.3px;color:var(--color-text-primary);min-width:0;white-space:nowrap}
.page-title span{overflow:hidden;text-overflow:ellipsis}
.page-title .ic{color:var(--blue)}
/* ─── Ícones de tipo de conta ─── */
.acc-ic{width:40px;height:40px;border-radius:11px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.acc-ic .ic{width:20px;height:20px}
.acc-ic.sm{width:24px;height:24px;border-radius:7px}.acc-ic.sm .ic{width:14px;height:14px}
.acc-ic-blue{background:var(--blue-light);color:var(--blue)}
.acc-ic-green{background:var(--income-bg);color:var(--income)}
.acc-ic-amber{background:var(--amber-light);color:var(--amber)}
.acc-ic-teal{background:#E6FAF5;color:#0F766E}
.acc-ic-purple{background:var(--transfer-bg);color:var(--transfer)}
.acc-ic-gray{background:var(--gray-100);color:var(--gray-500)}
html.dark .acc-ic-teal{background:#08332e;color:#5EEAD4}
/* ─── Contas fixas: ícone e seletor ─── */
.tx-icon.inativa{background:var(--gray-100);color:var(--gray-400)}
.ic-pick{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:9px;border:1.5px solid var(--gray-200);background:var(--color-background-primary);color:var(--gray-500);cursor:pointer}
.ic-pick .ic{width:17px;height:17px}
.ic-pick:hover{color:var(--color-text-primary)}
.ic-pick.on{border-color:var(--blue);background:var(--blue-light);color:var(--blue)}
.proj-ic{display:inline-flex;color:var(--gray-500)}
.fam-ic{display:inline-flex;color:var(--gray-500);flex-shrink:0}
.tx-fam .ic{width:11px;height:11px;vertical-align:-1px}
/* ─── Categorias: dica no lugar de botões desabilitados ─── */
.cat-tree-actions .cat-act-btn:disabled{display:none}
.cat-hint{font-size:12px;color:var(--gray-500);line-height:1.45;padding:2px 2px 4px}

/* ─── Ícones (sprite Lucide) ─── */
.ic{width:16px;height:16px;flex-shrink:0;vertical-align:-3px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ic.lg{width:20px;height:20px}
.ic.sm{width:14px;height:14px}
.tabs .tab .ic{width:18px;height:18px;opacity:.85}
/* Botões de ação só com ícone (editar/duplicar/excluir) */
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;padding:0;border-radius:7px;border:1px solid var(--gray-200);background:var(--color-background-primary);color:var(--gray-500);cursor:pointer;transition:background .12s,color .12s,border-color .12s}
.icon-btn .ic{width:15px;height:15px}
.icon-btn:hover{background:var(--gray-100);color:var(--color-text-primary)}
.icon-btn:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
.icon-btn.copy:hover{color:var(--blue);border-color:var(--blue-mid);background:var(--blue-light)}
.icon-btn.edit:hover{color:var(--income);border-color:var(--income-border);background:var(--income-bg)}
.icon-btn.del:hover{color:var(--danger);border-color:var(--expense-border);background:var(--expense-bg)}
.icon-btn.play:hover{color:var(--blue);border-color:var(--blue-mid);background:var(--blue-light)}
.row-actions{display:inline-flex;gap:4px;align-items:center}
.tx-ch-actions.act3,.tx-cell-actions.act3{width:112px}
/* Ícone de tipo na linha do extrato */
.tx-icon.receita{background:var(--income-bg);color:var(--income)}
.tx-icon.despesa{background:var(--expense-bg);color:var(--expense)}
.tx-icon.transferencia{background:var(--transfer-bg);color:var(--transfer)}
.tx-icon .ic{width:14px;height:14px;stroke-width:2.5}
.val-income{color:var(--income)}.val-expense{color:var(--expense)}.val-transfer{color:var(--transfer)}

/* ─── Extrato: filtros ─── */
.lanc-filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 10px}
.lanc-search{flex:1 1 260px;display:flex;align-items:center;gap:8px;border:1.5px solid var(--gray-200);border-radius:var(--radius-md);padding:0 10px;background:var(--color-background-primary);min-width:0}
.lanc-search:focus-within{border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.lanc-search input{flex:1;border:none;outline:none;background:transparent;font-size:14px;padding:9px 0;color:var(--color-text-primary);font-family:inherit;min-width:0}
.lanc-search input::-webkit-search-cancel-button{cursor:pointer}
.kbd-hint{font-family:var(--font-mono);font-size:11px;color:var(--gray-500);border:1px solid var(--gray-200);border-radius:4px;padding:0 5px;line-height:18px}
.lanc-filter-sel{font-size:13px;padding:8px 10px;border:1.5px solid var(--gray-200);border-radius:var(--radius-md);background:var(--color-background-primary);color:var(--color-text-primary);font-family:inherit;max-width:100%}
.lanc-filter-info{font-size:12.5px;color:var(--gray-500);margin:-2px 0 10px}
.link-btn{background:none;border:none;color:var(--blue);font-weight:600;cursor:pointer;padding:0 0 0 4px;font-size:inherit;font-family:inherit;text-decoration:underline}
/* ─── Campo de valor com máscara R$ ─── */
.money-field{display:flex;align-items:center;border:1.5px solid var(--gray-200);border-radius:var(--radius-md);background:var(--color-background-primary);overflow:hidden}
.money-field:focus-within{border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.money-prefix{padding:0 4px 0 11px;font-size:14px;font-weight:600;color:var(--gray-500)}
.money-field input{flex:1;border:none!important;box-shadow:none!important;outline:none;background:transparent;font-family:var(--font-mono);font-size:15px;text-align:right;padding:9px 11px 9px 4px;min-width:0;color:var(--color-text-primary)}
.money-sign{border:none;border-left:1.5px solid var(--gray-200);background:var(--gray-50);color:var(--gray-600);font-weight:700;font-size:15px;padding:0 12px;align-self:stretch;cursor:pointer}
/* ─── Aviso "Excluído · Desfazer" ─── */
.undo-toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);display:flex;align-items:center;gap:6px;background:#1E293B;color:#F1F5F9;border-radius:12px;padding:8px 8px 8px 16px;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.3);opacity:0;pointer-events:none;transition:all .22s ease;z-index:9999;max-width:calc(100vw - 32px)}
.undo-toast.show{opacity:1;pointer-events:auto;transform:translateX(-50%) translateY(0)}
.undo-msg{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.undo-btn{background:none;border:none;color:#93C5FD;font-weight:700;font-size:14px;padding:6px 10px;border-radius:8px;cursor:pointer;font-family:inherit;flex-shrink:0}
.undo-btn:hover{background:rgba(147,197,253,.12)}
.undo-x{background:none;border:none;color:var(--gray-400);font-size:13px;padding:6px 8px;cursor:pointer;flex-shrink:0}
/* ─── Botão flutuante "+" ─── */
.fab{position:fixed;right:22px;bottom:22px;width:56px;height:56px;border-radius:50%;border:none;background:var(--blue);color:#fff;font-size:30px;line-height:1;font-weight:400;box-shadow:0 8px 24px rgba(37,99,235,.4);cursor:pointer;z-index:900;display:flex;align-items:center;justify-content:center;transition:transform .15s,box-shadow .15s}
.fab .ic{width:26px;height:26px;stroke-width:2.25}
.fab:hover{transform:translateY(-2px);box-shadow:0 12px 28px rgba(37,99,235,.5)}
.fab:focus-visible{outline:3px solid #93C5FD;outline-offset:3px}
/* ─── Indicador salvo/sincronizado ─── */
.save-ind{width:124px;justify-content:flex-start;display:flex;align-items:center;gap:6px;background:none;border:none;padding:6px 8px;border-radius:var(--radius-md);font-size:12px;font-weight:600;color:var(--gray-500);cursor:pointer;font-family:inherit;flex-shrink:0;white-space:nowrap}
.save-ind:hover{background:var(--gray-100)}
.save-dot{width:8px;height:8px;border-radius:50%;background:#10B981;flex-shrink:0}
/* ─── Configurações → Armazenamento ─── */
.stg-sec{padding:16px 0;border-top:1px solid var(--gray-100);display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.stg-sec:first-of-type{border-top:none;padding-top:0}
.stg-title{font-size:14px;font-weight:700;color:var(--color-text-primary)}
.stg-text{font-size:13.5px;color:var(--color-text-secondary);line-height:1.55}
.stg-hint{font-size:12px;color:var(--gray-500);line-height:1.5}
.stg-actions{display:flex;gap:8px;flex-wrap:wrap}
.stg-check{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;color:var(--color-text-primary);cursor:pointer;line-height:1.45}
.stg-check input{width:16px;height:16px;margin-top:2px;accent-color:var(--expense);flex-shrink:0}

/* ─── Submenu expansível (Transações) ─── */
.nav-group{display:flex;flex-direction:column}
.tab-parent{position:relative}
.nav-caret{margin-left:auto;font-size:13px;color:var(--gray-400);transition:transform .18s;flex-shrink:0}
.nav-group.open .nav-caret{transform:rotate(90deg)}
.nav-group.open .tab-parent{color:var(--gray-800)}
.nav-submenu{display:none;flex-direction:column;gap:1px;padding:2px 0 4px 14px;margin-top:1px;border-left:1.5px solid var(--gray-200);margin-left:14px}
.nav-group.open .nav-submenu{display:flex}
.sub-tab{font-size:12.5px;padding:8px 10px;color:var(--gray-500);font-weight:500}
.sub-tab:hover{color:var(--gray-800);background:var(--gray-50)}
.sub-tab.on{color:var(--blue);font-weight:600;background:var(--blue-light)}
html.dark .nav-submenu{border-left-color:#233047}
html.dark .nav-caret{color:var(--gray-400)}
html.dark .sub-tab{color:#6b84a3}
html.dark .sub-tab:hover{color:#8aafd4;background:#162035}
html.dark .sub-tab.on{color:#60a5fa;background:#0c2a4a}
/* Configurações usa acento roxo em vez de azul */
.nav-group.cfg .tab-parent.on{color:var(--purple)!important;background:var(--purple-light)!important}
.nav-group.cfg .sub-tab.on{color:var(--purple)!important;background:var(--purple-light)!important}
.sidebar-footer{padding:12px;border-top:1px solid var(--gray-200);display:flex;align-items:center;gap:8px;flex-shrink:0}
.sidebar-footer #session-chip{flex:1;min-width:0}
.sidebar-footer #session-name{max-width:110px!important}
#sidebar-backdrop{display:none;position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:39}

/* ─── Responsivo: sidebar vira gaveta em telas estreitas ─── */
@media(max-width:860px){
  .sidebar{position:fixed;left:0;top:0;transform:translateX(-100%);transition:transform .22s ease;box-shadow:8px 0 32px rgba(15,23,42,.18)}
  .sidebar.open{transform:translateX(0)}
  #sidebar-backdrop.show{display:block}
  .topbar{justify-content:space-between}
  .topbar .sidebar-toggle{display:flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:var(--radius-md);border:1.5px solid var(--gray-200);background:#fff;font-size:17px;cursor:pointer;flex-shrink:0;order:-1;margin-right:auto}
}
.trans-subnav{display:flex;gap:0;background:var(--gray-50);border-bottom:1.5px solid var(--gray-200);padding:0 12px;overflow-x:auto;scrollbar-width:none}
.trans-subnav::-webkit-scrollbar{display:none}
.trans-sub-btn{padding:10px 14px;font-size:12px;font-weight:600;cursor:pointer;border:none;border-bottom:2.5px solid transparent;color:var(--gray-500);background:none;white-space:nowrap;display:flex;align-items:center;gap:5px;transition:color .15s,border-color .15s;font-family:var(--font-sans);letter-spacing:.01em;margin-bottom:-1.5px}
.trans-sub-btn:hover{color:var(--gray-700)}
.trans-sub-btn.on{color:var(--blue);border-bottom-color:var(--blue);font-weight:700}
html.dark .trans-subnav{background:var(--gray-100);border-bottom-color:var(--gray-200)}
html.dark .trans-sub-btn{color:var(--gray-400)}
html.dark .trans-sub-btn:hover{color:var(--gray-600)}
html.dark .trans-sub-btn.on{color:#60a5fa;border-bottom-color:#60a5fa}

/* ─── CONTENT ─── */
.cnt{padding:16px;display:flex;flex-direction:column;gap:14px}

/* ─── CARDS ─── */
.card{background:#fff;border-radius:var(--radius-xl);border:1px solid var(--gray-200);padding:18px;box-shadow:var(--shadow-sm);transition:box-shadow .2s}

/* ─── CARD HEADER ─── */
.ph{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.ph h3{font-size:15px;font-weight:700;color:var(--gray-800);display:flex;align-items:center;gap:7px;letter-spacing:-.2px}
.ph h3 i{color:var(--gray-400);font-size:16px}

/* ─── STAT TILES ─── */
.row3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.stat{background:#fff;border-radius:var(--radius-xl);border:1px solid var(--gray-200);padding:16px 18px;box-shadow:var(--shadow-sm);transition:box-shadow .2s,transform .2s}
.stat:hover{box-shadow:var(--shadow-md);transform:translateY(-1px)}
.stat .lbl{font-size:11px;font-weight:700;color:var(--gray-400);text-transform:uppercase;letter-spacing:.8px;margin-bottom:8px}
.stat .val{font-size:22px;font-weight:700;letter-spacing:-.6px;line-height:1;font-family:var(--font-mono)}

/* ─── TRANSACTION ROWS ─── */
.item{display:flex;align-items:center;gap:10px;padding:10px 8px;border-radius:var(--radius-md);border-bottom:1px solid var(--gray-100);transition:background .12s}
.item:last-child{border-bottom:none}
.item:hover{background:var(--gray-50)}
.dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.im{flex:1;min-width:0}
.id{font-size:15px;font-weight:600;color:var(--gray-900);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.im2{font-size:12px;color:var(--gray-400);margin-top:2px}
.iv{font-size:15px;font-weight:700;flex-shrink:0;letter-spacing:-.3px;font-family:var(--font-mono)}

/* ─── BADGES ─── */
.badge{display:inline-flex;align-items:center;gap:3px;padding:3px 9px;border-radius:99px;font-size:11px;font-weight:700;white-space:nowrap;letter-spacing:.1px}
.b-pend{background:var(--amber-light);color:#92400E}
.b-venc{background:var(--red-light);color:#991B1B}
.b-rep{background:var(--purple-light);color:var(--transfer)}
.b-ok{background:var(--green-light);color:#065F46}
.b-tr{background:var(--purple-light);color:var(--transfer)}
.b-inativo{background:var(--gray-100);color:var(--gray-500)}

/* ─── EMPTY STATE ─── */
.empty{text-align:center;padding:40px 16px;color:var(--gray-400);font-size:15px;font-weight:500}

/* ─── SECTION LABEL ─── */
.sl{font-size:11px;font-weight:700;color:var(--gray-400);text-transform:uppercase;letter-spacing:.8px;padding:6px 8px 4px;border-bottom:1px solid var(--gray-100);margin-bottom:2px;display:flex;justify-content:space-between}

/* ─── FORM GRID ─── */
.fg{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.fr{display:flex;flex-direction:column;gap:5px}
.fr.full{grid-column:1/-1}
.fr label{font-size:11px;font-weight:700;color:var(--gray-400);text-transform:uppercase;letter-spacing:.7px}
.fr input,.fr select,.fr textarea{font-size:15px;padding:10px 13px;border-radius:var(--radius-md);border:1.5px solid var(--gray-200);background:#fff;color:var(--gray-900);width:100%;font-family:var(--font-sans);transition:border-color .15s,box-shadow .15s;outline:none}
.fr input:focus,.fr select:focus,.fr textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.1)}
.fr textarea{resize:vertical;min-height:48px}

/* ─── TYPE TOGGLE ─── */
.tbtns{display:flex;gap:8px;margin-bottom:16px}
.tb{flex:1;padding:10px;border-radius:var(--radius-md);border:1.5px solid var(--gray-200);font-size:15px;font-weight:600;cursor:pointer;background:var(--gray-50);color:var(--gray-500);font-family:var(--font-sans);transition:all .15s}
.tb.rec{background:var(--green-light);color:#065F46;border-color:#34D399}
.tb.exp{background:var(--red-light);color:#991B1B;border-color:#F87171}
.tb.tr-type{background:var(--purple-light);color:var(--transfer);border-color:#A78BFA}

/* ─── BUTTONS ─── */
.btn-r{background:var(--blue);color:#fff;border:none;border-radius:var(--radius-md);padding:9px 16px;font-size:14px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:5px;font-family:var(--font-sans);transition:all .18s;letter-spacing:.1px}
.btn-r:hover{background:#1D4ED8;transform:translateY(-1px);box-shadow:0 4px 16px rgba(37,99,235,.35)}
.btn-p{background:var(--purple);color:#fff;border:none;border-radius:var(--radius-md);padding:9px 16px;font-size:14px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:5px;font-family:var(--font-sans);transition:all .18s}
.btn-p:hover{background:#6D28D9;transform:translateY(-1px);box-shadow:0 4px 16px rgba(124,58,237,.35)}
.btn-grn{background:var(--green);color:#fff;border:none;border-radius:var(--radius-md);padding:8px 14px;font-size:14px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:5px;font-family:var(--font-sans);transition:all .18s}
.btn-grn:hover{background:#047857;transform:translateY(-1px);box-shadow:0 4px 14px rgba(5,150,105,.3)}
.btn-g{background:#fff;border:1.5px solid var(--gray-200);border-radius:var(--radius-md);padding:8px 14px;font-size:14px;font-weight:600;cursor:pointer;color:var(--gray-600);font-family:var(--font-sans);transition:all .15s}
.btn-g:hover{background:var(--gray-50);border-color:var(--gray-300)}
.btn-d{background:var(--red-light);border:1.5px solid var(--red-mid);color:var(--red);cursor:pointer;padding:6px 11px;font-size:14px;font-weight:700;border-radius:var(--radius-md);transition:all .12s;line-height:1}
.btn-d:hover{background:var(--expense-border);border-color:#F87171}
.btn-e{background:var(--blue-light);border:1.5px solid var(--blue-mid);color:var(--blue);cursor:pointer;padding:6px 11px;font-size:14px;font-weight:600;border-radius:var(--radius-md);transition:all .12s;line-height:1}
.btn-e:hover{background:#DBEAFE;border-color:#93C5FD}

/* ─── CATEGORIA ÁRVORE ─── */
.cat-tabs{display:flex;gap:0;border-bottom:2px solid var(--gray-200);margin-bottom:14px}
.cat-tab-btn{padding:9px 18px;font-size:13px;font-weight:600;cursor:pointer;border:none;background:none;border-bottom:2.5px solid transparent;margin-bottom:-2px;color:var(--gray-400);font-family:var(--font-sans);transition:color .15s,border-color .15s;display:flex;align-items:center;gap:6px}
.cat-tab-btn:hover{color:var(--gray-700)}
.cat-tab-btn.on{color:var(--blue);border-bottom-color:var(--blue)}
.cat-tab-btn.rg.on{color:var(--amber);border-bottom-color:var(--amber)}
.cat-tab-btn.desp.on{color:var(--expense);border-bottom-color:var(--expense)}
.cat-tab-btn.rec.on{color:var(--income);border-bottom-color:var(--income)}
.cat-tab-btn.tr.on{color:var(--transfer);border-bottom-color:var(--transfer)}
.cat-tab-btn.fam.on{color:var(--transfer);border-bottom-color:var(--transfer)}
.cat-tree{display:flex;gap:12px;align-items:flex-start}
.cat-tree-list{flex:1;border:1.5px solid var(--gray-200);border-radius:var(--radius-lg);overflow:hidden;background:#fff;min-height:280px}
.cat-tree-item{display:flex;align-items:center;gap:0;border-bottom:1px solid var(--gray-100);cursor:pointer;user-select:none;transition:background .1s}
.cat-tree-item:last-child{border-bottom:none}
.cat-tree-item:hover{background:var(--gray-50)}
.cat-tree-item.selected{background:var(--blue-mid)!important}
.cat-tree-item.selected .cti-name{color:var(--blue);font-weight:700}
.cat-tree-item.desp.selected{background:var(--expense-bg)!important}
.cat-tree-item.desp.selected .cti-name{color:var(--expense)}
.cat-tree-item.rec.selected{background:var(--income-border)!important}
.cat-tree-item.rec.selected .cti-name{color:var(--income)}
.cat-tree-item.tr.selected{background:var(--purple-mid)!important}
.cat-tree-item.tr.selected .cti-name{color:var(--transfer)}
.cti-toggle{width:28px;height:38px;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--gray-400);flex-shrink:0}
.cti-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;margin-right:8px}
.cti-name{font-size:14px;color:var(--gray-800);flex:1;padding:10px 4px 10px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cti-root .cti-name{font-weight:700;font-size:14px}
.cti-sub{padding-left:28px}
.cti-sub .cti-name{font-size:13px;font-weight:400;color:var(--gray-600)}
.cat-tree-actions{display:flex;flex-direction:column;gap:7px;flex-shrink:0;width:130px}
.cat-act-btn{display:flex;align-items:center;gap:7px;padding:8px 12px;border-radius:var(--radius-md);border:1.5px solid var(--gray-200);background:#fff;font-size:13px;font-weight:600;cursor:pointer;color:var(--gray-700);font-family:var(--font-sans);transition:all .15s;white-space:nowrap}
.cat-act-btn:hover{background:var(--gray-50);border-color:var(--gray-300)}
.cat-act-btn.add{border-color:#BFDBFE;background:#EFF6FF;color:#1D4ED8}
.cat-act-btn.add:hover{background:#DBEAFE}
.cat-act-btn.addsub{border-color:#DDD6FE;background:var(--transfer-bg);color:var(--transfer)}
.cat-act-btn.addsub:hover{background:var(--transfer-border)}
.cat-act-btn.edit{border-color:var(--income-border);background:var(--income-bg);color:#065F46}
.cat-act-btn.edit:hover{background:var(--income-border)}
.cat-act-btn.del{border-color:var(--expense-border);background:var(--expense-bg);color:var(--expense)}
.cat-act-btn.del:hover{background:var(--expense-bg)}
.cat-act-btn:disabled{opacity:.35;cursor:not-allowed;pointer-events:none}
/* dark */
html.dark .cat-tabs{border-bottom-color:#1e2d45}
html.dark .cat-tab-btn{color:var(--gray-400)}
html.dark .cat-tab-btn:hover{color:#8aafd4}
html.dark .cat-tab-btn.on{color:#60a5fa;border-bottom-color:#60a5fa}
html.dark .cat-tab-btn.desp.on{color:#f87171;border-bottom-color:#f87171}
html.dark .cat-tab-btn.rec.on{color:#34d399;border-bottom-color:#34d399}
html.dark .cat-tab-btn.tr.on{color:#a78bfa;border-bottom-color:#a78bfa}
html.dark .cat-tree-list{background:#0f1e35;border-color:#1e2d45}
html.dark .cat-tree-item{border-bottom-color:#1e2d45}
html.dark .cat-tree-item:hover{background:#162035}
html.dark .cat-tree-item.selected{background:#1e3a8a!important}
html.dark .cat-tree-item.selected .cti-name{color:#93c5fd}
html.dark .cat-tree-item.desp.selected{background:#450a0a!important}
html.dark .cat-tree-item.desp.selected .cti-name{color:#f87171}
html.dark .cat-tree-item.rec.selected{background:#064e3b!important}
html.dark .cat-tree-item.rec.selected .cti-name{color:#34d399}
html.dark .cat-tree-item.tr.selected{background:#2e1065!important}
html.dark .cat-tree-item.tr.selected .cti-name{color:#a78bfa}
html.dark .cti-name{color:#c8daf0}
html.dark .cti-sub .cti-name{color:#8aafd4}
html.dark .cti-toggle{color:var(--gray-400)}
html.dark .cat-act-btn{background:#0f1e35;border-color:#1e2d45;color:#7a9fcc}
html.dark .cat-act-btn:hover{background:#162035;border-color:#2e4060}
html.dark .cat-act-btn.add{background:#0c1f40;border-color:#1e3a8a;color:#93c5fd}
html.dark .cat-act-btn.add:hover{background:#1e3a8a}
html.dark .cat-act-btn.addsub{background:#1e1050;border-color:#3b1f80;color:#c4b5fd}
html.dark .cat-act-btn.addsub:hover{background:#2e1070}
html.dark .cat-act-btn.edit{background:#042f1e;border-color:#065f46;color:#6ee7b7}
html.dark .cat-act-btn.edit:hover{background:#065f46}
html.dark .cat-act-btn.del{background:#2d0a0a;border-color:#7f1d1d;color:#fca5a5}
html.dark .cat-act-btn.del:hover{background:#450a0a}

/* ─── AGRUPAMENTO DE LANÇAMENTOS ─── */
.grp-bar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:6px 0 2px;border-top:1px solid var(--gray-200);margin-top:6px}
.grp-bar-label{font-size:12px;font-weight:600;color:var(--gray-500);margin-right:2px}
.grp-btn{padding:4px 12px;font-size:12px;font-weight:600;border-radius:99px;border:1.5px solid var(--gray-200);background:#fff;color:var(--gray-500);cursor:pointer;font-family:var(--font-sans);transition:all .15s}
.grp-btn:hover{background:var(--gray-100)}
.grp-btn.on{background:#0F172A;color:#fff;border-color:#0F172A}

/* tabela de agrupamento */
.grp-table{width:100%;border-collapse:collapse;margin-top:6px;font-size:13px}
.grp-table thead th{text-align:left;font-size:11px;font-weight:700;color:var(--gray-400);text-transform:uppercase;letter-spacing:.05em;padding:6px 10px;border-bottom:1.5px solid var(--gray-200)}
.grp-table thead th:last-child,.grp-table thead th:nth-last-child(2){text-align:right}
.grp-type-row td{font-weight:800;font-size:13px;padding:10px 10px 8px;letter-spacing:.01em;border-bottom:1px solid rgba(0,0,0,.06)}
.grp-type-row.receita td{background:var(--income);color:#fff}
.grp-type-row.despesa td{background:var(--expense);color:#fff}
.grp-type-row.transferencia td{background:var(--transfer);color:#fff}
.grp-type-row td.grp-type-total{text-align:right;font-weight:800;font-variant-numeric:tabular-nums;font-size:13px}
.grp-cat-row{cursor:pointer;transition:background .1s}
.grp-cat-row:hover{background:var(--gray-50)}
.grp-cat-row td{padding:9px 10px;border-bottom:1px solid var(--gray-100);color:var(--gray-800);font-size:13px}
.grp-cat-row .grp-pct{color:var(--gray-400);font-size:13px;text-align:right;font-variant-numeric:tabular-nums}
.grp-cat-row .grp-soma{font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.grp-total-row td{padding:10px 10px;font-weight:700;font-size:13px;border-top:2px solid var(--gray-200);background:var(--gray-50)}
.grp-total-row .grp-soma{text-align:right;color:var(--income)}
.grp-toggle{font-size:11px;color:var(--gray-400);margin-right:4px;display:inline-block;width:14px}
.grp-dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px;flex-shrink:0;vertical-align:middle}
/* sub-linhas de lançamentos dentro da categoria */
.grp-tx-row{transition:background .1s}
.grp-tx-row:hover{background:var(--blue-light)}
.grp-tx-row td{padding:7px 10px 7px 32px;border-bottom:1px solid var(--gray-100);font-size:12px;color:var(--gray-600)}
.grp-tx-row{cursor:pointer}
.grp-tx-row .grp-soma{font-size:12px;font-weight:600;text-align:right;font-variant-numeric:tabular-nums;padding-right:10px}
.grp-tx-row td.grp-tx-acoes{padding:3px 6px;text-align:right;white-space:nowrap}
.grp-tx-acoes .row-actions{display:inline-flex;gap:2px;opacity:.35;transition:opacity .12s}
.grp-tx-row:hover .grp-tx-acoes .row-actions,.grp-tx-acoes .row-actions:focus-within{opacity:1}
@media (hover:none){.grp-tx-acoes .row-actions{opacity:1}}
.grp-tx-acoes .icon-btn{width:26px;height:26px}
.grp-tx-data{font-variant-numeric:tabular-nums}
.grp-tx-desc{color:var(--color-text-primary);font-weight:500}
.grp-tx-extra{margin-left:8px;font-size:11px;color:var(--gray-500)}
.grp-tx-extra:empty{display:none}
.grp-table .grp-soma,.grp-type-total{white-space:nowrap}
@media (max-width:600px){
  .grp-table td,.grp-table th{padding-left:8px;padding-right:8px}
  .grp-tx-row td{padding-left:14px}
  .grp-tx-extra{display:block;margin:2px 0 0}
  .grp-cat-row td:first-child{white-space:nowrap}
  .grp-cat-row .grp-pct{width:44px}
  .grp-tx-acoes .icon-btn{width:30px;height:30px}
}
/* dark */
html.dark .grp-bar{border-top-color:#1e2d45}
html.dark .grp-btn{background:#0f1e35;border-color:#1e2d45;color:var(--gray-400)}
html.dark .grp-btn:hover{background:#162035}
html.dark .grp-btn.on{background:#c8daf0;color:#0f1e35;border-color:#c8daf0}
html.dark .grp-table thead th{color:var(--gray-400);border-bottom-color:#1e2d45}
html.dark .grp-cat-row:hover{background:#162035}
html.dark .grp-cat-row td{color:#c8daf0;border-bottom-color:#1e2d45}
html.dark .grp-cat-row .grp-pct{color:var(--gray-400)}
html.dark .grp-tx-row td{border-bottom-color:#1e2d45;color:#8aafd4}
html.dark .grp-tx-row:hover{background:#1e3a8a}
.grp-sub-row td{padding:7px 10px;border-bottom:1px solid var(--gray-100);font-size:12px;color:var(--gray-600);background:var(--gray-50)}
.grp-sub-row:hover{background:#eef4ff}
html.dark .grp-sub-row td{border-bottom-color:#1e2d45;color:#8aafd4;background:#080e1c}
html.dark .grp-sub-row:hover{background:#1e3a8a}
html.dark .grp-total-row .grp-soma{color:#34d399}

/* ─── PAINEL DATE INPUTS ─── */
.painel-date-input{font-size:13px;padding:6px 9px;border-radius:var(--radius-md);border:1.5px solid var(--gray-200);background:var(--color-background-primary);color:var(--color-text-primary);font-family:var(--font-sans)}
html.dark .painel-date-input{background:#162035!important;color:#c8daf0!important;border-color:#1e2d45!important}

/* ─── CAT TREE PICKER ─── */
.ctp-wrap{position:relative;width:100%}
.ctp-trigger{display:flex;align-items:center;gap:8px;width:100%;justify-content:flex-start;font-size:15px;padding:10px 12px;border-radius:var(--radius-md);border:1.5px solid var(--gray-200);background:var(--color-background-primary);color:var(--color-text-primary);font-family:var(--font-sans);cursor:pointer;transition:border-color .15s,box-shadow .15s;text-align:left;outline:none;min-height:44px}
.ctp-trigger:hover{border-color:var(--gray-300,#cbd5e1)}
.ctp-trigger:focus-visible,.ctp-trigger.open{border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.15)}
.ctp-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.ctp-label{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctp-pai{color:var(--gray-500);font-weight:400}
.ctp-ph{color:var(--gray-500)}
.ctp-arrow{color:var(--gray-400);flex-shrink:0;transition:transform .15s}
.ctp-trigger.open .ctp-arrow{transform:rotate(180deg)}
.ctp-compact .ctp-trigger{font-size:12px;padding:4px 10px;min-height:30px;min-width:160px;max-width:230px}
.ctp-dropdown{text-align:left;display:none;position:fixed;z-index:1200;background:var(--color-background-primary);border:1px solid var(--gray-300,#cbd5e1);border-radius:var(--radius-lg);box-shadow:0 28px 70px rgba(15,23,42,.35),0 4px 12px rgba(15,23,42,.12);flex-direction:column;overflow:hidden}
.ctp-dropdown.open{display:flex}
.ctp-dropdown.sheet{left:0;right:0;bottom:0;top:auto;height:82vh;border-radius:16px 16px 0 0;z-index:1300}
.ctp-titulo{display:flex;align-items:center;gap:8px;padding:8px 8px 8px 12px;font-size:13px;font-weight:700;color:var(--color-text-primary);background:var(--color-background-secondary);border-bottom:1px solid var(--gray-100);cursor:move;user-select:none;touch-action:none;flex-shrink:0}
.ctp-titulo span{flex:1}
.ctp-grip{color:var(--gray-400)}
.ctp-dropdown.arrastando{box-shadow:0 24px 60px rgba(15,23,42,.32);opacity:.97}
.ctp-dropdown.arrastando *{cursor:move!important}
.ctp-dropdown.sheet .ctp-titulo{cursor:default}
.ctp-dropdown.sheet .ctp-grip{display:none}
.ctp-topo{display:flex;align-items:center;gap:8px;padding:8px 8px 8px 12px;border-bottom:1px solid var(--gray-100);color:var(--gray-500);flex-shrink:0}
.ctp-topo input{flex:1;min-width:0;border:0!important;outline:none;background:transparent!important;font-size:14px;padding:6px 0!important;color:var(--color-text-primary);font-family:inherit;box-shadow:none!important}
.ctp-fechar{background:none;border:0;color:var(--gray-500);cursor:pointer;padding:6px;border-radius:6px;display:flex}
.ctp-fechar:hover{background:var(--gray-100);color:var(--color-text-primary)}
.ctp-corpo{flex:1;min-height:0;display:flex}
.ctp-arvore{flex:1;min-width:0;overflow-y:auto;padding:6px;outline:none;scrollbar-width:thin}
.ctp-botoes{width:146px;flex-shrink:0;border-left:1px solid var(--gray-100);padding:8px;display:flex;flex-direction:column;gap:6px;overflow-y:auto}
.ctp-acao{display:flex;align-items:center;gap:7px;width:100%;padding:7px 9px;border:1px solid var(--gray-200);border-radius:8px;background:var(--color-background-secondary);color:var(--color-text-primary);font-size:12.5px;font-weight:600;font-family:inherit;cursor:pointer;text-align:left;white-space:nowrap}
.ctp-acao:hover:not(:disabled){border-color:var(--blue);color:var(--blue);background:var(--blue-light)}
.ctp-acao.perigo:hover:not(:disabled){border-color:var(--expense);color:var(--expense);background:var(--expense-bg)}
.ctp-acao:disabled{opacity:.4;cursor:not-allowed}
.ctp-acao .ic{flex-shrink:0}
.ctp-mover{display:flex;gap:6px;margin-top:4px}
