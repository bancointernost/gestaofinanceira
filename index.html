.ctp-acao.so-ic{justify-content:center}.ctp-acao.so-ic span{display:none}
.ctp-sec{font-size:10.5px;font-weight:700;color:var(--gray-500);text-transform:uppercase;letter-spacing:.04em;padding:8px 6px 4px}
.ctp-row{display:flex;align-items:center;gap:6px;padding:5px 8px 5px 2px;margin:1px 0;border-radius:7px;cursor:pointer;user-select:none;font-size:14px;color:var(--color-text-primary);border:1px solid transparent}
.ctp-row.n0{font-weight:600}
.ctp-row.nsub{padding-left:calc(4px + var(--nv) * 22px);font-size:13.5px;font-weight:400;color:var(--color-text-secondary);position:relative}
.ctp-row.nsub::before{content:'';position:absolute;left:calc(var(--nv) * 22px - 9px);top:-2px;bottom:-2px;border-left:1px dashed var(--gray-200)}
.ctp-row:hover{background:var(--gray-100)}
.ctp-row.hl{background:var(--blue);color:#fff;border-color:var(--blue)}
.ctp-row.hl .ctp-chev{color:#fff}
.ctp-row.hl .ctp-idot{box-shadow:0 0 0 1.5px #fff}
.ctp-chev{width:20px;height:20px;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--gray-500);border-radius:4px}
.ctp-chev[role=button]:hover{background:rgba(127,127,127,.18)}
.ctp-idot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.ctp-row.nsub .ctp-idot{width:8px;height:8px}
.ctp-iname{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctp-iname mark{background:var(--amber-light);color:inherit;border-radius:3px;padding:0 1px}
.ctp-row.hl .ctp-iname mark{background:rgba(255,255,255,.3)}
.ctp-nsub{font-size:10.5px;color:var(--color-text-secondary);font-weight:600;background:var(--gray-100);border-radius:99px;padding:0 6px;flex-shrink:0}
.ctp-row.hl .ctp-nsub{background:rgba(255,255,255,.25);color:#fff}
html.dark .ctp-nsub{background:#1e2d45}
.ctp-atual{font-size:10px;font-weight:700;color:var(--blue);background:var(--blue-light);border-radius:99px;padding:1px 7px;flex-shrink:0}
.ctp-row.hl .ctp-atual{background:#fff;color:#1d4ed8}
.ctp-editando{cursor:default;background:var(--blue-light);border-color:var(--blue)}
.ctp-ed-in{flex:1;min-width:0;font-size:14px!important;padding:4px 8px!important;border-radius:6px!important;border:1px solid var(--gray-200)!important;background:var(--color-background-primary)!important;color:var(--color-text-primary)!important;font-family:inherit;height:auto!important}
.ctp-ed-ok,.ctp-ed-x{border:0;border-radius:6px;padding:5px;display:flex;cursor:pointer;flex-shrink:0}
.ctp-ed-ok{background:var(--blue);color:#fff}
.ctp-ed-x{background:var(--gray-100);color:var(--color-text-secondary)}
.ctp-cores{display:flex;flex-wrap:wrap;gap:6px;padding:6px 8px 8px 30px}
.ctp-cor{width:18px;height:18px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0}
.ctp-cor.on{border-color:var(--color-text-primary);transform:scale(1.15)}
.ctp-vazio{padding:18px 8px;font-size:13px;color:var(--gray-500);text-align:center;line-height:1.7}
.ctp-link{background:none;border:0;color:var(--blue);font-weight:600;cursor:pointer;font-family:inherit;font-size:13px;text-decoration:underline}
.ctp-rodape{border-top:1px solid var(--gray-100);padding:8px 10px;display:flex;align-items:center;gap:8px;flex-shrink:0}
.ctp-escolha{flex:1;min-width:0;display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--color-text-secondary);white-space:nowrap;overflow:hidden}
.ctp-escolha span:last-child{overflow:hidden;text-overflow:ellipsis}
.ctp-cancel,.ctp-okbtn{border-radius:8px;padding:7px 14px;font-size:13px;font-weight:600;font-family:inherit;cursor:pointer;display:flex;align-items:center;gap:5px}
.ctp-cancel{background:none;border:1px solid var(--gray-200);color:var(--color-text-primary)}
.ctp-okbtn{background:var(--blue);border:1px solid var(--blue);color:#fff}
.ctp-okbtn:disabled{opacity:.45;cursor:not-allowed}
.ctp-sug{font-size:11px;font-weight:600;color:var(--transfer);background:var(--transfer-bg);border-radius:99px;padding:1px 8px}
@media (max-width:600px){
  .ctp-corpo{flex-direction:column-reverse}
  .ctp-botoes{width:auto;flex-direction:row;flex-wrap:wrap;border-left:0;border-bottom:1px solid var(--gray-100);overflow:visible;padding:6px 8px;gap:6px}
  .ctp-acao{width:auto;padding:6px 9px;font-size:12px}
  .ctp-mover{margin:0}
  .ctp-row{padding-top:8px;padding-bottom:8px}
}
html.dark .ctp-trigger{background:#162035;border-color:#1e2d45}
html.dark .ctp-dropdown{background:#0f1e35;border-color:#2b4672;box-shadow:0 0 0 1px rgba(59,130,246,.25),0 28px 70px rgba(0,0,0,.7)}
html.dark .ctp-topo,html.dark .ctp-rodape,html.dark .ctp-botoes{border-color:#1e2d45}
html.dark .ctp-titulo{background:#0b1729;border-color:#1e2d45}
html.dark .ctp-row:hover,html.dark .ctp-fechar:hover{background:#162035}
html.dark .ctp-row.hl{background:#2563eb;border-color:#2563eb}
html.dark .ctp-okbtn{background:#2563eb;border-color:#2563eb}
html.dark .ctp-ed-ok{background:#2563eb}
html.dark .ctp-acao{background:#162035;border-color:#1e2d45}
html.dark .ctp-acao:hover:not(:disabled){background:#1e3a8a;color:#bfdbfe;border-color:#3b82f6}
html.dark .ctp-acao.perigo:hover:not(:disabled){background:#450a0a;color:#fca5a5;border-color:#f87171}
html.dark .ctp-row.nsub::before{border-color:#24395a}
html.dark .ctp-editando{background:#13254a}
html.dark .ctp-ed-in{background:#0f1e35!important;border-color:#1e2d45!important}
html.dark .ctp-ed-x,html.dark .ctp-cancel{background:#162035;border-color:#1e2d45;color:#c8daf0}


/* ─── MODAL FORMULÁRIO DE LANÇAMENTO ─── */
.tx-modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,.45);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);z-index:7000;display:flex;align-items:center;justify-content:center;padding:16px;animation:fadeOverlay .15s ease}
.tx-modal-box{background:var(--color-background-primary,#fff);border-radius:var(--radius-xl);box-shadow:0 24px 60px rgba(15,23,42,.22),0 8px 24px rgba(15,23,42,.12);padding:22px 22px 18px;width:100%;max-width:520px;max-height:90vh;overflow-y:auto;animation:slideDialog .18s cubic-bezier(.34,1.56,.64,1)}
html.dark .tx-modal-box{background:#0f1e35;border:1px solid #1e2d45}
/* ─── QUICK-ADD INLINE MODAL (cadastro rápido no lançamento) ─── */
.qam-overlay{position:fixed;inset:0;background:rgba(15,23,42,.45);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);z-index:8600;display:flex;align-items:center;justify-content:center;padding:16px;animation:fadeOverlay .15s ease}
.qam-box{background:var(--color-background-primary,#fff);border-radius:var(--radius-xl);box-shadow:0 24px 60px rgba(15,23,42,.22),0 8px 24px rgba(15,23,42,.12);padding:22px 22px 18px;width:100%;max-width:400px;animation:slideDialog .18s cubic-bezier(.34,1.56,.64,1)}
.qam-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.qam-title{font-size:15px;font-weight:700;color:var(--color-text-primary)}
.qam-close{background:none;border:none;font-size:20px;cursor:pointer;color:var(--gray-400);line-height:1;padding:0;transition:color .15s}
.qam-close:hover{color:var(--gray-700)}
.qam-footer{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
/* btn inline ao lado do label */
.fr-add-btn{display:inline-flex;align-items:center;gap:3px;background:none;border:none;font-size:11px;font-weight:700;color:var(--blue);cursor:pointer;padding:2px 6px;border-radius:6px;transition:background .12s;font-family:var(--font-sans);line-height:1.4;white-space:nowrap}
.fr-add-btn:hover{background:var(--blue-light)}
.fr-label-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
html.dark .qam-box{background:#0f1e35;border-color:#1e2d45}
html.dark .fr-add-btn{color:#60a5fa}
html.dark .fr-add-btn:hover{background:#1e3a8a}

/* ─── CONFIRM BOX (legacy, mantido para compatibilidade) ─── */
.confirm{background:var(--red-light);border:1.5px solid var(--red-mid);border-radius:var(--radius-lg);padding:14px;margin-top:10px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}

/* ─── CONFIRM MODAL (centralizado) ─── */
.confirm-overlay{position:fixed;inset:0;background:rgba(15,23,42,.45);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);z-index:9998;display:flex;align-items:center;justify-content:center;padding:20px;animation:fadeOverlay .18s ease}
@keyframes fadeOverlay{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.confirm-dialog{background:var(--color-background-primary,#fff);border-radius:var(--radius-xl);box-shadow:0 24px 60px rgba(15,23,42,.22),0 8px 24px rgba(15,23,42,.12);padding:28px 28px 24px;max-width:380px;width:100%;animation:slideDialog .2s cubic-bezier(.34,1.56,.64,1)}
@keyframes slideDialog{from{opacity:0;transform:translateY(12px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
.confirm-dialog .cd-icon{font-size:36px;text-align:center;margin-bottom:12px}
.confirm-dialog .cd-title{font-size:17px;font-weight:700;color:var(--color-text-primary,#0F172A);text-align:center;margin-bottom:8px;letter-spacing:-.2px}
.confirm-dialog .cd-msg{font-size:14px;color:var(--color-text-secondary,#475569);text-align:center;line-height:1.5;margin-bottom:22px}
.confirm-dialog .cd-actions{display:flex;gap:10px}
.confirm-dialog .cd-actions button{flex:1;padding:11px 16px;font-size:15px;font-weight:700;border-radius:var(--radius-md);cursor:pointer;font-family:var(--font-sans);transition:all .15s;border:none}

/* ─── TOAST ─── */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(12px);background:var(--gray-900);color:#fff;padding:11px 20px;border-radius:var(--radius-xl);font-size:14px;font-weight:600;opacity:0;transition:all .28s cubic-bezier(.34,1.56,.64,1);pointer-events:none;white-space:nowrap;z-index:9999;box-shadow:0 8px 32px rgba(0,0,0,.25);letter-spacing:.01em}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@keyframes pulse-red{0%,100%{box-shadow:0 0 0 0 rgba(220,38,38,.4)}50%{box-shadow:0 0 0 6px rgba(220,38,38,0)}}

/* ─── TRANSFER BOX ─── */
.trbox{background:var(--purple-light);border:1px solid #C4B5FD;border-radius:var(--radius-lg);padding:14px;display:flex;align-items:center;margin-bottom:14px}
.trs{flex:1;text-align:center}.trs .tl{font-size:11px;font-weight:700;color:var(--transfer);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
.trs .tn{font-size:16px;font-weight:600;color:#3B0764}.trs .tb2{font-size:13px;color:var(--transfer);margin-top:2px}
.trm{padding:0 14px;text-align:center;flex-shrink:0}.trm .ti{font-size:23px;color:var(--purple)}.trm .tv{font-size:15px;font-weight:600;color:var(--transfer);margin-top:4px}

/* ─── ACCOUNT CARDS ─── */
.acc-c{display:flex;align-items:center;gap:14px;padding:14px 16px;background:#fff;border-radius:var(--radius-xl);border:1px solid var(--gray-200);box-shadow:var(--shadow-sm);transition:box-shadow .2s,transform .2s;flex-wrap:wrap}
.acc-c:hover{box-shadow:var(--shadow-md);transform:translateY(-1px)}
.acc-c.hl{border:2px solid var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.1)}

/* ─── CATEGORY BARS ─── */
.bar-row{display:flex;align-items:center;gap:10px}
.bar-bg{flex:2;background:var(--gray-100);border-radius:99px;height:6px;overflow:hidden}
.bar-fill{height:100%;border-radius:99px;transition:width .4s ease}

/* ─── CATEGORY GRID ─── */
.cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.cat-card{display:flex;align-items:center;gap:8px;padding:10px 12px;background:#fff;border-radius:var(--radius-md);border:1px solid var(--gray-200);transition:box-shadow .12s}
.cat-card:hover{box-shadow:var(--shadow-sm)}
.cat-card.hl{border:2px solid var(--blue)}
.cat-dot{width:12px;height:12px;border-radius:50%;flex-shrink:0}
.cat-name{font-size:15px;font-weight:500;color:var(--gray-800);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ─── COLOR SWATCHES ─── */
.color-swatches{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.swatch{width:24px;height:24px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:transform .15s}
.swatch:hover{transform:scale(1.15)}
.swatch.sel{border-color:var(--gray-900);transform:scale(1.15);box-shadow:0 0 0 2px #fff,0 0 0 4px var(--gray-400)}

/* ─── FIXED CARDS ─── */
.fixa-card{display:flex;align-items:center;gap:14px;padding:14px 16px;background:#fff;border-radius:var(--radius-xl);border:1px solid var(--gray-200);box-shadow:var(--shadow-sm);transition:box-shadow .2s,transform .2s;flex-wrap:wrap}
.fixa-card:hover{box-shadow:var(--shadow-md);transform:translateY(-1px)}
.fixa-card.hl{border:2px solid var(--blue)}
.fixa-card.inativa{opacity:.5}
.fixa-ic{width:40px;height:40px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.fixa-info{flex:1;min-width:0}
.fixa-name{font-size:15px;font-weight:700;color:var(--gray-900)}
.fixa-sub{font-size:12px;color:var(--gray-400);margin-top:2px}
.progress-bar{width:100%;background:var(--gray-100);border-radius:99px;height:6px;overflow:hidden;margin-top:10px}
.progress-fill{height:100%;border-radius:99px;transition:width .4s ease}

/* ─── PROJECTION ─── */
.proj-month{border-radius:var(--radius-xl);border:1px solid var(--gray-200);overflow:hidden;margin-bottom:10px;box-shadow:var(--shadow-sm)}
.proj-header{display:flex;align-items:center;padding:14px 18px;cursor:pointer;background:var(--gray-50);gap:10px;user-select:none;transition:background .12s}
.proj-header:hover{background:var(--gray-100)}
.proj-header .ph-name{font-size:15px;font-weight:700;color:var(--gray-800);flex:1}
.proj-body{padding:14px 18px;background:#fff;display:none}
.proj-body.open{display:block}
.proj-header-month-name{font-weight:700}
.proj-header-rec{font-weight:700}
.proj-header-exp{font-weight:700}
.proj-header-saldo-pos,.proj-header-saldo-neg{font-weight:700}
.proj-section-label{font-weight:700}
.proj-section-label-plan{font-weight:700}
.proj-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--gray-100);font-size:14px}
.proj-row:last-child{border-bottom:none}
.proj-row .pr-name{flex:1;color:var(--gray-700)}
.proj-row .pr-type{font-size:11px;padding:2px 7px;border-radius:99px}
.proj-row .pr-val{font-weight:700;font-family:var(--font-mono)}

/* ─── NAV BUTTONS ─── */
.nav-btn{background:#fff;border:1.5px solid var(--gray-200);border-radius:var(--radius-md);padding:7px 14px;font-size:14px;font-weight:600;cursor:pointer;color:var(--gray-600);display:flex;align-items:center;gap:5px;font-family:var(--font-sans);transition:all .15s}
.nav-btn:hover{background:var(--gray-50);border-color:var(--gray-300)}
.chart-wrap{width:100%;height:200px;position:relative}
.month-nav{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.month-nav span{font-size:17px;font-weight:700;color:var(--gray-900);flex:1;text-align:center;letter-spacing:-.4px}
.copy-btn{background:var(--blue-light);color:#1D4ED8;border:none;border-radius:var(--radius-md);padding:8px 16px;font-size:13px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:5px;font-family:var(--font-sans);transition:background .12s,transform .12s}
.copy-btn:hover{background:var(--blue-mid);transform:translateY(-1px)}

/* ─── FAMILY ─── */
.fam-badge{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:600;background:var(--purple-light);color:var(--transfer);white-space:nowrap}
.period-bar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:8px 0 4px}
.period-btn{padding:6px 12px;border-radius:99px;border:1px solid var(--gray-200);font-size:13px;font-weight:500;cursor:pointer;background:#fff;color:var(--gray-500);font-family:var(--font-sans);transition:all .12s}
.period-btn:hover{border-color:var(--gray-300);color:var(--gray-700)}
.period-btn.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.fam-sel{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.fam-chip{padding:5px 12px;border-radius:99px;font-size:15px;font-weight:500;cursor:pointer;border:1.5px solid var(--gray-200);background:#fff;color:var(--gray-500);transition:all .15s;font-family:var(--font-sans)}
.fam-chip:hover{border-color:var(--gray-300)}
.fam-chip.sel{border-color:var(--purple);background:var(--purple-light);color:var(--transfer)}

/* ─── TRANSACTION CARDS — tabular row style ─── */
.tx-list{display:table;width:100%;border-collapse:collapse;table-layout:fixed}
.tx-col-header{display:table-row}
.tx-col-header .tx-ch{display:table-cell;padding:7px 10px;font-size:10px;font-weight:700;color:var(--gray-400);text-transform:uppercase;letter-spacing:.6px;border-bottom:2px solid var(--gray-200);white-space:nowrap;background:var(--gray-50)}
/* column widths — match header and data cells exactly */
.tx-ch-icon,.tx-cell-icon{width:28px;padding-left:6px;padding-right:2px}
.tx-ch-main,.tx-cell-main{overflow:hidden;padding-left:4px;min-width:0}
.tx-ch-acc,.tx-cell-acc{width:120px;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx-ch-cat,.tx-cell-cat{width:130px;max-width:130px;overflow:hidden;white-space:nowrap}
.tx-ch-val,.tx-cell-val{width:120px;text-align:right;white-space:nowrap}
.tx-ch-date,.tx-cell-date{width:82px;text-align:right;white-space:nowrap}
.tx-ch-actions,.tx-cell-actions{width:172px;text-align:right;white-space:nowrap}
/* unified padding for fixed cols */
.tx-ch-acc,.tx-cell-acc,.tx-ch-cat,.tx-cell-cat,.tx-ch-val,.tx-cell-val,.tx-ch-date,.tx-cell-date{padding-left:8px;padding-right:8px}
.tx-ch-actions,.tx-cell-actions{padding-left:4px;padding-right:6px}
/* prevent cat inner span from overflowing */
.tx-cell-cat>span{display:inline-flex;align-items:center;gap:4px;overflow:hidden;max-width:100%}
.tx-cell-cat .tx-cat-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* acc cell text truncation */
.tx-cell-acc{color:var(--gray-500);font-size:13px}
/* ─── RELATÓRIO ─── */
.rel-filters{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin-bottom:16px}
.rel-filters label{font-size:11px;font-weight:700;color:var(--gray-500);text-transform:uppercase;letter-spacing:.05em;display:block;margin-bottom:4px}
.rel-filters input,.rel-filters select{font-size:13px;padding:7px 10px;border-radius:var(--radius-sm);border:1px solid var(--gray-200);background:var(--color-background-primary);color:var(--color-text-primary);font-family:var(--font-sans)}
.rel-filters .rel-group{display:flex;flex-direction:column}
.rel-preview{background:var(--color-background-primary);border:1px solid var(--gray-200);border-radius:var(--radius-md);overflow:hidden;margin-top:4px}
/* O relatório imita papel (sempre claro, também no modo escuro): fixa os tokens claros aqui dentro */
.rel-doc{--income:#047857;--expense:#C81E1E;--transfer:#7C3AED;--amber:#B45309;--blue:#2563EB;--gray-300:#CBD5E1;--gray-400:#64748B;--gray-500:#526177;--gray-600:#475569;--gray-900:#0F172A;--color-text-primary:#0F172A;--color-text-secondary:#475569;font-family:'DM Sans',sans-serif;color:#1a1a1a;background:#fff;padding:32px 36px;max-width:900px;margin:0 auto}
.rel-doc .rh-title{font-size:20px;font-weight:700;letter-spacing:-.4px;margin:0 0 2px}
.rel-doc .rh-sub{font-size:12px;color:#666;margin:0 0 20px}
.rel-doc .rh-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:18px;padding-bottom:14px;border-bottom:2px solid #1a1a1a}
.rel-doc .rh-logo{font-size:22px}
.rel-summ{display:flex;gap:12px;margin-bottom:20px}
.rel-summ .rs{flex:1;border:1px solid #e2e8f0;border-radius:8px;padding:12px 14px}
.rel-summ .rs-lbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:#64748b;margin-bottom:4px}
.rel-summ .rs-val{font-size:16px;font-weight:700}
.rel-table{width:100%;border-collapse:collapse;font-size:12px}
.rel-table thead th{background:#f8fafc;padding:7px 9px;text-align:left;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:#475569;border-bottom:1.5px solid #cbd5e1;white-space:nowrap}
.rel-table thead th.r{text-align:right}
.rel-table tbody tr:nth-child(even){background:#fafbfc}
.rel-table tbody td{padding:7px 9px;border-bottom:1px solid #f1f5f9;vertical-align:middle}
.rel-table tbody td.r{text-align:right;font-variant-numeric:tabular-nums}
.rel-table .rt-cat-dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:4px;flex-shrink:0}
.rel-table tfoot td{padding:8px 9px;font-weight:700;border-top:2px solid #cbd5e1;font-size:12px}
.rel-table tfoot td.r{text-align:right}
.rel-section-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:#64748b;padding:10px 9px 5px;border-bottom:1px solid #e2e8f0;background:#f8fafc}
.rel-by-cat{margin-top:20px}
.rel-by-cat-row{display:flex;align-items:center;gap:8px;padding:6px 9px;border-bottom:1px solid #f1f5f9;font-size:12px}
.rel-by-cat-row:nth-child(even){background:#fafbfc}
.rel-by-cat-name{flex:1}
.rel-by-cat-bar{height:6px;border-radius:3px;background:#e2e8f0;flex:2;overflow:hidden}
.rel-by-cat-fill{height:100%;border-radius:3px}
.rel-by-cat-val{width:100px;text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.rel-by-cat-pct{width:38px;text-align:right;color:#64748b;font-size:11px}
/* ─── PRINT ─── */
@media print{
  .sidebar,.topbar,.tabs,.rel-filters,.rel-actions,.toast,.fab,.undo-toast,.save-ind{display:none!important}
  .cnt{padding:0!important;background:#fff!important}
  .rel-preview{border:none!important;border-radius:0!important}
  .rel-doc{padding:16px 20px!important;max-width:100%!important}
  body,html{background:#fff!important}
  .app{box-shadow:none!important;border-radius:0!important}
  .rel-summ .rs{break-inside:avoid}
  .rel-table tbody tr{break-inside:avoid}
  @page{margin:1.2cm 1.5cm;size:A4 portrait}
}
html.dark .rel-filters input,html.dark .rel-filters select{background:var(--color-background-tertiary);border-color:var(--gray-300);color:var(--color-text-primary)}
html.dark .rel-preview{border-color:var(--gray-300)}

.tx-ch.sortable{cursor:pointer;user-select:none;transition:color .15s}
.tx-ch.sortable:hover{color:var(--blue)}
.tx-ch.sortable.sort-active{color:var(--blue)}
html.dark .tx-ch.sortable:hover{color:#60A5FA}
html.dark .tx-ch.sortable.sort-active{color:#60A5FA}
.sort-arrow{display:inline-block;margin-left:3px;font-size:8px;opacity:.5;vertical-align:middle;transition:opacity .15s}
.tx-ch.sort-active .sort-arrow{opacity:1}
.tx-card{display:table-row;transition:background .12s;border-left:none}
/* hover handled per row-even/odd */
.tx-cell{display:table-cell;vertical-align:middle;padding:9px 10px;border-bottom:1px solid var(--gray-100);white-space:nowrap;font-size:14px}
.tx-cell-main{overflow:hidden;text-overflow:ellipsis}
.tx-card:last-child .tx-cell{border-bottom:none}
.tx-cell-main{white-space:normal}
.tx-icon{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;font-size:14px;font-weight:700;flex-shrink:0;letter-spacing:0;vertical-align:middle}
.tx-body{display:inline-flex;align-items:center;gap:8px;min-width:0;vertical-align:middle}
.tx-desc{font-size:14px;font-weight:600;color:var(--gray-900);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx-chips{display:inline-flex;align-items:center;gap:3px;font-size:11px;color:var(--gray-400);margin-left:6px}
.tx-cat-name{color:var(--gray-500);font-weight:600}
.tx-acc-name{color:var(--gray-400)}
.tx-dot-sep{color:var(--gray-300)}
.tx-fam{display:inline-flex;align-items:center;gap:3px;padding:1px 6px;border-radius:99px;font-size:10px;font-weight:600;background:var(--purple-light);color:var(--transfer);margin-left:2px}
.tx-recur{display:inline-flex;align-items:center;gap:3px;padding:1px 6px;border-radius:99px;font-size:10px;font-weight:600;background:var(--blue-light);color:#1D4ED8;margin-left:2px;cursor:help;position:relative}
.tx-recur-tip{display:none;position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);background:var(--gray-900);color:#fff;font-size:11px;font-weight:400;padding:6px 10px;border-radius:6px;white-space:nowrap;z-index:100;pointer-events:none;line-height:1.4;text-align:center;box-shadow:0 4px 12px rgba(0,0,0,.18)}
.tx-recur-tip::after{content:'';position:absolute;top:100%;left:50%;transform:translateX(-50%);border:5px solid transparent;border-top-color:var(--gray-900)}
.tx-recur:hover .tx-recur-tip{display:block}
.tx-right{display:inline-flex;flex-direction:row;align-items:center;gap:6px;flex-shrink:0}
.tx-right .tx-val{text-align:right}
.tx-val{font-size:14px;font-weight:700;letter-spacing:-.2px;white-space:nowrap;font-family:var(--font-mono)}
.tx-cell-pct{color:var(--gray-400);font-size:13px}
.tx-cell-date{color:var(--gray-400);font-size:13px}
.tx-val{font-variant-numeric:tabular-nums}
.tx-edit-hint{color:var(--gray-300);font-size:13px;line-height:1}
/* dark */
html.dark .tx-card:hover .tx-cell{background:#162035}
html.dark .tx-cell{border-bottom-color:#1e2d45}html.dark .tx-card:hover .tx-cell{background:unset}

/* ─── TX GROUP ─── */
.tx-group{margin-bottom:4px}
.tx-group-header{display:flex;align-items:center;justify-content:space-between;padding:10px 14px 7px;background:var(--gray-50);border-radius:var(--radius-md) var(--radius-md) 0 0;border-bottom:2px solid var(--gray-200);margin-top:8px}
.tx-group-header:first-child{margin-top:0}
.tx-group-title{font-size:13px;font-weight:700;color:var(--gray-700);letter-spacing:-.1px}
.tx-group-totals{display:flex;gap:14px;font-size:13px;font-weight:700;font-family:var(--font-mono)}

/* ─── TX DAY ─── */
.tx-day-block{display:contents}
/* zebra: azul claro / branco alternado */
.tx-card.row-even .tx-cell{background:var(--gray-50)}
.tx-card.row-odd  .tx-cell{background:#fff}
.tx-card.row-even:hover .tx-cell{background:var(--gray-100)}
.tx-card.row-odd:hover  .tx-cell{background:var(--gray-50)}
html.dark .tx-card.row-even .tx-cell{background:#0c1f40}
html.dark .tx-card.row-odd  .tx-cell{background:#0f1e35}
html.dark .tx-card.row-even:hover .tx-cell{background:#1e3a8a}
html.dark .tx-card.row-odd:hover  .tx-cell{background:#162035}

/* ─── FAMILY FILTER ─── */
.fam-filter-row{display:flex;align-items:center;gap:8px;padding:8px 0 6px;flex-wrap:wrap}
.fam-filter-label{font-size:11px;font-weight:700;color:var(--gray-400);text-transform:uppercase;letter-spacing:.7px;white-space:nowrap;display:flex;align-items:center;gap:5px}
.fam-edit-box{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:12px 14px;background:var(--purple-light);border-radius:var(--radius-lg);margin-bottom:8px;border:1px solid #DDD6FE}
.fam-edit-chip{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:99px;background:var(--transfer-border);color:var(--transfer);font-size:13px;font-weight:600}
.fam-edit-chip button{background:none;border:none;color:var(--transfer);cursor:pointer;font-size:12px;padding:0 2px}
.fam-edit-input{font-size:13px;padding:6px 12px;border-radius:99px;border:1.5px solid #C4B5FD;width:130px;background:#fff;color:var(--gray-900);font-family:var(--font-sans);outline:none}
.fam-edit-input:focus{border-color:var(--purple)}

/* ─── PERIOD & FAMILY CHIPS ─── */
.fam-badge{display:inline-flex;align-items:center;gap:3px;padding:2px 9px;border-radius:99px;font-size:11px;font-weight:700;background:var(--purple-light);color:var(--transfer);white-space:nowrap}
.period-bar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:8px 0 4px}
.period-btn{padding:6px 13px;border-radius:99px;border:1.5px solid var(--gray-200);font-size:13px;font-weight:600;cursor:pointer;background:#fff;color:var(--gray-500);font-family:var(--font-sans);transition:all .15s}
.period-btn:hover{border-color:var(--gray-300);color:var(--gray-700)}
.period-btn.on{background:var(--blue);color:#fff;border-color:var(--blue);box-shadow:0 2px 8px rgba(37,99,235,.25)}
.fam-sel{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.fam-chip{padding:5px 13px;border-radius:99px;font-size:14px;font-weight:600;cursor:pointer;border:1.5px solid var(--gray-200);background:#fff;color:var(--gray-500);transition:all .15s;font-family:var(--font-sans)}
.fam-chip:hover{border-color:var(--gray-300)}
.fam-chip.sel{border-color:var(--purple);background:var(--purple-light);color:var(--transfer)}

/* ─── EXTRA POLISH ─── */
.bar-row{display:flex;align-items:center;gap:10px}
.bar-bg{flex:2;background:var(--gray-100);border-radius:99px;height:5px;overflow:hidden}
.bar-fill{height:100%;border-radius:99px;transition:width .4s ease}
.cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.cat-card{display:flex;align-items:center;gap:8px;padding:11px 13px;background:#fff;border-radius:var(--radius-lg);border:1px solid var(--gray-200);transition:box-shadow .15s,transform .15s}
.cat-card:hover{box-shadow:var(--shadow-sm);transform:translateY(-1px)}
.cat-card.hl{border:2px solid var(--blue)}
.cat-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.cat-name{font-size:14px;font-weight:600;color:var(--gray-800);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.color-swatches{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.swatch{width:24px;height:24px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:transform .15s}
.swatch:hover{transform:scale(1.15)}
.swatch.sel{border-color:var(--gray-900);transform:scale(1.15);box-shadow:0 0 0 2px #fff,0 0 0 4px var(--gray-400)}
/* ─── ABA SENHAS ─── */
.senha-card{display:flex;align-items:center;gap:14px;padding:14px 16px;background:#fff;border-radius:var(--radius-xl);border:1px solid var(--gray-200);box-shadow:var(--shadow-sm);transition:box-shadow .2s,transform .2s;flex-wrap:wrap}
.senha-card:hover{box-shadow:var(--shadow-md)}
.senha-ic{width:40px;height:40px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;background:var(--blue-light)}
.senha-info{flex:1;min-width:0}
.senha-site{font-size:15px;font-weight:700;color:var(--gray-900)}
.senha-url{font-size:12px;color:var(--blue);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-decoration:none;display:block}
.senha-url:hover{text-decoration:underline}
.senha-field{display:flex;align-items:center;gap:6px;margin-top:5px;font-size:13px;color:var(--gray-600)}
.senha-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--gray-400);min-width:52px}
.senha-val{font-family:var(--font-mono);font-size:13px;color:var(--gray-800)}
.senha-val.hidden{letter-spacing:3px;color:var(--gray-300)}
.senha-copy{background:none;border:none;cursor:pointer;color:var(--gray-400);font-size:13px;padding:2px 4px;border-radius:4px;transition:color .1s,background .1s}
.senha-copy:hover{color:var(--blue);background:var(--blue-light)}
.senha-toggle{background:none;border:none;cursor:pointer;color:var(--gray-400);font-size:13px;padding:2px 4px;border-radius:4px;transition:color .1s}
.senha-toggle:hover{color:var(--gray-700)}
.senha-obs{font-size:12px;color:var(--gray-500);margin-top:6px;font-style:italic;border-top:1px solid var(--gray-100);padding-top:6px}
.senha-actions{display:flex;gap:6px;flex-shrink:0}
html.dark .senha-card{background:#0f1e35;border-color:#1e2d45}
html.dark .senha-ic{background:#0c1f40}
html.dark .senha-site{color:#c8daf0}
html.dark .senha-field{color:#8aafd4}
html.dark .senha-val{color:#c8daf0}
html.dark .senha-val.hidden{color:#2e3d55}
html.dark .senha-obs{color:var(--gray-400);border-top-color:#1e2d45}
html.dark .senha-copy:hover{color:#60a5fa;background:#0c1f40}
html.dark .senha-toggle:hover{color:#c8daf0}
/* ─── Extrato no celular: cada lançamento vira um card ─── */
@media(max-width:600px){
  .tx-list{display:block}
  .tx-col-header{display:none}
  .tx-day-block{display:block}
  .tx-card{display:grid;grid-template-columns:30px auto minmax(0,1fr) auto;grid-template-areas:"icon main main val" "icon acc cat date";column-gap:8px;row-gap:3px;align-items:center;padding:11px 12px;border-bottom:1px solid var(--gray-100);background:var(--color-background-primary);cursor:pointer}
  .tx-card.is-sel{background:#EFF6FF}
  html.dark .tx-card.is-sel{background:#1e2d4a}
  .tx-card .tx-cell{display:block;padding:0!important;border:none!important;background:transparent!important;width:auto;max-width:none;min-width:0;font-size:12.5px}
  .tx-card .tx-cell-icon{grid-area:icon;align-self:center}
  .tx-card .tx-cell-main{grid-area:main;overflow:hidden}
  .tx-card .tx-cell-main .tx-desc{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tx-card .tx-chips{display:none}
  .tx-card .tx-cell-val{grid-area:val;text-align:right}
  .tx-card .tx-cell-acc{grid-area:acc;max-width:42vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tx-card .tx-cell-cat{grid-area:cat;overflow:hidden}
  .tx-card .tx-cell-cat::before{content:"·";margin-right:6px;color:var(--gray-300)}
  .tx-card .tx-cell-cat>span{display:inline-flex!important}
  .tx-card .tx-cell-date{grid-area:date;text-align:right}
  .tx-card .tx-cell-actions{display:none}
  .card>.ph{flex-direction:column;align-items:stretch;gap:10px}
  .card>.ph>div{justify-content:flex-start}
  .card>.ph>div>div[style*="flex:1"]{display:none}
  .fab{right:16px;bottom:16px}
  .save-ind #fb-status-label{display:none}
  .undo-toast{bottom:84px}
  .topbar{flex-wrap:wrap;row-gap:8px;padding:10px 12px;gap:8px}
  .topbar #accSel{flex:1 1 140px;min-width:0;width:auto;max-width:none}
  .save-ind{width:auto}
  .row3{gap:8px}
  .stat .val{font-size:13.5px;letter-spacing:-.4px;white-space:nowrap}
  .hide-mobile{display:none!important}
  .lbl-per{display:none}
  /* formulários em uma coluna no celular (campos não estouram a tela) */
  .tx-modal-box .fg{grid-template-columns:minmax(0,1fr)!important}
  .tx-modal-box .fr{min-width:0}
  .tx-modal-box .fr input,.tx-modal-box .fr select,.tx-modal-box .fr textarea{max-width:100%;box-sizing:border-box}
  .cc-head{grid-template-columns:1fr;gap:12px}
  .cc-fat-resumo{grid-template-columns:1fr 1fr}
  .cc-cfg-grid{grid-template-columns:1fr 1fr}
  .cc-cfg-grid>div{grid-column:1/-1}
  .cc-prox-row{grid-template-columns:52px minmax(0,1fr) 92px;}
  .cc-prox-row .cc-st{display:none}
  .cc-alerta-row{flex-wrap:wrap}
  .cc-alerta-row button{margin-left:auto}
  /* painel de controles vira uma folha fixa: não se move quando a barra do topo muda */
  .ctl-panel{position:fixed;left:12px;right:12px;top:auto;bottom:12px;max-height:60vh;min-width:0;z-index:960}
  .onb-steps li{flex-wrap:wrap}
  .onb-txt{flex:1 1 calc(100% - 44px)}
  .onb-steps button{margin-left:40px}
  .orc-form-row{grid-template-columns:minmax(0,1fr) 140px}
  .page-title{flex:1 1 calc(100% - 60px);font-size:16px}
  .cat-hint{display:none}
  /* Relatórios */
  .rel-btns{width:100%}
  .rel-btns button{flex:1;justify-content:center}
  .rel-filt-toggle{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border:1.5px solid var(--gray-200);border-radius:var(--radius-md);background:var(--color-background-secondary);color:var(--color-text-primary);font-family:inherit;font-size:13px;cursor:pointer;text-align:left;margin-bottom:4px}
  .rft-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
  .rft-sum{font-size:12px;color:var(--gray-500);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rft-caret{transition:transform .15s}
  .rel-filt-toggle[aria-expanded="true"] .rft-caret{transform:rotate(180deg)}
  .rel-filters{display:none}
  .rel-filters.open{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
  .rel-filters.open .rel-group select,.rel-filters.open .rel-group input{width:100%}
  .rel-filters.open .rel-group:last-child{grid-column:1/-1}
  .rel-summ{display:grid!important;grid-template-columns:1fr 1fr;gap:8px}
  .rel-summ .rs{padding:10px 12px;min-width:0}
  .rel-summ .rs-val{font-size:14px;white-space:nowrap}
  .rel-doc{padding:14px 12px!important}
  .rel-doc{overflow-x:auto}
  .rel-doc table{font-size:11.5px;min-width:520px}
  .rel-filters.open .rel-group:last-child{flex-wrap:wrap;justify-content:flex-start!important}
  .rel-filters.open .rel-group:last-child label{white-space:nowrap}
  /* Categorias */
  .cat-tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
  .cat-tab-btn{padding:9px 2px;white-space:nowrap;font-size:12.5px;display:flex;align-items:center;justify-content:center;gap:4px;min-width:0}
  .cat-tree{flex-direction:column}
  .cat-tree-list{width:100%;min-height:0}
  .cat-tree-actions{order:-1;width:100%;flex-direction:row}
  .cat-tree-actions .cat-act-btn:not(.add){display:none}
  .lbl-long{display:none}.lbl-short{display:inline}
  .cat-tree-actions.has-sel{position:fixed;left:12px;right:12px;bottom:12px;width:auto;box-sizing:border-box;z-index:950;flex-wrap:wrap;gap:8px;padding:12px;background:var(--color-background-primary);border:1px solid var(--gray-200);border-radius:16px;box-shadow:var(--shadow-lg)}
  .cat-tree-actions.has-sel .cat-act-btn{display:flex;flex:1 1 40%;justify-content:center}
  .cat-tree-actions.has-sel .cat-act-btn:disabled{display:none}
  .cat-tree-actions.has-sel .cat-sel-bar{display:flex;align-items:center;justify-content:space-between;width:100%;gap:8px}
  .cat-sel-name{font-weight:700;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .card:has(.cat-tree-actions.has-sel){padding-bottom:150px}
  /* Início: gráfico em cima, lista na largura toda */
  .pie-wrap{flex-direction:column;align-items:stretch}
  .pie-box{align-self:center;width:150px;height:150px}
  .pl-val{min-width:0}
  .lanc-filter-sel{flex:1 1 140px}
}

.csv-fam{width:100%;min-width:118px;max-width:170px;font-size:12.5px;padding:6px 8px;border-radius:8px;border:1px solid var(--gray-200,#CBD5E1);background:var(--color-background-primary,#fff);color:inherit;font-family:var(--font-sans);cursor:pointer}
.csv-fam.regra{border-color:#f59e0b;box-shadow:inset 3px 0 0 #f59e0b}
html.dark .csv-fam{background:#162035;border-color:#2e3d55;color:#c8daf0}
.rg-fam{display:inline-flex;align-items:center;gap:3px;margin-left:8px;padding:1px 8px;border-radius:999px;font-size:11.5px;font-weight:600;background:#EDE9FE;color:#5B21B6;white-space:nowrap}
html.dark .rg-fam{background:#1e1050;color:#c4b5fd}
.rg-semcat{font-size:12px;color:var(--gray-400);font-style:italic}
.rg-c-fam select{width:100%}

.csv-th-sort button{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:4px;font:inherit;color:inherit;text-transform:inherit;letter-spacing:inherit;border-radius:4px;padding:2px 4px;margin:-2px -4px}
.csv-th-sort button:hover{background:rgba(37,99,235,.12)}
.csv-th-sort button:focus-visible{outline:2px solid #3b82f6;outline-offset:1px}
.csv-sort-ic{font-size:9px;opacity:.55}
.csv-th-sort.on .csv-sort-ic{opacity:1}

.cp-lista{display:flex;flex-direction:column;gap:8px}
.cp-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--gray-200);border-radius:12px;cursor:pointer;transition:border-color .15s,background .15s}
.cp-item:hover{border-color:var(--blue)}
.cp-item.on{border-color:var(--transfer);background:rgba(124,58,237,.06)}
.cp-item input{width:18px;height:18px;flex-shrink:0;cursor:pointer;accent-color:var(--transfer)}
.cp-ic{width:30px;height:30px;border-radius:8px;background:var(--gray-100,#F1F5F9);display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
.cp-txt{flex:1;min-width:0;display:flex;flex-direction:column;font-size:13.5px;color:var(--gray-900)}
.cp-txt span{font-size:12px;color:var(--gray-500)}
.cp-st{font-size:11.5px;font-weight:600;color:var(--gray-400);white-space:nowrap}
.cp-item.on .cp-st{color:var(--transfer)}
.cp-aviso{margin-top:10px;font-size:12px;color:var(--amber);line-height:1.5}
.cp-nota{margin:10px 0 0;padding:8px 12px;border-radius:10px;font-size:12.5px;background:rgba(124,58,237,.08);color:var(--transfer);border:1px solid rgba(124,58,237,.25)}
.cp-nota a{color:inherit;font-weight:700}
html.dark .cp-ic{background:#162035}
@media(max-width:600px){.cp-st{display:none}}
</style>

<!-- Tela de Login do Sistema -->
<div id="app-login-screen" style="display:none;position:fixed;inset:0;z-index:99998;background:var(--color-background-primary,#0d1424);align-items:center;justify-content:center;flex-direction:column">
  <div style="width:100%;max-width:360px;padding:0 20px">
    <!-- Logo -->
    <div style="text-align:center;margin-bottom:28px">
      <div style="width:56px;height:56px;background:linear-gradient(135deg,#2563EB 0%,var(--transfer) 100%);border-radius:16px;display:flex;align-items:center;justify-content:center;margin:0 auto 14px;box-shadow:0 4px 20px rgba(37,99,235,.35)"><svg class="ic" style="width:28px;height:28px;color:#fff" aria-hidden="true"><use href="#i-wallet"/></svg></div>
      <h1 style="font-size:22px;font-weight:700;color:var(--gray-900);margin:0 0 4px;font-family:var(--font-sans)">Minhas Finanças</h1>
      <p style="font-size:13px;color:var(--gray-400);margin:0;font-family:var(--font-sans)">Faça login para continuar</p>
    </div>
    <!-- Card -->
    <div style="background:var(--color-background-secondary,#111827);border:1.5px solid var(--gray-200);border-radius:20px;padding:24px">
      <!-- Campo: e-mail ou usuário -->
      <div style="margin-bottom:14px">
        <label style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--gray-400);font-family:var(--font-sans);display:block;margin-bottom:6px">E-mail ou usuário</label>
        <input id="login-id" type="text" placeholder="seu@email.com ou login" autocomplete="username"
          style="width:100%;padding:11px 13px;border-radius:10px;border:1.5px solid var(--gray-200);background:var(--color-background-primary);color:var(--color-text-primary);font-size:14px;font-family:var(--font-sans);box-sizing:border-box;outline:none"
          onfocus="this.style.borderColor='#2563EB';this.style.boxShadow='0 0 0 3px rgba(37,99,235,.12)'"
          onblur="this.style.borderColor='';this.style.boxShadow=''"
          onkeydown="if(event.key==='Enter')document.getElementById('login-id-pass').focus()">
      </div>
      <!-- Campo: senha -->
      <div style="margin-bottom:20px">
        <label style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--gray-400);font-family:var(--font-sans);display:block;margin-bottom:6px">Senha</label>
        <div style="position:relative">
          <input id="login-id-pass" type="password" placeholder="••••••••" autocomplete="current-password"
            style="width:100%;padding:11px 40px 11px 13px;border-radius:10px;border:1.5px solid var(--gray-200);background:var(--color-background-primary);color:var(--color-text-primary);font-size:14px;font-family:var(--font-mono);box-sizing:border-box;outline:none"
            onfocus="this.style.borderColor='#2563EB';this.style.boxShadow='0 0 0 3px rgba(37,99,235,.12)'"
            onblur="this.style.borderColor='';this.style.boxShadow=''"
            onkeydown="if(event.key==='Enter')appLoginUnified()">
          <button type="button" onclick="const i=document.getElementById('login-id-pass');i.type=i.type==='password'?'text':'password'"
            style="position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:15px;color:var(--gray-400);padding:2px">👁</button>
        </div>
      </div>
      <!-- Mensagem de erro -->
      <div id="login-err" style="display:none;padding:9px 12px;background:var(--expense-bg);border:1px solid var(--expense-border);border-radius:8px;font-size:12px;color:var(--expense);margin-bottom:14px;font-family:var(--font-sans)"></div>
      <!-- Botão entrar -->
      <button id="login-btn-unified" onclick="appLoginUnified()"
        style="width:100%;padding:12px;background:linear-gradient(135deg,#2563EB,var(--transfer));color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;font-family:var(--font-sans);box-shadow:0 4px 16px rgba(37,99,235,.3);transition:opacity .15s">
        Entrar
      </button>
    </div>
    <!-- Conta recente Firebase -->
    <div id="login-recent-account" style="display:none;margin-top:16px">
      <p style="text-align:center;font-size:11px;color:var(--gray-400);margin:0 0 8px;font-family:var(--font-sans)">Acesso recente</p>
      <button onclick="_loginUseRecent()" id="login-recent-btn"
        style="width:100%;display:flex;align-items:center;gap:12px;padding:11px 14px;background:var(--color-background-secondary,#111827);border:1.5px solid var(--gray-200);border-radius:14px;cursor:pointer;font-family:var(--font-sans);transition:border-color .15s"
        onmouseover="this.style.borderColor='#2563EB'" onmouseout="this.style.borderColor=''">
        <div id="login-recent-avatar" style="width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#2563EB,var(--transfer));display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#fff;flex-shrink:0"></div>
        <div style="text-align:left;overflow:hidden">
          <div id="login-recent-name" style="font-size:13px;font-weight:600;color:var(--color-text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis"></div>
          <div style="font-size:11px;color:var(--gray-400)"><svg class="ic sm" aria-hidden="true"><use href="#i-cloud"/></svg> Conta Firebase</div>
        </div>
        <div style="margin-left:auto;font-size:18px;color:var(--gray-400)">›</div>
      </button>
    </div>
    <p style="text-align:center;font-size:11px;color:var(--gray-300);margin-top:14px;font-family:var(--font-sans)">Minhas Finanças · Acesso restrito</p>
  </div>
</div>

</div>

<script type="module">
import { initializeApp, getApps, deleteApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getFirestore, doc, setDoc, getDoc } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';
import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';

// ── Configs dos ambientes ──
// Campos carregados do localStorage (salvo como JSON pelo _fbSaveConfig)
function _fbLoadConfig(env) {
  try {
    const raw = localStorage.getItem('pfp_fb_config_' + env);
    if (raw) return JSON.parse(raw);
  } catch(e) {}
  return {};
}
const _cfgTeste = _fbLoadConfig('teste');
const _cfgProd  = _fbLoadConfig('producao');
const FB_CONFIGS = {
  teste: {
    label: '🧪 Teste',
    apiKey:            _cfgTeste.apiKey            || localStorage.getItem('pfp_fb_apikey_teste') || "SUA_API_KEY_TESTE_AQUI",
    authDomain:        _cfgTeste.authDomain        || "personal-finances-9ccb7.firebaseapp.com",
    projectId:         _cfgTeste.projectId         || "personal-finances-9ccb7",
    storageBucket:     _cfgTeste.storageBucket     || "personal-finances-9ccb7.firebasestorage.app",
    messagingSenderId: _cfgTeste.messagingSenderId || "299660948262",
    appId:             _cfgTeste.appId             || "1:299660948262:web:e4ed144b1e4c0af5a387e7"
  },
  producao: {
    label: '🚀 Produção',
    apiKey:            _cfgProd.apiKey            || localStorage.getItem('pfp_fb_apikey_producao') || "AIzaSyDoyTUdnYgyIQ2hBEghFSN4KNGyTYHIWAU",
    authDomain:        _cfgProd.authDomain        || "personal-finances-prod-7b8ca.firebaseapp.com",
    projectId:         _cfgProd.projectId         || "personal-finances-prod-7b8ca",
    storageBucket:     _cfgProd.storageBucket     || "personal-finances-prod-7b8ca.firebasestorage.app",
    messagingSenderId: _cfgProd.messagingSenderId || "130033393114",
    appId:             _cfgProd.appId             || "1:130033393114:web:e449f11cdddf3acdffb4e3",
    measurementId:     _cfgProd.measurementId     || "G-LEE40E5VPL"
  }
};

// ── Função para salvar o firebaseConfig completo (JSON) e reinicializar ──
window._fbSaveConfig = function(env, jsonStr) {
  if (!jsonStr || !jsonStr.trim()) return { ok: false, err: 'JSON vazio' };
  let cfg;
  try {
    // Extrai o objeto do firebaseConfig se colado com var/const/let ou como bloco JS
    let clean = jsonStr.trim();
    // Remove wrapper "const firebaseConfig = {...};" ou similar
    clean = clean.replace(/^\s*(var|const|let)\s+\w+\s*=\s*/, '').replace(/;?\s*$/, '');
    // Normaliza chaves sem aspas (JS object literal) para JSON válido
    clean = clean.replace(/([{,]\s*)([a-zA-Z_]\w*)\s*:/g, '$1"$2":');
    // Troca aspas simples por duplas
    clean = clean.replace(/'/g, '"');
    cfg = JSON.parse(clean);
  } catch(e) {
    return { ok: false, err: 'JSON inválido: ' + e.message };
  }
  const REQUIRED = ['apiKey', 'authDomain', 'projectId'];
  const missing = REQUIRED.filter(k => !cfg[k]);
  if (missing.length) return { ok: false, err: 'Campos obrigatórios ausentes: ' + missing.join(', ') };

  // Persiste JSON completo
  localStorage.setItem('pfp_fb_config_' + env, JSON.stringify(cfg));
  // Compatibilidade retroativa com pfp_fb_apikey_*
  localStorage.setItem('pfp_fb_apikey_' + env, cfg.apiKey);
  // Atualiza FB_CONFIGS em memória
  Object.assign(FB_CONFIGS[env], cfg);

  // Destrói app existente e reinit com nova config
  try {
    const existing = getApps().find(a => a.name === 'pfp_' + env);
    if (existing) deleteApp(existing);
  } catch(e) {}
  const instance = _buildFb(env);
  window._fb = _makeFbApi(instance);
  if (window._fb) {
    window._fb.onAuth(_onFbAuthChange);
  }
  return { ok: true };
};

// Retrocompatibilidade: _fbSaveApiKey continua funcionando
window._fbSaveApiKey = function(env, key) {
  if (!key || !key.trim()) return;
  const existing = Object.assign({}, FB_CONFIGS[env] || {});
  existing.apiKey = key.trim();
  window._fbSaveConfig(env, JSON.stringify(existing));
};

// Ambiente salvo no localStorage (padrão: teste)
let _fbEnv = 'producao'; localStorage.setItem('pfp_fb_env', 'producao'); // sempre produção
window._fbEnv = _fbEnv;

function _buildFb(env) {
  const cfg = FB_CONFIGS[env];
  if (!cfg || !cfg.apiKey || cfg.apiKey.startsWith('SUA_')) return null;
  try {
    // Evita duplicar apps com mesmo nome
    const existing = getApps().find(a => a.name === 'pfp_' + env);
    const app  = existing || initializeApp(cfg, 'pfp_' + env);
    const db   = getFirestore(app);
    const auth = getAuth(app);
    return { app, db, auth };
  } catch(e) {
    console.warn('Firebase init error:', e);
    return null;
  }
}

let _fbInstance = _buildFb(_fbEnv);

function _makeFbApi(instance) {
  if (!instance) return null;
  const { db, auth } = instance;
  return {
    signIn:  (e,p) => signInWithEmailAndPassword(auth, e, p),
    signUp:  (e,p) => createUserWithEmailAndPassword(auth, e, p),
    signOut: ()    => signOut(auth),
    save:    async (uid, data) => {
      const clone = JSON.parse(JSON.stringify(data));
      await setDoc(doc(db, 'users', uid, 'data', 'main'), clone);
    },
    load:    async (uid) => {
      const snap = await getDoc(doc(db, 'users', uid, 'data', 'main'));
      return snap.exists() ? snap.data() : null;
    },
    onAuth:  (cb)  => onAuthStateChanged(auth, cb),
    getUser: ()    => auth.currentUser,
  };
}

window._fb = _makeFbApi(_fbInstance);
window._fbConfigs = FB_CONFIGS;

// Troca de ambiente
window._fbSwitchEnv = async function(env) {
  if (env === _fbEnv) return;
  // Desloga do ambiente atual
  if (_fbInstance) {
    try { await signOut(_fbInstance.auth); } catch(e) {}
  }
  _fbEnv = env;
  window._fbEnv = env;
  localStorage.setItem('pfp_fb_env', env);
  _fbInstance = _buildFb(env);
  window._fb = _makeFbApi(_fbInstance);
  window._fbUser = null;
  if (_fbInstance) {
    _fbInstance.auth && onAuthStateChanged(_fbInstance.auth, user => {
      window._fbUser = user || null;
      if (typeof _onFbAuthChange === 'function') _onFbAuthChange(user);
    });
  }
  if (typeof _onFbAuthChange === 'function') _onFbAuthChange(null);
};

// Listener de auth apenas para manter estado após login explícito do usuário
// (não é usado para auto-login no boot)
if (_fbInstance) {
  onAuthStateChanged(_fbInstance.auth, user => {
    window._fbUser = user || null;
    if (typeof _onFbAuthChange === 'function') _onFbAuthChange(user);
  });
}
</script>

// ── Snapshot dos dados "padrão" (seed) ──
// Usado para resetar o estado em memória ao trocar de conta Firebase,
// evitando que os dados do usuário anterior "vazem"/sejam salvos por engano
// na conta recém-logada antes dos dados reais dela serem carregados da nuvem.
const _SEED_DB_FIELDS = ['nid','familia','cats','catRegras','accounts','fixas','txs','senhas','usuarios','controles','controleAtivo','controlesCache','sharedAccounts','compart'];
const _SEED_DATA = JSON.parse(JSON.stringify(_SEED_DB_FIELDS.reduce((o,k)=>{o[k]=A[k];return o;},{})));
function _resetAppDataToSeed(){
  const fresh = JSON.parse(JSON.stringify(_SEED_DATA));
  _SEED_DB_FIELDS.forEach(k => { A[k] = fresh[k]; });
}

// ── Hierarquia de categorias (vários níveis) ──
const CAT_MAX_NIVEL=5; // categoria › sub › sub › sub › sub
function _catById(id){ return (id==null||id==='')?null:(A.cats.find(x=>x.id==id)||null); }
function _catCaminho(id){ const out=[]; const vistos=new Set(); let c=_catById(id); while(c&&!vistos.has(c.id)&&out.length<20){ vistos.add(c.id); out.unshift(c); c=c.parentId!=null?_catById(c.parentId):null; } return out; }
function _catRaizDe(id){ return _catCaminho(id)[0]||null; }
function _catNivel(id){ return Math.max(0,_catCaminho(id).length-1); }
function _catFilhas(id){ return A.cats.filter(c=>c.parentId!=null&&c.parentId==id); }
function _catDescIds(id){ const s=new Set([Number(id)]); const fila=[Number(id)]; while(fila.length){ const p=fila.shift(); A.cats.forEach(c=>{ if(c.parentId!=null&&c.parentId==p&&!s.has(c.id)){ s.add(c.id); fila.push(c.id); } }); } return s; }
function _catAltura(id){ const f=_catFilhas(id); return f.length?1+Math.max(...f.map(x=>_catAltura(x.id))):0; }
// Lista em ordem de árvore (pai, filhas, netas...) — para selects
function _catArvoreLista(tipo,ordenar){ const out=[]; const vis=(c,n)=>{ out.push({c,n}); let f=_catFilhas(c.id); if(ordenar) f=[...f].sort((a,b)=>a.name.localeCompare(b.name)); f.forEach(x=>vis(x,n+1)); }; let r=A.cats.filter(c=>c.tipo===tipo&&c.parentId==null); if(ordenar) r=[...r].sort((a,b)=>a.name.localeCompare(b.name)); r.forEach(c=>vis(c,0)); return out; }
const catBy=id=>{const c=_catById(id);if(!c)return{name:'Outros',color:'#888780',tipo:'despesa',parentId:null};const cam=_catCaminho(c.id);return{...c,displayName:cam.map(x=>x.name).join(' › ')};};
// Herda cor do pai se não tiver própria
function catColor(id){const r=_catRaizDe(id);return r?r.color:'#888780';}

// ══ Proteção de cadastros: nada é excluído se houver movimento ou processo ligado a ele ══
function _todosConteudos(){ // conteúdo do controle aberto + dos outros controles
  const out=[{txs:A.txs||[],fixas:A.fixas||[],catRegras:A.catRegras||[],accounts:A.accounts||[]}];
  if(A.controlesCache) Object.keys(A.controlesCache).forEach(k=>{ if(Number(k)===A.controleAtivo) return; const c=A.controlesCache[k]; if(c) out.push({txs:c.txs||[],fixas:c.fixas||[],catRegras:c.catRegras||[],accounts:c.accounts||[]}); });
  return out;
}
function _plural(n,um,varios){ return n+' '+(n===1?um:varios); }
// Mostra o bloqueio com a lista do que está ligado ao cadastro
function _bloquearExclusao(oque,nome,vinculos,dica){
  const itens=vinculos.filter(v=>v.n>0);
  if(!itens.length) return false;
  _showConfirm(`Não é possível excluir ${oque}`,
    `“<strong>${H(nome||'')}</strong>” está em uso:<ul class="vinc-lista">${itens.map(v=>`<li>${v.txt}</li>`).join('')}</ul>${dica?`<span class="vinc-dica">${dica}</span>`:''}`,
    null,{okLabel:'Entendi'});
  return true;
}
function _vinculosConta(id){
  const shared=_isSharedAcc(id);
  const conts=shared?_todosConteudos():[_todosConteudos()[0]];
  let mov=0, transf=0, fx=0;
  conts.forEach(c=>{
    c.txs.forEach(t=>{ if(t.accId==id||t.accDest==id){ if(t.type==='transferencia') transf++; else mov++; } });
    c.fixas.forEach(f=>{ if(f.accId==id) fx++; });
  });
  return [
    {n:mov,txt:_plural(mov,'lançamento','lançamentos')+(shared?' (somando todos os controles)':'')},
    {n:transf,txt:_plural(transf,'transferência/pagamento de fatura','transferências/pagamentos de fatura')},
    {n:fx,txt:_plural(fx,'conta fixa usa esta conta','contas fixas usam esta conta')},
  ];
}
function _vinculosCategoria(id){
  const ids=_catDescIds(id);
  const subs=A.cats.filter(c=>c.parentId!=null&&c.parentId==id).length;
  const _c=_catById(id); const _todos=_c&&_compartOn(_c.tipo)?_todosConteudos():[{txs:A.txs||[],fixas:A.fixas||[]}];
  const nTx=_todos.reduce((n,d)=>n+(d.txs||[]).filter(t=>ids.has(Number(t.catId))).length,0);
  const nFx=_todos.reduce((n,d)=>n+(d.fixas||[]).filter(f=>ids.has(Number(f.catId))).length,0);
  const nRg=_regras().filter(r=>ids.has(Number(r.catId))).length;
  return [
    {n:subs,txt:_plural(subs,'subcategoria dentro dela','subcategorias dentro dela')},
    {n:nTx,txt:_plural(nTx,'lançamento','lançamentos')+(ids.size>1?' (nela ou nas subcategorias)':'')},
    {n:nFx,txt:_plural(nFx,'conta fixa','contas fixas')},
    {n:nRg,txt:_plural(nRg,'regra de categorização','regras de categorização')},
  ];
}
function _vinculosFamilia(id){
  const item=famById(id); if(!item) return [];
  const filhos=famChildren(id).length;
  const nTx=(_compartOn('familia')?_todosConteudos():[{txs:A.txs||[]}]).reduce((n,d)=>n+(d.txs||[]).filter(t=>t.familia===item.name).length,0);
  return [
    {n:filhos,txt:_plural(filhos,'membro dentro deste grupo','membros dentro deste grupo')},
    {n:nTx,txt:_plural(nTx,'lançamento','lançamentos')},
  ];
}
function _vinculosFixa(id){
  const f=A.fixas.find(x=>x.id===id); if(!f) return [];
  const pags=Object.values(f.pagamentos||{}).filter(Boolean);
  const nPag=pags.filter(v=>v===true||A.txs.some(t=>t.id===v)).length;
  return [{n:nPag,txt:_plural(nPag,'mês já pago (lançamento gerado por ela)','meses já pagos (lançamentos gerados por ela)')}];
}
function _vinculosControle(id){
  const d=id===A.controleAtivo?{txs:A.txs,accounts:A.accounts,fixas:A.fixas,senhas:A.senhas}:((A.controlesCache&&A.controlesCache[id])||{});
  const n=k=>(Array.isArray(d[k])?d[k]:[]).length;
  return [
    {n:n('txs'),txt:_plural(n('txs'),'lançamento','lançamentos')},
    {n:n('accounts'),txt:_plural(n('accounts'),'conta cadastrada','contas cadastradas')},
    {n:n('fixas'),txt:_plural(n('fixas'),'conta fixa','contas fixas')},
    {n:n('senhas'),txt:_plural(n('senhas'),'senha no cofre','senhas no cofre')},
  ];
}
function _vinculosUsuario(id){
  let d=null; try{ d=JSON.parse(localStorage.getItem(userDataKey(id))||'null'); }catch(e){}
  if(!d) return [];
  let tx=0, ac=0, fx=0;
  const soma=c=>{ if(!c) return; tx+=(c.txs||[]).length; ac+=(c.accounts||[]).length; fx+=(c.fixas||[]).length; };
  soma(d); if(d.controlesCache) Object.keys(d.controlesCache).forEach(k=>{ if(Number(k)!==Number(d.controleAtivo)) soma(d.controlesCache[k]); });
  return [
    {n:tx,txt:_plural(tx,'lançamento','lançamentos')},
    {n:ac,txt:_plural(ac,'conta','contas')},
    {n:fx,txt:_plural(fx,'conta fixa','contas fixas')},
  ];
}

const _ctpReg={};
function _ctpTc(t){return t==='despesa'?'desp':t==='receita'?'rec':t==='transferencia'?'tr':'';}
function _catNomeCompleto(c){ if(!c) return ''; return _catCaminho(c.id).map(x=>x.name).join(' › ')||c.name; }
function _ctpTriggerInner(selCat,ph){
  const cor=selCat?(selCat.color||catColor(selCat.id)):'#94A3B8';
  let lbl;
  if(!selCat) lbl=`<span class="ctp-ph">${H(ph||'Selecione...')}</span>`;
  else if(selCat.parentId!=null){ const cam=_catCaminho(selCat.id).slice(0,-1); lbl=(cam.length?`<span class="ctp-pai">${cam.map(x=>H(x.name)).join(' › ')} ›</span> `:'')+H(selCat.name); }

function buildCatTreePicker(selId,tipo,pickerId,stateKey,opts){
  opts=opts||{};
  const prev=_ctpReg[pickerId]||{};
  _ctpReg[pickerId]={selId,tipo,stateKey,onPick:opts.onPick||null,ph:opts.placeholder||'Selecione...',exp:prev.exp||null,hl:null,edit:null,busca:''};

function _catMaisUsadas(tipo,n){
  const cont={}; const lim=addMonths(thisMonth(),-6);
  (A.txs||[]).forEach(t=>{ if(t.catId&&(!tipo||t.type===tipo)&&(t.date||'')>=lim) cont[t.catId]=(cont[t.catId]||0)+1; });
  return Object.keys(cont).map(Number).filter(id=>A.cats.some(c=>c.id===id)).sort((a,b)=>cont[b]-cont[a]).slice(0,n||5);
}
// Sugere categoria pelo histórico de lançamentos com descrição parecida
function _catSugerida(desc,tipo){
  const _rg=typeof _catPorRegra==='function'?_catPorRegra(desc,tipo):null; if(_rg) return _rg.catId;
  const k=_chaveDesc(desc||''); if(!k) return null;
  const ok=t=>t.catId&&(!tipo||t.type===tipo)&&A.cats.some(c=>c.id===t.catId);
  for(let i=A.txs.length-1;i>=0;i--){const t=A.txs[i]; if(ok(t)&&_chaveDesc(t.desc)===k) return t.catId;}
  const w=k.split(' ')[0]; if(w.length<4) return null;
  for(let i=A.txs.length-1;i>=0;i--){const t=A.txs[i]; if(ok(t)&&_chaveDesc(t.desc).split(' ')[0]===w) return t.catId;}
  return null;
}
function _ctpTipos(r){ return r.tipo?[r.tipo]:['despesa','receita','transferencia']; }
// Linhas visíveis da árvore (respeita busca e nós abertos)
function _ctpLinhas(pid){
  const r=_ctpReg[pid]; const q=_normTxt((r.busca||'').trim()); const bate=c=>!q||_normTxt(c.name).includes(q);
  const casa=c=>bate(c)||_catFilhas(c.id).some(casa);
  const out=[]; const e=r.edit;
  const visita=(c,nivel)=>{
    if(q&&!casa(c)) return;
    const filhas=_catFilhas(c.id);
    const aberto=q?filhas.some(casa):r.exp.has(c.id);
    out.push({c,nivel,temFilhos:filhas.length>0,aberto});
    if(aberto) filhas.forEach(f=>visita(f,nivel+1));
    if(e&&e.novo&&e.parentId!=null&&e.parentId==c.id) out.push({novo:true,nivel:nivel+1});
  };
  _ctpTipos(r).forEach(t=>{
    if(_ctpTipos(r).length>1) out.push({sec:t});
    A.cats.filter(c=>c.tipo===t&&c.parentId==null).forEach(root=>visita(root,0));
    if(e&&e.novo&&e.parentId==null&&e.tipo===t) out.push({novo:true,nivel:0});
  });
  return out;
}
function _ctpMarca(nome,q){
  q=_normTxt((q||'').trim()); if(!q) return H(nome);
  const i=_normTxt(nome).indexOf(q); if(i<0) return H(nome);
  return H(nome.slice(0,i))+'<mark>'+H(nome.slice(i,i+q.length))+'</mark>'+H(nome.slice(i+q.length));
}
function _ctpEditorHtml(pid,nivel){

function _ctpArvoreHtml(pid){
  const r=_ctpReg[pid]; const linhas=_ctpLinhas(pid);
  let h='';
  linhas.forEach(l=>{
    if(l.sec){ h+=`<div class="ctp-sec">${l.sec==='despesa'?'Despesas':l.sec==='receita'?'Receitas':'Transferências'}</div>`; return; }
    if(l.novo){ h+=_ctpEditorHtml(pid,l.nivel); return; }
    const c=l.c;
    if(r.edit&&!r.edit.novo&&r.edit.id===c.id){ h+=_ctpEditorHtml(pid,l.nivel); return; }
    const sel=c.id==r.selId, hl=c.id==r.hl;
    const chev=l.temFilhos?`<span class="ctp-chev" onclick="event.stopPropagation();_ctpExpandir('${pid}',${c.id})" role="button" aria-label="${l.aberto?'Recolher':'Expandir'}"><svg class="ic sm" aria-hidden="true"><use href="#i-chevron-${l.aberto?'down':'right'}"/></svg></span>`:`<span class="ctp-chev"></span>`;

  });
  if(!h) h=`<div class="ctp-vazio">Nenhuma categoria com “${H((r.busca||'').trim())}”.<br><button type="button" class="ctp-link" onclick="_ctpAdicionar('${pid}',false,true)">Criar “${H((r.busca||'').trim())}”</button></div>`;
  return h;
}
function _ctpHlCat(pid){ const r=_ctpReg[pid]; return A.cats.find(c=>c.id==r.hl)||null; }
function _ctpBotoesHtml(pid){
  const r=_ctpReg[pid]; const c=_ctpHlCat(pid); const ed=false; // botões nunca ficam travados durante a edição

function _isSharedAcc(id){ return (A.sharedAccounts||[]).some(a=>a.id===id); }
// Junta os lançamentos do controle ativo com os de todos os outros controles
// (usado para calcular o saldo de contas compartilhadas, que somam tudo).
function _allTxsAcrossControles(){
  const out=[...A.txs];
  if(A.controlesCache){
    Object.keys(A.controlesCache).forEach(k=>{
      const id=Number(k);
      if(id===A.controleAtivo) return; // já incluído via A.txs
      const c=A.controlesCache[k];
      if(c && Array.isArray(c.txs)) out.push(...c.txs);
    });
  }
  return out;
}
function _acctTxCountInOtherControles(accId){
  let n=0;
  if(A.controlesCache){
    Object.keys(A.controlesCache).forEach(k=>{
      const id=Number(k);
      if(id===A.controleAtivo) return;
      const c=A.controlesCache[k];
      if(c && Array.isArray(c.txs)) n+=c.txs.filter(t=>t.accId===accId||t.accDest===accId).length;
    });
  }
  return n;
}
const accBy=id=>_allAccounts().find(a=>a.id==id)||{name:'?',id:0};
function bal(acc){
  let b=acc.ini||0;
  const active=acc.iniDateActive===true||acc.iniDateActive==='true';
  const iniD=acc.iniDate&&acc.iniDate.length===10?acc.iniDate:'';
  const cutoff=(active&&iniD)?iniD:null;
  const txsSrc=_isSharedAcc(acc.id)?_allTxsAcrossControles():A.txs;
  txsSrc.filter(t=>t.done&&(!cutoff||t.date>=cutoff)).forEach(t=>{
    if(t.type==='transferencia'){if(t.accId==acc.id)b-=t.val;if(t.accDest==acc.id)b+=t.val;}
    else if(t.accId==acc.id)b+=t.type==='receita'?t.val:-t.val;
  });
  return b;
}
// Retorna quantos lançamentos foram ignorados pelo cutoff desta conta
function balIgnorados(acc){
  const active=acc.iniDateActive===true||acc.iniDateActive==='true';
  const iniD=acc.iniDate&&acc.iniDate.length===10?acc.iniDate:'';
  if(!active||!iniD) return 0;
  const txsSrc=_isSharedAcc(acc.id)?_allTxsAcrossControles():A.txs;
  return txsSrc.filter(t=>t.done&&t.accId==acc.id&&t.date<iniD).length;
}

// Retorna {val, label, color} prontos para exibição

// Calcula fixas ativas para um mês (respeita periodicidade e parcelamento)
function fixasParaMes(mes){
  return A.fixas.filter(f=>{
    if(!f.ativa) return false;
    const step=FIXA_STEP[f.recur]||1;
    // Âncora = inicioEm se definido, senão primeiro pagamento, senão não restringe (legado)
    const anchor=f.inicioEm||(Object.keys(f.pagamentos||{}).sort()[0]||null);
    // Se tem âncora, o mês consultado não pode ser anterior a ela
    if(anchor){
      const [ay,am]=anchor.split('-').map(Number);
      const [fy,fm]=mes.split('-').map(Number);
      const diff=(fy-ay)*12+(fm-am);
      if(diff<0) return false;
      if(diff%step!==0) return false;
      // Parcelamento: se definido, encerra após o número de parcelas
      if(f.parcelas&&(diff/step)>=f.parcelas) return false;
      return true;
    }
    // Sem âncora (fixas legadas sem inicioEm): usa comportamento anterior
    if(f.recur==='mensal') return !f.parcelas;
    const pagMeses=Object.keys(f.pagamentos||{}).sort();
    const legacyAnchor=pagMeses.length>0?pagMeses[0]:thisMonth();
    const [ay,am]=legacyAnchor.split('-').map(Number);
    const [fy,fm]=mes.split('-').map(Number);
    const diff=(fy-ay)*12+(fm-am);
    if(diff<0) return false;
    if(diff%step!==0) return false;
    if(f.parcelas&&(diff/step)>=f.parcelas) return false;
    return true;
  });
}

// Retorna a parcela atual (1-based) de uma fixa parcelada para o mês informado, ou null se não parcelada/fora do período
function fixaParcelaAtual(f,mes){
  if(!f.parcelas) return null;
  const anchor=f.inicioEm||(Object.keys(f.pagamentos||{}).sort()[0]||null);
  if(!anchor) return null;
  const step=FIXA_STEP[f.recur]||1;
  const [ay,am]=anchor.split('-').map(Number);
  const [fy,fm]=mes.split('-').map(Number);
  const diff=(fy-ay)*12+(fm-am);
  if(diff<0||diff%step!==0) return null;
  const idx=(diff/step)+1;
  if(idx>f.parcelas) return null;
  return idx;
}

// Texto de preview do parcelamento (usado no formulário de conta fixa)
function fixaParcEndLabel(f){
  if(!f.parcelas||f.parcelas<=1) return '<span style="color:var(--gray-400)">Recorrência sem fim</span>';
  const step=FIXA_STEP[f.recur]||1;
  const inicio=f.inicioEm||A.fixaMes;
  const [ay,am]=inicio.split('-').map(Number);
  const totalMonths=(f.parcelas-1)*step;
  const endY=ay+Math.floor((am-1+totalMonths)/12);
  const endM=((am-1+totalMonths)%12)+1;
  const endStr=`${MNLONG[String(endM).padStart(2,'0')]}/${endY}`;
  return `<span style="color:#2563EB">${f.parcelas}x · termina em ${endStr}</span>`;
}

function render(){
  if(A.pie){A.pie.destroy();A.pie=null;}
  if(A.projChart){A.projChart.destroy();A.projChart=null;}
  if(A.famChart){A.famChart.destroy();A.famChart=null;}
  updSel();const m=document.getElementById('main');
  const t=A.tab;
  // Sincroniza aba principal ativa na sidebar
  const transAba = ['lanc','fixas','cartoes'];
  const cfgAba = ['cats','senhas','controles','armazenamento'];
  document.querySelectorAll('.tab').forEach(tb=>tb.classList.remove('on'));
  const transGroup=document.getElementById('nav-transacoes');
  const cfgGroup=document.getElementById('nav-config');
  if(transAba.includes(t)){
    const parentBtn=document.getElementById('transacoes-parent-btn');
    if(parentBtn) parentBtn.classList.add('on');
    if(transGroup) transGroup.classList.add('open');
    const subBtns=document.querySelectorAll('#trans-submenu .sub-tab');
    const idx={lanc:0,fixas:1,cartoes:2}[t];
    subBtns.forEach((b,i)=>b.classList.toggle('on',i===idx));
  } else {
    if(transGroup) transGroup.classList.remove('open');
  }
  if(cfgAba.includes(t)){
    const parentBtn=document.getElementById('config-parent-btn');
    if(parentBtn) parentBtn.classList.add('on');
    if(cfgGroup) cfgGroup.classList.add('open');
    const cfgIdx = t==='senhas' ? 2 : (t==='controles' ? 3 : (t==='armazenamento' ? 4 : (A.catTab==='familia' ? 1 : 0)));
    document.querySelectorAll('#config-submenu .sub-tab').forEach((b,i)=>b.classList.toggle('on',i===cfgIdx));
  } else {
    if(cfgGroup) cfgGroup.classList.remove('open');
  }
  if(!transAba.includes(t)&&!cfgAba.includes(t)){
    if(t==='painel'){
      const btn=document.querySelector('.tab[onclick*="painel"]');if(btn)btn.classList.add('on');
    } else if(t==='projecao'){
      const btn=document.querySelector('.tab[onclick*="projecao"]');if(btn)btn.classList.add('on');
    } else if(t==='relatorio'){
      const btn=document.querySelector('.tab[onclick*="relatorio"]');if(btn)btn.classList.add('on');
    } else if(t==='contas'){
      const btn=document.querySelector('.tab[onclick*="contas"]');if(btn)btn.classList.add('on');
    }
  }
  _setPageTitle(t);
  if(t!=='painel') A.orcOpen=false;
  if(t==='painel')rPainel(m);else if(t==='lanc')rLanc(m);
  else if(t==='fixas')rFixas(m);else if(t==='projecao')rProjecao(m);
  else if(t==='contas')rContas(m);else if(t==='cartoes')rCartoes(m);else if(t==='senhas')rSenhas(m);else if(t==='relatorio')rRelatorio(m);else if(t==='controles')rControles(m);else if(t==='armazenamento')rArmazenamento(m);else rCats(m);
  if(t==='painel'&&A.orcOpen) m.insertAdjacentHTML('beforeend',_orcModalHtml());
}

function rPainel(m){

  let txs;
  if(period==='mes'){
    txs=filt().filter(t=>t.date&&t.date.startsWith(mes));
  } else if(period==='custom'){
    if(A.painelDtIni&&A.painelDtFim){
      txs=filt().filter(t=>t.date>=A.painelDtIni&&t.date<=A.painelDtFim);

    txs=filt().filter(t=>t.date&&t.date.startsWith(ano));

    const total=txs.filter(t=>t.type==='despesa'&&t.familia===f).reduce((s,t)=>s+t.val,0);
    const receita=txs.filter(t=>t.type==='receita'&&t.familia===f).reduce((s,t)=>s+t.val,0);

  const pendRecV=pendRecL.reduce((s,f)=>s+f.val,0), pendExpV=pendExpL.reduce((s,f)=>s+f.val,0);
  const saldoAtual=contaFiltrada?bal(contaFiltrada):_allAccounts().reduce((s,a)=>s+bal(a),0);

    :'';

    `Excluir ${n} lançamento${n!==1?'s':''}?`,

      A.bulkMode=false;
      toast(msg,'#888780');
      render();
    }
  );
}

/* ─── SORT HELPERS (global — used by rFixas and rLanc) ─── */
function txSortFn(col,dir){
  const d=dir==='asc'?1:-1;
  return(a,b)=>{
    if(col==='desc')return d*(a.desc||'').localeCompare(b.desc||'');
    if(col==='acc'){const an=accBy(a.accId)?.name||'';const bn=accBy(b.accId)?.name||'';return d*an.localeCompare(bn);}
    if(col==='cat'){const an=catBy(a.catId)?.name||'';const bn=catBy(b.catId)?.name||'';return d*an.localeCompare(bn);}
    if(col==='val')return d*(a.val-b.val);
    if(col==='date')return d*(a.date||'').localeCompare(b.date||'');
    return 0;
  };
}
function fixaSortFn(col,dir){
  const d=dir==='asc'?1:-1;
  return(a,b)=>{
    if(col==='desc')return d*(a.desc||'').localeCompare(b.desc||'');
    if(col==='acc'){const an=accBy(a.accId)?.name||'';const bn=accBy(b.accId)?.name||'';return d*an.localeCompare(bn);}
    if(col==='cat'){const an=catBy(a.catId)?.name||'';const bn=catBy(b.catId)?.name||'';return d*an.localeCompare(bn);}
    if(col==='val')return d*(a.val-b.val);
    if(col==='date')return d*(a.diaVenc-b.diaVenc);
    return 0;
  };
}
function makeSortHeaderFixa(col,label,group){
  if(!A.fixaSort)A.fixaSort={};
  const s=A.fixaSort[group]||{col:'date',dir:'asc'};
  const isActive=s.col===col;
  const arrow=isActive?(s.dir==='asc'?'▲':'▼'):'⇅';
  const colCls=col==='desc'?'tx-ch-main':col==='acc'?'tx-ch-acc':col==='cat'?'tx-ch-cat':col==='val'?'tx-ch-val':col==='date'?'tx-ch-date':'';
  const cls=['tx-ch',colCls,'sortable',isActive?'sort-active':''].filter(Boolean).join(' ');
  return`<div class="${cls}" onclick="if(!A.fixaSort)A.fixaSort={};const _s=A.fixaSort['${group}']||{col:'date',dir:'asc'};A.fixaSort['${group}']={col:'${col}',dir:_s.col==='${col}'?(_s.dir==='asc'?'desc':'asc'):'asc'};render()">${label}<span class="sort-arrow">${arrow}</span></div>`;
}
function makeTxSortHeader(col,label,extraClass){
  const isActive=A.txSort===col;
  const dir=A.txSortDir||'desc';
  const arrow=isActive?(dir==='asc'?'▲':'▼'):'⇅';

}

function marcarPago(id,mes){
  const f=A.fixas.find(x=>x.id===id);if(!f)return;
  if(!f.pagamentos)f.pagamentos={};
  const[y,mo]=mes.split('-');const d=String(f.diaVenc).padStart(2,'0');
  const txId=A.nid++;
  A.txs.push({id:txId,type:f.type,desc:f.desc+fixaTxDescSuffix(f,mes),val:f.val,date:`${y}-${mo}-${d}`,catId:f.catId,accId:f.accId,accDest:null,recur:f.recur,obs:f.obs,planned:false,done:true});
  f.pagamentos[mes]=txId;
  toast(f.type==='receita'?'Recebido! Lançamento criado.':'Lançamento criado.','var(--income)');render();
}
function desmarcarPago(id,mes){
  const f=A.fixas.find(x=>x.id===id);if(!f||!f.pagamentos)return;
  const txId=f.pagamentos[mes];
  if(typeof txId==='number')A.txs=A.txs.filter(t=>t.id!==txId);
  delete f.pagamentos[mes];
  toast('Desmarcado e lançamento removido.','#888780');render();
}
function toggleAtiva(id){const f=A.fixas.find(x=>x.id===id);if(!f)return;f.ativa=!f.ativa;toast(f.ativa?'Ativada!':'Pausada.','#888780');render();}
function openFixaForm(){A.feId=null;A.delFixa=null;A.ctpExp={};A.ff={type:'despesa',desc:'',val:'',diaVenc:5,catId:null,accId:_allAccounts()[0]?.id||1,recur:'mensal',ativa:true,icon:'💧',obs:'',inicioEm:A.fixaMes,parcelas:null,open:true};render();}
function editFixa(id){const f=A.fixas.find(x=>x.id===id);if(!f)return;A.feId=id;A.delFixa=null;A.ctpExp={};A.ff={...f,parcelas:f.parcelas||null,open:true};render();}
function closeFixaForm(){A.feId=null;A.ff={...A.ff,open:false};render();}
function saveFixa(){const f=A.ff;if(!f.desc.trim()||!f.val||parseFloat(f.val)<=0){toast('Preencha descrição e valor.','var(--expense)');return;}const parc=f.parcelas?parseInt(f.parcelas)||null:null;const obj={...f,val:parseFloat(f.val),diaVenc:parseInt(f.diaVenc)||5,inicioEm:f.inicioEm||A.fixaMes,parcelas:parc&&parc>1?parc:null};delete obj.open;if(A.feId!==null){const i=A.fixas.findIndex(x=>x.id===A.feId);if(i!==-1)A.fixas[i]={...A.fixas[i],...obj};toast('Atualizada!');}else{A.fixas.push({id:A.nid++,...obj,pagamentos:{}});toast(parc&&parc>1?`Criada! Parcelamento em ${parc}x.`:'Criada!');}closeFixaForm();}
// Sufixo de descrição do lançamento gerado por uma fixa, incluindo parcela atual se houver
function fixaTxDescSuffix(f,mes){

function askDelFixa(id){
