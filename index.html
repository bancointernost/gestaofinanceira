/* ─── LANÇAMENTOS ─── */
// ── Máscara de moeda R$ ──
// Os dígitos entram da direita para a esquerda (como em app de banco):
// digitar 1 2 5 0 mostra 12,50. Colar "1.234,56", "1234.56" ou "12,5" também funciona.
// O estado guarda o número como texto com ponto ("12.50"), compatível com parseFloat.
function _fmtMoney(n){return Number(n).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});}
function _moneyDisplay(v){
  if(v===''||v==null||isNaN(parseFloat(v))) return '';
  const n=parseFloat(v); return (n<0?'-':'')+_fmtMoney(Math.abs(n));
}
function _parseMoneyText(txt){
  // interpreta texto colado: último separador com 1–2 dígitos depois é o decimal
  let t=String(txt).replace(/[^\d,.-]/g,'');
  const neg=t.includes('-'); t=t.replace(/-/g,'');
  const m=t.match(/^(.*?)[.,](\d{1,2})$/);
  const n=m?parseFloat((m[1].replace(/[.,]/g,'')||'0')+'.'+m[2]):parseFloat(t.replace(/[.,]/g,'')||'0');
  return (neg?-1:1)*n;
}
function _moneyMask(el,ev,allowNeg){
  const raw=el.value;
  let n;
  if(ev&&ev.inputType==='insertFromPaste'){
    n=_parseMoneyText(raw);
  } else {
    const digits=raw.replace(/\D/g,'').slice(0,13);
    n=parseInt(digits||'0',10)/100;
    if(raw.includes('-')) n=-n;
  }
  if(!allowNeg) n=Math.abs(n);
  el.value=n===0?'':(n<0?'-':'')+_fmtMoney(Math.abs(n));
  try{ el.setSelectionRange(el.value.length,el.value.length); }catch(e){}
  return n===0?'':n.toFixed(2);
}
// Inverte o sinal (para saldo inicial negativo, ex.: cheque especial)
function _moneyToggleSign(id,setter){
  const el=document.getElementById(id); if(!el) return;
  const n=_parseMoneyText(el.value||'0'); if(!n) return;
  el.value=(n>0?'-':'')+_fmtMoney(Math.abs(n)); setter((-n).toFixed(2)); el.focus();
}
function moneyInput(id,val,setterJs,opts){
  opts=opts||{};
  return `<div class="money-field"><span class="money-prefix" aria-hidden="true">R$</span><input id="${id}" type="text" inputmode="numeric" autocomplete="off" value="${_moneyDisplay(val)}" placeholder="0,00" aria-label="${opts.label||'Valor em reais'}"
    oninput="${setterJs.replace(/\$v/g,`_moneyMask(this,event,${opts.neg?'true':'false'})`)}${opts.after?';'+opts.after:''}"/>${opts.neg?`<button type="button" class="money-sign" title="Inverter sinal (valor negativo)" aria-label="Inverter sinal" onclick="_moneyToggleSign('${id}',v=>{${setterJs.replace(/\$v/g,'v')}})">±</button>`:''}</div>`;
}

// Normaliza texto para busca: minúsculas e sem acentos
function _normTxt(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');}
let _lancBuscaTimer=null;
function setLancBusca(v){A.lancBusca=v;clearTimeout(_lancBuscaTimer);_lancBuscaTimer=setTimeout(render,180);}
function limparFiltrosLanc(){A.lancBusca='';A.lancCatFilt='all';A.lancFamFilt='all';render();}
function _lancCatOptions(){
  const sel=String(A.lancCatFilt);
  const opt=(v,l)=>`<option value="${v}" ${sel===String(v)?'selected':''}>${l}</option>`;
  const unicas=[];const vistos=new Set();A.cats.forEach(c=>{if(!vistos.has(String(c.id))){vistos.add(String(c.id));unicas.push(c);}});
  const grupo=(tipo,label)=>{
    const lista=_catArvoreLista(tipo,true).filter(({c})=>unicas.includes(c));
    if(!lista.length) return '';
    return `<optgroup label="${label}">${lista.map(({c,n})=>opt(c.id,(n?'&nbsp;&nbsp;'.repeat(n)+'↳ ':'')+H(c.name))).join('')}</optgroup>`;
  };
  return opt('all','Todas as categorias')+grupo('despesa','Despesas')+grupo('receita','Receitas')+opt('transf','Transferências');
}
function lancFiltTxs(){
  let txs=filt();
  const ano=String(A.anoFilt);
  // filtro período
  if(A.lancPeriod==='mes'){
    // filtra pelo mês dentro do ano selecionado
    const mesComAno=ano+'-'+A.lancMes.slice(5,7);
    txs=txs.filter(t=>t.date&&t.date.startsWith(mesComAno));
  } else if(A.lancPeriod==='all'){
    // ano todo
    txs=txs.filter(t=>t.date&&t.date.startsWith(ano));
  } else if(A.lancPeriod==='custom'){
    // só filtra quando AMBAS as datas estiverem preenchidas
    if(A.lancDtIni && A.lancDtFim){
      txs=txs.filter(t=>t.date>=A.lancDtIni && t.date<=A.lancDtFim);
    } else {
      txs=[];
    }
  }
  // filtro família
  if(A.lancFamFilt!=='all') txs=txs.filter(t=>t.familia===A.lancFamFilt);
  // filtro categoria (categoria-mãe inclui as subcategorias)
  if(A.lancCatFilt==='transf'){
    txs=txs.filter(t=>t.type==='transferencia');
  } else if(A.lancCatFilt!=='all'){
    const ids=new Set([String(A.lancCatFilt),...[..._catDescIds(A.lancCatFilt)].map(String)]);
    txs=txs.filter(t=>t.type!=='transferencia'&&ids.has(String(t.catId)));
  }
  // busca por texto: descrição, observação, categoria, conta, família e valor
  const q=_normTxt(A.lancBusca||'').trim();
  if(q){
    const termos=q.split(/\s+/);
    txs=txs.filter(t=>{
      const cat=catBy(t.catId);
      const alvo=_normTxt([t.desc,t.obs,cat.name,cat.displayName,accBy(t.accId).name,t.accDest?accBy(t.accDest).name:'',t.familia,
        R(t.val),String(t.val).replace('.',',')].join(' '));
      return termos.every(w=>alvo.includes(w));
    });
  }
  return [...txs].sort((a,b)=>b.date.localeCompare(a.date));
}
function rLanc(m){
  const txs=lancFiltTxs();
  const tR=sumT(txs,'receita'),tE=sumT(txs,'despesa');
  const ano=A.anoFilt;
  const prevMes=addMonths(A.lancMes,-1),nextMes=addMonths(A.lancMes,1);
  const prevOk=parseInt(prevMes.slice(0,4))===ano;
  const nextOk=parseInt(nextMes.slice(0,4))===ano;
  const[ly,lm]=A.lancMes.split('-');



  const grpBar=`<div class="grp-bar">
    <span class="grp-bar-label">Agrupar por:</span>
    <button class="grp-btn ${A.lancGrp==='todos'?'on':''}" onclick="A.lancGrp='todos';render()">Todos</button>
    <button class="grp-btn ${A.lancGrp==='tipo'?'on':''}" onclick="A.lancGrp='tipo';render()"><svg class="ic sm" aria-hidden="true"><use href="#i-arrow-up-down"/></svg> Tipo</button>
    <button class="grp-btn ${A.lancGrp==='categoria'?'on':''}" onclick="A.lancGrp='categoria';render()"><svg class="ic sm" aria-hidden="true"><use href="#i-tags"/></svg> Categoria</button>
    <button class="grp-btn ${A.lancGrp==='conta'?'on':''}" onclick="A.lancGrp='conta';render()"><svg class="ic sm" aria-hidden="true"><use href="#i-landmark"/></svg> Conta</button>
    <button class="grp-btn ${A.lancGrp==='familia'?'on':''}" onclick="A.lancGrp='familia';render()"><svg class="ic sm" aria-hidden="true"><use href="#i-users"/></svg> Família</button>
  </div>`;

  // ─── VIEW: TABELA AGRUPADA ───
  function grpTableView(){
    if(txs.length===0) return vazioHtml;

    const grp=A.lancGrp;
    // no celular a coluna Qtd sai (não cabe); os colspans acompanham
    const semQtd=window.matchMedia('(max-width:600px)').matches;
    const QTD=(html)=>semQtd?'':html;

    // Agrupa por tipo como linha mãe, dentro por chave secundária
    const TIPOS=[
      {key:'receita',   label:'Receita',       cls:'receita'},
      {key:'despesa',   label:'Despesas',       cls:'despesa'},
      {key:'transferencia',label:'Transferência',cls:'transferencia'},
    ];

    function keyOf(t){
      if(grp==='tipo') return t.type==='transferencia'?'Transferência':t.type==='receita'?'Receita':'Despesa';
      if(grp==='conta') return t.type==='transferencia'?`${accBy(t.accId).name} → ${accBy(t.accDest).name}`:accBy(t.accId).name;
      if(grp==='familia') return t.familia||'—';
      // data: agrupar por dia
      const dt=new Date(t.date+'T12:00:00');
      return t.date+'|'+['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'][dt.getDay()]+', '+String(dt.getDate()).padStart(2,'0')+'/'+String(dt.getMonth()+1).padStart(2,'0');
    }
    function keyLabel(k){
      if(grp==='data') return k.split('|')[1]||k;
      return k;
    }
    function keyColor(k,tipo){
      return tipo==='receita'?'var(--income)':tipo==='despesa'?'var(--expense)':'var(--transfer)';
    }

    // ─── HELPER: renderiza linhas de lançamentos individuais ───
    function txDetailRows(stxs, expKey){
      const expanded=A.lancGrpExp&&A.lancGrpExp[expKey];
      if(!expanded) return '';
      return stxs.sort((a,b)=>b.date.localeCompare(a.date)).map(t=>{
        const dt=new Date(t.date+'T12:00:00');
        const dStr=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'][dt.getDay()]+', '+String(dt.getDate()).padStart(2,'0')+'/'+String(dt.getMonth()+1).padStart(2,'0');
        const extra=grp==='categoria'?(t.type==='transferencia'?accBy(t.accId).name+' → '+accBy(t.accDest).name:accBy(t.accId).name):(t.type==='transferencia'?'Transferência':catBy(t.catId).name);
        const rotulo=H(t.desc||'lançamento');
        return`<tr class="grp-tx-row" onclick="editTx(${t.id})" title="Clique para editar">
          <td colspan="${semQtd?1:2}"><span class="grp-tx-data">${dStr}</span> — <span class="grp-tx-desc">${H(t.desc)}</span><span class="grp-tx-extra">${H(extra||'')}</span>${_ctlBadgeHtml(t)}</td>
          <td class="grp-tx-acoes"><span class="row-actions">
            <button class="icon-btn copy" onclick="copyTx(${t.id},event)" title="Duplicar" aria-label="Duplicar ${rotulo}"><svg class="ic" aria-hidden="true"><use href="#i-copy"/></svg></button>
            <button class="icon-btn edit" onclick="event.stopPropagation();editTx(${t.id})" title="Editar" aria-label="Editar ${rotulo}"><svg class="ic" aria-hidden="true"><use href="#i-pencil"/></svg></button>
            <button class="icon-btn del" onclick="event.stopPropagation();askDel(${t.id})" title="Excluir" aria-label="Excluir ${rotulo}"><svg class="ic" aria-hidden="true"><use href="#i-trash-2"/></svg></button>
          </span></td>
          <td class="grp-soma">${R(t.val)}</td>
        </tr>`;
      }).join('');
    }

    let totalGeral=0;
    const rows=TIPOS.map(({key,label,cls})=>{
      const tipoTxs=txs.filter(t=>t.type===key);
      if(!tipoTxs.length) return'';
      const tipoTotal=tipoTxs.reduce((s,t)=>s+t.val,0);
      totalGeral+=(key==='despesa'?-1:1)*tipoTotal;

      let subRows='';

      if(grp==='categoria'){
        // ── Agrupamento em árvore por categoria ──
        // Para cada tx, encontra a raiz da categoria
        function getRootCat(catId){
          return _catRaizDe(catId)||{id:'sem',name:'Sem categoria',color:'#888780'};
        }
        // 2º nível da tabela = filha direta da raiz que contém a categoria (netas somam nela)
        function getLeafCat(catId){
          const cam=_catCaminho(catId);
          return cam[1]||cam[0]||{id:'sem',name:'Sem categoria',color:'#888780'};
        }

        // Agrupa por categoria raiz
        const rootMap={};
        tipoTxs.forEach(t=>{
          const root=getRootCat(t.catId);
          const rid=root.id;
          if(!rootMap[rid]) rootMap[rid]={root,txs:[],subMap:{}};
          rootMap[rid].txs.push(t);
          // Sub-agrupa por categoria folha dentro da raiz
          const leaf=getLeafCat(t.catId);
          const lid=leaf.id;
          if(!rootMap[rid].subMap[lid]) rootMap[rid].subMap[lid]={leaf,txs:[]};
          rootMap[rid].subMap[lid].txs.push(t);
        });

        // Ordena raízes por soma desc
        const rootIds=Object.keys(rootMap).sort((a,b)=>{
          const sa=rootMap[a].txs.reduce((s,t)=>s+t.val,0);
          const sb=rootMap[b].txs.reduce((s,t)=>s+t.val,0);
          return sb-sa;
        });

        subRows=rootIds.map(rid=>{
          const {root,txs:rtxs,subMap}=rootMap[rid];
          const rootSoma=rtxs.reduce((s,t)=>s+t.val,0);
          const rootPct=tipoTotal>0?Math.round(rootSoma/tipoTotal*100):0;
          const rootExpKey=cls+'|root|'+rid;
          const rootExpanded=A.lancGrpExp&&A.lancGrpExp[rootExpKey];

          // Verifica se há subcategorias reais (folhas diferentes da raiz)
          const leafIds=Object.keys(subMap);
          const hasRealSubs=leafIds.some(lid=>parseInt(lid)!==root.id);

          // Sub-linhas: subcategorias ou lançamentos diretos
          let innerRows='';
          if(rootExpanded){
            if(hasRealSubs){
              // Ordena subs por soma desc
              const sortedLeafs=leafIds.sort((a,b)=>{
                const sa=subMap[a].txs.reduce((s,t)=>s+t.val,0);
                const sb=subMap[b].txs.reduce((s,t)=>s+t.val,0);
                return sb-sa;
              });
              innerRows=sortedLeafs.map(lid=>{
                const {leaf,txs:ltxs}=subMap[lid];
                const leafSoma=ltxs.reduce((s,t)=>s+t.val,0);
                const leafPct=rootSoma>0?Math.round(leafSoma/rootSoma*100):0;
                const leafExpKey=cls+'|leaf|'+lid;
                const leafExpanded=A.lancGrpExp&&A.lancGrpExp[leafExpKey];
                const isDirectRoot=(leaf.id===root.id);
                const leafLabel=isDirectRoot?'(direto)':leaf.name;
                const txRows=txDetailRows(ltxs,leafExpKey);
                return`<tr class="grp-cat-row grp-sub-row" onclick="if(!A.lancGrpExp)A.lancGrpExp={};A.lancGrpExp['${HJ(leafExpKey)}']=!A.lancGrpExp['${HJ(leafExpKey)}'];render()">
                  <td style="padding-left:32px"><span class="grp-toggle">${leafExpanded?'▼':'▶'}</span><span class="grp-dot" style="background:${root.color};opacity:.7"></span>${H(leafLabel)}</td>
                  ${QTD(`<td class="grp-qtd">${ltxs.length} lançamento${ltxs.length!==1?'s':''}</td>`)}
                  <td class="grp-pct">${leafPct}%</td>
                  <td class="grp-soma">${R(leafSoma)}</td>
                </tr>${txRows}`;
              }).join('');
            } else {
              // Categoria sem filhos: mostra lançamentos diretamente com a mesma chave da raiz
              innerRows=txDetailRows(rtxs,rootExpKey);
            }
          }

          return`<tr class="grp-cat-row" onclick="if(!A.lancGrpExp)A.lancGrpExp={};A.lancGrpExp['${HJ(rootExpKey)}']=!A.lancGrpExp['${HJ(rootExpKey)}'];render()">
            <td><span class="grp-toggle">${rootExpanded?'▼':'▶'}</span><span class="grp-dot" style="background:${root.color}"></span>${H(root.name)}</td>
            ${QTD(`<td class="grp-qtd">${rtxs.length} lançamento${rtxs.length!==1?'s':''}</td>`)}
            <td class="grp-pct">${rootPct}%</td>
            <td class="grp-soma">${R(rootSoma)}</td>
          </tr>${innerRows}`;
        }).join('');

      } else {
        // ── Agrupamento padrão (não categoria) ──
        const subMap={};
        tipoTxs.forEach(t=>{const k=keyOf(t);if(!subMap[k])subMap[k]=[];subMap[k].push(t);});
        const subKeys=Object.keys(subMap).sort((a,b)=>subMap[b].reduce((s,t)=>s+t.val,0)-subMap[a].reduce((s,t)=>s+t.val,0));

        subRows=subKeys.map(k=>{
          const stxs=subMap[k];
          const soma=stxs.reduce((s,t)=>s+t.val,0);
          const pct=tipoTotal>0?Math.round(soma/tipoTotal*100):0;
          const col=keyColor(k,key);
          const expKey=cls+'|'+k;
          const expanded=A.lancGrpExp&&A.lancGrpExp[expKey];
          const txSubRows=txDetailRows(stxs,expKey);
          return`<tr class="grp-cat-row" onclick="if(!A.lancGrpExp)A.lancGrpExp={};A.lancGrpExp['${HJ(expKey)}']=!A.lancGrpExp['${HJ(expKey)}'];render()">
            <td><span class="grp-toggle">${expanded?'▼':'▶'}</span><span class="grp-dot" style="background:${col}"></span>${H(keyLabel(k))}</td>
            ${QTD(`<td class="grp-qtd">${stxs.length} lançamento${stxs.length!==1?'s':''}</td>`)}
            <td class="grp-pct">${pct}%</td>
            <td class="grp-soma">${R(soma)}</td>
          </tr>${txSubRows}`;
        }).join('');
      }

      return`<tr class="grp-type-row ${cls}">
          <td colspan="${semQtd?2:3}">${label}</td>
          <td class="grp-type-total">${R(tipoTotal)}</td>
        </tr>
        ${subRows}`;
    }).join('');

    const totalColor=totalGeral>=0?'var(--income)':'var(--expense)';
    const totalSign=totalGeral>=0?'+':'';

    return`<table class="grp-table">
      <thead><tr>
        <th>Descrição</th>${QTD('<th class="grp-qtd">Qtd</th>')}<th>%</th><th>Soma</th>
      </tr></thead>
      <tbody>
        ${rows}
        <tr class="grp-total-row">
          <td colspan="${semQtd?2:3}"><strong>Total do período</strong></td>
          <td class="grp-soma" style="color:${totalColor}">${totalSign}${R(Math.abs(totalGeral))}</td>
        </tr>
      </tbody>
    </table>`;
  }

  // ─── VIEW: POR DATA (padrão) ───
  function dateView(){
    // Build sortable column header for lancamentos
    const _tsc=A.txSort||'date';const _tsd=A.txSortDir||'desc';
    const colHeader=`<div class="tx-col-header"><div class="tx-ch tx-ch-icon"></div>${makeTxSortHeader('desc','Descrição','tx-ch-main')}${makeTxSortHeader('acc','Conta','tx-ch-acc')}${makeTxSortHeader('cat','Categoria','tx-ch-cat')}${makeTxSortHeader('val','Valor','tx-ch-val')}${makeTxSortHeader('date','Data','tx-ch-date')}<div class="tx-ch tx-ch-actions act3"></div></div>`;

    if(_tsc!=='date'){

      return`<div class="tx-day-block"><div class="tx-list" style="width:100%">${colHeader}${sorted.map((t,i)=>iRow(t,true,i)).join('')}</div></div>`;
    }
    // Default: group by month then day (sort by date)
    const groups={};txs.forEach(t=>{const k=t.date.slice(0,7);if(!groups[k])groups[k]=[];groups[k].push(t);});
    if(Object.keys(groups).length===0) return vazioHtml;

    const dayOrder=(a,b)=>_tsd==='asc'?a.localeCompare(b):b.localeCompare(a);
    let rowCounter=0;
    return Object.keys(groups).sort(monthOrder).map((k,ki)=>{
      const[y,mo]=k.split('-');
      const mR=sumT(groups[k],'receita'),mE=sumT(groups[k],'despesa');
      const byDay={};groups[k].forEach(t=>{const d=t.date;if(!byDay[d])byDay[d]=[];byDay[d].push(t);});
      const isFirst=ki===0;
      const dayRows=Object.keys(byDay).sort(dayOrder).map((d,di)=>{
        return`<div class="tx-day-block">
          <div class="tx-list" style="width:100%">${di===0&&isFirst?colHeader:''}${byDay[d].map(t=>iRow(t,true,rowCounter++)).join('')}</div>
        </div>`;

      return`<div class="tx-group">${dayRows}</div>`;

    :emptyState('list','Nenhum lançamento '+_quando,'Registre o que entrou e saiu, ou traga tudo de uma vez pelo extrato do banco.',
      `<button class="btn-r" onclick="openForm('lanc')"><svg class="ic" aria-hidden="true"><use href="#i-plus"/></svg> Lançar o primeiro</button><button class="btn-g" onclick="openCsvImport()"><svg class="ic" aria-hidden="true"><use href="#i-file-input"/></svg> Importar extrato</button>`);
  const bodyContent = (A.lancGrp==='data'||A.lancGrp==='todos') ? dateView() : grpTableView();

  A.lastTransTab='lanc';
  m.innerHTML=`
  <div class="row3">
    <div class="stat"><div class="lbl">Receitas</div><div class="val" style="color:var(--income)">${R(tR)}</div></div>
    <div class="stat"><div class="lbl">Despesas</div><div class="val" style="color:var(--expense)">${R(tE)}</div></div>

  </div>

  <div class="card">
    <div class="ph">
      <h3><svg class="ic lg" aria-hidden="true"><use href="#i-list"/></svg> Extrato ${A.lancPeriod==='mes'?`<span style="font-size:12px;color:var(--gray-400);font-weight:700;margin-left:6px">· ${MNLONG[lm]} ${ano}</span>`:''}</h3>
      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
        ${A.bulkMode
          ? `<button onclick="bulkSelectAll()" class="btn-g">☑ Todos</button>
             <button onclick="bulkSelectNone()" class="btn-g">☐ Nenhum</button>
             <button onclick="bulkExit()" class="btn-g">✕ Cancelar</button>`
          : `<button onclick="A.bulkMode=true;A.bulkSel=new Set();render()" class="btn-g" title="Selecionar para excluir em grupo"><svg class="ic" aria-hidden="true"><use href="#i-square-check-big"/></svg> Selecionar</button>${(()=>{const n=_recatCandidatos().length;const nsc=_txsSemConta().length;return (nsc?`<button onclick="corrigirContas()" class="btn-g tx-semconta-btn" title="Lançamentos com conta inexistente (aparecem com ⚠ no Extrato)">⚠ ${nsc} sem conta</button>`:'')+(n?`<button onclick="openRecategorizar()" class="btn-g" title="Sugere categoria para os lançamentos em “Outros” (regras › IA › histórico › palavra-chave). Você revisa antes."><svg class="ic" aria-hidden="true"><use href="#i-sparkles"/></svg> Recategorizar “Outros” <span class="recat-n">${n}</span></button>`:'');})()}`
        }
        <div style="width:1px;height:22px;background:var(--gray-200);margin:0 2px"></div>
        <button class="period-btn ${A.lancPeriod==='mes'?'on':''}" onclick="A.lancPeriod='mes';render()">Mês</button>

        <div style="flex:1"></div>
        <button class="btn-p" onclick="openForm('transferencia')" title="Nova transferência (tecla T)"><svg class="ic" aria-hidden="true"><use href="#i-arrow-left-right"/></svg> Transferência</button>

      <input type="date" value="${A.lancDtIni}" onblur="A.lancDtIni=this.value;render()" class="painel-date-input"/>
      <span style="font-size:13px;color:var(--color-text-tertiary)">até</span>
      <input type="date" value="${A.lancDtFim}" onblur="A.lancDtFim=this.value;render()" class="painel-date-input"/>
      ${(!A.lancDtIni||!A.lancDtFim)?`<span style="font-size:12px;color:var(--gray-400)">Selecione as duas datas para filtrar</span>`:''}

    </div>
    ${(A.lancBusca||A.lancCatFilt!=='all'||A.lancFamFilt!=='all')?`<div class="lanc-filter-info"><strong>${txs.length}</strong> lançamento${txs.length!==1?'s':''} encontrado${txs.length!==1?'s':''} · totais acima consideram os filtros <button class="link-btn" onclick="limparFiltrosLanc()">Limpar filtros</button></div>`:''}

    ${A.bulkMode&&A.bulkSel&&A.bulkSel.size>0?`
    <div style="position:sticky;bottom:16px;left:0;right:0;display:flex;align-items:center;justify-content:space-between;gap:12px;background:#1E293B;border-radius:14px;padding:14px 20px;box-shadow:0 8px 32px rgba(0,0,0,.3);margin-top:12px;animation:slideUp .2s ease">

        <span style="color:#CBD5E1;font-size:14px;font-weight:500">lançamento${A.bulkSel.size!==1?'s':''} selecionado${A.bulkSel.size!==1?'s':''}</span>

function askDelFamItem(id){
  if(!id)return;
  const item=famById(id);if(!item)return;
  if(_bloquearExclusao(item.parentId?'o membro':'o grupo',item.name,_vinculosFamilia(id),'Troque o membro da família nesses lançamentos e remova antes os membros do grupo.')) return;
  const children=famChildren(id);
  const nTx=A.txs.filter(t=>t.familia===item.name).length;
  const nChildTx=children.reduce((s,c)=>s+A.txs.filter(t=>t.familia===c.name).length,0);
  const total=nTx+nChildTx;
  const childWarn=children.length>0?`<br><span style="color:var(--amber)">⚠ ${children.length} membro(s) também serão removidos.</span>`:'';
  const txWarn=total>0?`<br><span style="color:var(--amber)">⚠ ${total} lançamento(s) ficarão sem vínculo.</span>`:'';
  _showConfirm('Remover?',`"<strong>${H(item.name)}</strong>" será removido.${childWarn}${txWarn}`,
    ()=>{
      const ids=new Set([id,...children.map(c=>c.id)]);
      A.familia=A.familia.filter(f=>!ids.has(f.id));
      A.famSelId=null;
      toast('Removido.','#888780');render();
    });
}

let _qam = null; // { type: 'cat'|'acc'|'fam', stateObj, stateKey, tipo, editId, form: {} }

// ── Categoria ──
function qamCat(stateObj, stateKey, tipo){

  _qamRender();
}
function _qamEditCat(id){
  const c=A.cats.find(x=>x.id===id); if(!c)return;
  _qam.editId=id;
  _qam.form={ name:c.name, color:c.color, tipo:c.tipo, parentId:c.parentId||null };
  _qamRender();
}
function _qamSaveCat(){
  const n=(_qam.form.name||'').trim();
  if(!n){toast('Informe o nome.','var(--expense)');return;}
  let selId;
  if(_qam.editId!==null){
    const c=A.cats.find(x=>x.id===_qam.editId);
    if(c){c.name=n;c.color=_qam.form.color;}
    selId=_qam.editId;
    toast('Categoria atualizada!');
  } else {
    const nc={id:A.nid++,name:n,color:_qam.form.color,tipo:_qam.form.tipo,parentId:_qam.form.parentId||null};
    A.cats.push(nc);
    selId=nc.id;
    toast('Categoria criada!','var(--income)');
  }
  // Aplica seleção no campo de origem
  if((_qam.stateObj==='A.tf'||_qam.stateObj==='tf')){ A.tf[_qam.stateKey]=selId; A.tf._catManual=true; }
  else if((_qam.stateObj==='A.ff'||_qam.stateObj==='ff')) A.ff[_qam.stateKey]=selId;
  _qamClose(); render();
}

// ── Família ──
function qamFam(stateObj, stateKey, mode){
  const curName = stateObj==='csv' ? ((_csvState&&_csvState.rows&&_csvState.rows[stateKey])||{}).fam||''
    : stateObj==='rg' ? (_rgForm().familia||'')
    : ((stateObj==='A.tf'||stateObj==='tf'?A.tf:A.ff)||{})[stateKey]||'';
  const curItem = A.familia.find(f=>f.name===curName)||null;
  _qam = { type:'fam', stateObj, stateKey, mode,
    editId: mode==='edit'&&curItem ? curItem.id : null,
    form:{ name: mode==='edit'&&curItem ? curItem.name : '', parentId: mode==='edit'&&curItem ? curItem.parentId||null : null }
  };
  _qamRender();
}
function _qamSaveFam(){
  const n=(_qam.form.name||'').trim();
  if(!n){toast('Informe o nome.','var(--expense)');return;}
  let selName;
  if(_qam.editId!==null){
    const item=famById(_qam.editId);
    if(item){
      const old=item.name; item.name=n;
      _famRenomear(old,n);
    }
    selName=n;
    toast('Membro atualizado!');
  } else {
    A.familia.push({id:A.nid++,name:n,parentId:_qam.form.parentId||null});
    selName=n;
    toast('Membro adicionado!','var(--income)');
  }
  if(_qam.stateObj==='csv'){
    const k=_qam.stateKey; _qamClose();
    if(k==='todos') _csvFamTodos(selName); else if(_csvState&&_csvState.rows&&_csvState.rows[k]){ _csvSetFam(k,selName); }
    _renderCsvModal(); scheduleSave(); return;
  }
  if(_qam.stateObj==='rg'){ _rgForm().familia=selName; _qamClose(); render(); return; }
  if((_qam.stateObj==='A.tf'||_qam.stateObj==='tf')) A.tf[_qam.stateKey]=selName;
  else if((_qam.stateObj==='A.ff'||_qam.stateObj==='ff')) A.ff[_qam.stateKey]=selName;
  _qamClose(); render();
}
// Renomear membro: atualiza lançamentos e regras
function _famRenomear(old,n){
  if(!old||old===n) return;
  (A.txs||[]).forEach(t=>{if(t.familia===old)t.familia=n;});
  (A.catRegras||[]).forEach(r=>{if(r.familia===old)r.familia=n;});
  if(typeof _compartOn==='function'&&_compartOn('familia')) _outrosControles().forEach(d=>{
    (d.txs||[]).forEach(t=>{if(t.familia===old)t.familia=n;});
    (d.catRegras||[]).forEach(r=>{if(r.familia===old)r.familia=n;});
  });
}

function _lastTxKey(){const s=window._appSession;return 'pfp_last_tx_'+(s?s.id:'livre')+'_'+(A.controleAtivo!=null?A.controleAtivo:'');}
function _getLastTx(){try{return JSON.parse(localStorage.getItem(_lastTxKey())||'{}')||{};}catch(e){return {};}}
function _rememberLastTx(o){
  try{
    const cur=_getLastTx();
    if(o.type==='transferencia') cur.transf={accId:o.accId,accDest:o.accDest,catId:o.catId};
    else cur.lanc={type:o.type,accId:o.accId,catId:o.catId};
    localStorage.setItem(_lastTxKey(),JSON.stringify(cur));
  }catch(e){}
}
function _applyLastTx(isT){
  const L=_getLastTx();
  const accOk=id=>id!=null&&_allAccounts().some(a=>String(a.id)===String(id));
  const catOf=id=>A.cats.find(c=>String(c.id)===String(id));
  if(isT){
    const t=L.transf; if(!t) return;
    if(accOk(t.accId)&&accOk(t.accDest)&&String(t.accId)!==String(t.accDest)){A.tf.accId=t.accId;A.tf.accDest=t.accDest;}
    if(catOf(t.catId)) A.tf.catId=t.catId;
    return;
  }
  const l=L.lanc; if(!l) return;
  if(l.type==='receita'||l.type==='despesa') A.tf.type=l.type;
  if(accOk(l.accId)) A.tf.accId=l.accId;
  const c=catOf(l.catId); if(c&&c.tipo===A.tf.type) A.tf.catId=c.id;
}

// ── Primeiro uso: 3 passos. Um passo conta como feito quando existe um item

function _seedIds(k){return new Set(((_SEED_DATA&&_SEED_DATA[k])||[]).map(x=>x.id));}
function _onbKey(){const s=window._appSession;return 'pfp_onb_skip_'+(s?s.id:'livre')+'_'+(A.controleAtivo!=null?A.controleAtivo:'');}
function _onbSteps(){
  const sa=_seedIds('accounts'),st=_seedIds('txs'),sf=_seedIds('fixas');
  return [
    {done:(A.accounts||[]).some(a=>!sa.has(a.id)),icon:'landmark',t:'Cadastre sua primeira conta',d:'Conta corrente, carteira ou cartão: onde seu dinheiro está.',btn:'Criar conta',fn:"A.tab='contas';openAccForm()"},
    {done:(A.txs||[]).some(t=>t.type==='despesa'&&!st.has(t.id)),icon:'arrow-down',t:'Lance sua primeira despesa',d:'Use o botão + (ou a tecla N) sempre que gastar.',btn:'Lançar despesa',fn:"quickNew('lanc')"},
    {done:(A.fixas||[]).some(f=>!sf.has(f.id)),icon:'repeat',t:'Cadastre suas contas fixas',d:'Aluguel, internet, salário: o app avisa quando vencem.',btn:'Cadastrar fixa',fn:"A.tab='fixas';A.lastTransTab='fixas';openFixaForm()"},
  ];

function _temExemplos(){
  const sa=_seedIds('accounts'),st=_seedIds('txs'),sf=_seedIds('fixas');
  return (A.accounts||[]).some(a=>sa.has(a.id))||(A.txs||[]).some(t=>st.has(t.id))||(A.fixas||[]).some(f=>sf.has(f.id));

function _onbCardHtml(){
  if(typeof _multiActive==='function'&&_multiActive()) return '';
  try{ if(localStorage.getItem(_onbKey())) return ''; }catch(e){}
  const steps=_onbSteps(); const feitos=steps.filter(x=>x.done).length;

  const prox=steps.findIndex(x=>!x.done);
  return `<section class="card onb" aria-label="Primeiros passos">
    <div class="onb-head"><div><div class="onb-title">Primeiros passos</div><div class="onb-sub">${feitos} de ${steps.length} concluídos</div></div>

// Remove os dados de exemplo (só os que o usuário não alterou nem usou)

// ── Contas fixas vencidas (passaram do dia sem pagamento) ──
function _fixasVencidas(mes){
  mes=mes||thisMonth(); const hoje=thisMonth();
  if(mes>hoje) return [];
  const dia=parseInt(today().slice(8,10),10);
  return fixasParaMes(mes).filter(f=>(!f.pagamentos||!f.pagamentos[mes])&&(mes<hoje||f.diaVenc<dia)).sort((a,b)=>a.diaVenc-b.diaVenc);
}

function _catIdsCom(id){return new Set([String(id),...[..._catDescIds(id)].map(String)]);}
function _gastoCat(id,mes){const ids=_catIdsCom(id);return A.txs.filter(t=>t.done&&t.type==='despesa'&&t.date&&t.date.startsWith(mes)&&ids.has(String(t.catId))).reduce((s,t)=>s+t.val,0);}
function _orcamentos(mes){
  const vistos=new Set();
  return A.cats.filter(c=>c.tipo==='despesa'&&parseFloat(c.orcamento)>0&&!vistos.has(String(c.id))&&vistos.add(String(c.id))).map(c=>{
    const lim=parseFloat(c.orcamento), gasto=_gastoCat(c.id,mes);
    return {c,lim,gasto,pct:lim>0?gasto/lim*100:0};
  }).sort((a,b)=>b.pct-a.pct);
}
function _orcCardHtml(mes){

  if(!lst.length) return `<div class="card">${head}<div class="orc-empty">Defina um limite mensal para as categorias em que você mais gasta e acompanhe aqui quanto ainda pode usar.</div></div>`;

    <div class="orc-list">${lst.map(o=>{

        <div class="orc-bar" role="progressbar" aria-label="${H(o.c.name)}" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.min(100,Math.round(o.pct))}"><div style="width:${Math.min(100,o.pct).toFixed(1)}%"></div></div>
        <div class="orc-info">${resta>=0?`Resta ${R(resta)} · ${Math.round(o.pct)}%`:`Passou ${R(-resta)} do limite · ${Math.round(o.pct)}%`}</div>

// Aviso ao lançar uma despesa que leva a categoria a 80% ou 100% do limite
function _checkOrcamento(tx,antes){
  if(tx.type!=='despesa') return;
  const c=A.cats.find(x=>String(x.id)===String(tx.catId)); if(!c) return;
  const alvo=_catCaminho(c.id).reverse().find(x=>x&&parseFloat(x.orcamento)>0);
  if(!alvo) return;
  const mes=(tx.date||today()).slice(0,7), lim=parseFloat(alvo.orcamento);
  const depois=_gastoCat(alvo.id,mes), pa=antes/lim*100, pd=depois/lim*100;
  if(pd>100&&pa<=100) toast(`${alvo.name}: orçamento de ${MNLONG[mes.slice(5,7)].toLowerCase()} estourado (${Math.round(pd)}%)`,'var(--expense)',4500);
  else if(pd>=80&&pa<80) toast(`${alvo.name}: ${Math.round(pd)}% do orçamento do mês`,'var(--amber)',4000);
}

// ícone do sprite (atalho)
function _ic(n,c){return `<svg class="ic${c?' '+c:''}" aria-hidden="true"><use href="#i-${n}"/></svg>`;}
/* ═══════════ CARTÃO DE CRÉDITO: faturas, limite, parcelas e pagamento ═══════════
   Configuração na própria conta (tipo "Cartão de crédito"): fechamento, vencimento, limite.
   A fatura é identificada pelo mês de VENCIMENTO ("YYYY-MM").
   Compra com data >= dia de fechamento entra na fatura seguinte.
   Pagamento = transferência de uma conta para o cartão, marcada com faturaPag:"YYYY-MM". */
function _pad2b(n){return String(n).padStart(2,'0');}
function _addMes(mes,n){let [y,m]=mes.split('-').map(Number);m+=n;while(m>12){m-=12;y++;}while(m<1){m+=12;y--;}return y+'-'+_pad2b(m);}
function _diaEf(mes,dia){const [y,m]=mes.split('-').map(Number);return Math.min(dia,new Date(y,m,0).getDate());}
function _ccOk(acc){return !!(acc&&+acc.fechamento&&+acc.vencimento);}
function faturaMesDe(acc,data){
  if(!data) return '';
  if(!_ccOk(acc)) return data.slice(0,7);
  const fech=+acc.fechamento, venc=+acc.vencimento;
  const mesCompra=data.slice(0,7), dia=+data.slice(8,10);
  let mesFech=dia>=_diaEf(mesCompra,fech)?_addMes(mesCompra,1):mesCompra;
  return venc>fech?mesFech:_addMes(mesFech,1);
}
function _faturaDatas(acc,mes){
  const fech=+acc.fechamento||1, venc=+acc.vencimento||1;
  const mesFech=venc>fech?mes:_addMes(mes,-1);
  return {fechamento:mesFech+'-'+_pad2b(_diaEf(mesFech,fech)), vencimento:mes+'-'+_pad2b(_diaEf(mes,venc))};
}
function _ccTxs(acc){return (_isSharedAcc(acc.id)?_allTxsAcrossControles():A.txs).filter(t=>t.done);}
function faturaInfo(acc,mes){
  const todas=_ccTxs(acc);
  const itens=todas.filter(t=>t.type!=='transferencia'&&String(t.accId)===String(acc.id)&&faturaMesDe(acc,t.date)===mes).sort((a,b)=>a.date.localeCompare(b.date));
  const total=itens.reduce((s,t)=>s+(t.type==='despesa'?t.val:-t.val),0);
  const pags=todas.filter(t=>t.type==='transferencia'&&String(t.accDest)===String(acc.id)&&t.faturaPag===mes);
  const pago=pags.reduce((s,t)=>s+t.val,0);
  const d=_faturaDatas(acc,mes), hoje=today();
  const restante=Math.max(0,+(total-pago).toFixed(2));
  let status;
  if(total<=0.004&&!itens.length) status='vazia';
  else if(restante<=0.004) status='paga';
  else if(mes>faturaMesDe(acc,hoje)) status='futura';
  else if(hoje<d.fechamento) status='aberta';
  else if(hoje<=d.vencimento) status=pago>0?'parcial':'fechada';
  else status='vencida';
  return {mes,itens,total:+total.toFixed(2),pago:+pago.toFixed(2),restante,status,pags,...d};
}
const FAT_STATUS={futura:['Próxima','gray'],aberta:['Aberta','blue'],fechada:['Fechada · a pagar','amber'],parcial:['Paga em parte','amber'],vencida:['Vencida','red'],paga:['Paga','green'],vazia:['Sem compras','gray']};
// Limite usado = tudo que ainda deve no cartão (inclui parcelas futuras)
function ccUsado(acc){return Math.max(0,-bal(acc));}
// Fatura "da vez": a mais antiga fechada e não paga; senão a aberta
function faturaDaVez(acc){
  const aberta=faturaMesDe(acc,today());
  for(let i=6;i>=1;i--){const f=faturaInfo(acc,_addMes(aberta,-i));if(['fechada','parcial','vencida'].includes(f.status))return f.mes;}
  return aberta;
}
function _cartoes(){return _allAccounts().filter(a=>isCC(a));}

// ── Parcelamento ──
function _parcInfoTxt(){
  const f=A.tf, n=parseInt(f.parcelas)||1, v=parseFloat(f.val)||0, acc=accBy(f.accId);
  if(!isCC(acc)) return '';
  const fat=faturaMesDe(acc,f.date||today());
  const nomeFat=fat?MNLONG[fat.slice(5,7)].toLowerCase()+'/'+fat.slice(0,4):'';
  if(n<=1) return _ccOk(acc)?`Entra na fatura de ${nomeFat}`:'';
  return `${n}x de ${R(v/n)} · 1ª parcela na fatura de ${nomeFat}`;
}
function _updParcInfo(){const el=document.getElementById('tx-parc-info');if(el)el.textContent=_parcInfoTxt();}
function _lancarParcelado(obj,n){
  const total=+obj.val, base=Math.floor(total/n*100)/100, grupo=A.nid++;
  for(let i=0;i<n;i++){
    const val=i===n-1?+(total-base*(n-1)).toFixed(2):base;
    const [y,m,d]=obj.date.split('-').map(Number);
    const mes=_addMes(y+'-'+_pad2b(m),i);
    const data=mes+'-'+_pad2b(_diaEf(mes,d));
    A.txs.push({...obj,id:A.nid++,val,date:data,desc:`${obj.desc} (${i+1}/${n})`,parcGrupo:grupo,parcela:i+1,parcelas:n,parcTotal:total});
  }
  _rememberLastTx(obj);
  toast(`Compra parcelada em ${n}x de ${R(base)} lançada.`,'var(--income)',3500);
}

function ccExcluirSel(){
  const ids=[...(A.ccMarc||[])]; if(!ids.length) return;
  // Busca nas mesmas compras que a fatura exibe: em cartão compartilhado elas
  // podem estar gravadas em outro controle (A.controlesCache), não só em A.txs.
  const idsStr=new Set(ids.map(String));
  const _visiveis=(window._ccItensVisiveis||[]);
  const _vistos=new Set();
  const txs=[..._visiveis,..._allTxsAcrossControles()].filter(t=>{ const k=String(t.id); if(!idsStr.has(k)||_vistos.has(k)) return false; _vistos.add(k); return true; });
  const soma=txs.reduce((s,t)=>s+(t.type==='receita'?-t.val:t.val),0);
  const parc=txs.filter(t=>t.parcGrupo).length;
  const lista=txs.slice(0,6).map(t=>`<li>${D(t.date).slice(0,5)} · ${H(t.desc)} · ${R(t.val)}</li>`).join('')+(txs.length>6?`<li>… e mais ${txs.length-6}</li>`:'');
  _showConfirm(`Excluir ${txs.length} compra${txs.length!==1?'s':''}?`,
    `<ul class="cc-del-lista">${lista}</ul>Total: <strong>${R(soma)}</strong>.${parc?`<br><span style="font-size:12px;color:var(--amber)">${parc} são parcelas — só as parcelas selecionadas serão apagadas (as outras faturas não mudam).</span>`:''}<br><span style="font-size:12px;color:var(--gray-500)">Esta ação não pode ser desfeita.</span>`,
    ()=>{
      const set=idsStr;
      const _limpar=d=>{
        if(!d) return;
        (d.fixas||[]).forEach(fx=>{ if(fx.pagamentos) Object.keys(fx.pagamentos).forEach(m=>{ if(set.has(String(fx.pagamentos[m]))) delete fx.pagamentos[m]; }); });
        if(Array.isArray(d.txs)) d.txs=d.txs.filter(t=>!set.has(String(t.id)));
      };
      _limpar(A);
      if(A.controlesCache) Object.keys(A.controlesCache).forEach(k=>{ if(Number(k)!==A.controleAtivo) _limpar(A.controlesCache[k]); });
      A.ccSelMode=false; A.ccMarc=new Set();
      toast(`${txs.length} compra${txs.length!==1?'s':''} excluída${txs.length!==1?'s':''}.`,'#888780'); render();
    },{okLabel:`Excluir ${txs.length}`});
}

// Faturas que pedem atenção (fechadas/vencidas não pagas ou vencendo em até 7 dias)
function _faturasAlerta(){
  const out=[];
  _cartoes().forEach(acc=>{
    if(!_ccOk(acc)) return;
    const mes=faturaDaVez(acc), f=faturaInfo(acc,mes);
    if(['fechada','parcial','vencida'].includes(f.status)){
      const dias=Math.round((new Date(f.vencimento+'T12:00:00')-new Date(today()+'T12:00:00'))/864e5);
      out.push({acc,f,dias});
    }
  });
  return out;
}

  const t=A.txs.find(x=>x.id===id);

  const fixaOwner=A.fixas.find(f=>f.pagamentos&&Object.values(f.pagamentos).includes(id));

// ── Exclusão com desfazer (toast "Excluído · Desfazer") ──
let _undoTimer=null,_undoFn=null;
function _showUndoToast(msg,undoFn){
  let el=document.getElementById('undo-toast');
  if(!el){
    el=document.createElement('div');
    el.id='undo-toast';el.className='undo-toast';el.setAttribute('role','status');el.setAttribute('aria-live','polite');
    el.innerHTML='<span class="undo-msg"></span><button type="button" class="undo-btn">Desfazer</button><button type="button" class="undo-x" aria-label="Fechar aviso">✕</button>';
    document.body.appendChild(el);
    el.querySelector('.undo-btn').onclick=()=>{const f=_undoFn;_hideUndoToast();if(f)f();};
    el.querySelector('.undo-x').onclick=_hideUndoToast;
  }
  el.querySelector('.undo-msg').textContent=msg;
  _undoFn=undoFn;
  el.classList.add('show');
  clearTimeout(_undoTimer);_undoTimer=setTimeout(_hideUndoToast,7000);
}
function _hideUndoToast(){
  clearTimeout(_undoTimer);_undoFn=null;
  const el=document.getElementById('undo-toast');if(el)el.classList.remove('show');
}
function _deleteWithUndo(msg,mutate){
  const snap={txs:A.txs.slice(),fixas:JSON.parse(JSON.stringify(A.fixas||[]))};
  mutate();
  render();
  _showUndoToast(msg,()=>{A.txs=snap.txs;A.fixas=snap.fixas;render();toast('Restaurado.','var(--income)');});
}

function editAcc(id){const a=_allAccounts().find(x=>x.id===id);if(!a)return;A.aeId=id;A.delAcc=null;A.af={name:a.name,type:a.type,fechamento:a.fechamento||'',vencimento:a.vencimento||'',limite:a.limite?String(a.limite):'',ini:a.ini,iniDate:a.iniDate||'',iniDateActive:!!a.iniDateActive,obs:a.obs||'',familia:a.familia||'',shared:_isSharedAcc(id),open:true};render();}
function closeAccForm(){A.aeId=null;A.af={...A.af,open:false};render();}
function saveAcc(){
  // Lê campos direto do DOM como fallback (garante captura mesmo sem oninput disparar)
  const dateEl=document.querySelector('#accForm input[type="date"]');
  if(dateEl&&dateEl.value) A.af.iniDate=dateEl.value;
  const chkEl=document.getElementById('chk-ini-active');
  if(chkEl) A.af.iniDateActive=chkEl.checked;

  const n=A.af.name.trim();
  const ini=parseFloat(A.af.ini)||0;
  const obs=A.af.obs||'';
  const iniDate=A.af.iniDate||'';
  const iniDateActive=!!A.af.iniDateActive;
  const wantShared=!!A.af.shared;
  if(!n){toast('Informe o nome.','var(--expense)');return;}

  function _applySaveAcc(){
    if(A.aeId!==null){
      const wasShared=_isSharedAcc(A.aeId);
      const srcList=wasShared?A.sharedAccounts:A.accounts;
      const i=srcList.findIndex(x=>x.id===A.aeId);
      if(i!==-1){
        const updated={...srcList[i],name:n,type:A.af.type,ini,iniDate,iniDateActive,obs,familia:A.af.familia||'',..._ccCampos()};
        srcList.splice(i,1);
        if(wantShared){ if(!A.sharedAccounts)A.sharedAccounts=[]; A.sharedAccounts.push(updated); }
        else { A.accounts.push(updated); }
      }
      if(wantShared&&!wasShared) toast('🔗 Conta agora é compartilhada entre todos os controles.','var(--transfer)',4000);
      else if(!wantShared&&wasShared) toast('Conta agora é exclusiva deste controle.','#D97706',4000);
      else toast('Atualizada!');
    } else {
      const obj={id:A.nid++,name:n,type:A.af.type,ini,iniDate,iniDateActive,obs,familia:A.af.familia||'',..._ccCampos()};
      if(wantShared){ if(!A.sharedAccounts)A.sharedAccounts=[]; A.sharedAccounts.push(obj); toast('🔗 Conta compartilhada criada!','var(--transfer)'); }
      else { A.accounts.push(obj); toast('Criada!'); }
    }
    closeAccForm();
  }

  // Se está deixando de ser compartilhada e existem lançamentos feitos em
  // OUTROS controles usando essa conta, avisa antes (eles deixarão de aparecer aqui).
  if(A.aeId!==null && _isSharedAcc(A.aeId) && !wantShared){
    const outros=_acctTxCountInOtherControles(A.aeId);
    if(outros>0){
      _showConfirm('Tornar conta exclusiva?',
        `Esta conta tem <strong>${outros}</strong> lançamento(s) em outro(s) controle(s). Eles continuarão existindo, mas a conta não aparecerá mais nos outros controles depois dessa mudança.`,
        _applySaveAcc);
      return;
    }
  }
  _applySaveAcc();
}
function askDelAcc(id){
  const a=_allAccounts().find(x=>x.id===id);
  if(_bloquearExclusao('a conta',a?.name,_vinculosConta(id),'Para parar de usar a conta e manter o histórico, renomeie-a (ex.: “'+H(a?.name||'')+' (encerrada)”). Para excluir, apague ou mova antes os lançamentos dela.')) return;
  const shared=_isSharedAcc(id);
  const n=shared?_allTxsAcrossControles().filter(t=>t.accId===id||t.accDest===id).length:A.txs.filter(t=>t.accId===id||t.accDest===id).length;
  const extra=n>0?`<br><span style="color:var(--expense);font-weight:600">⚠ ${n} lançamento(s) vinculado(s)${shared?' (somando todos os controles)':''}.</span>`:'';
  const sharedWarn=shared?'<br><span style="color:var(--transfer);font-weight:600">🔗 Conta compartilhada — será removida de todos os controles.</span>':'';
  _showConfirm('Excluir conta?',`"<strong>${H(a?.name)}</strong>" será removida permanentemente.${extra}${sharedWarn}`,
    ()=>{
      if(shared){ A.sharedAccounts=(A.sharedAccounts||[]).filter(x=>x.id!==id); }
      else { A.accounts=A.accounts.filter(x=>x.id!==id); }
      A.delAcc=null;toast('Excluída.','#888780');render();
    });
}

// Troca o controle ativo: guarda o conteúdo atual no cache e carrega o do controle escolhido.
function switchControle(id,opts){
  id=Number(id); opts=opts||{};
  if(id===A.controleAtivo) return;
  if(!A.controles.some(c=>c.id===id)) return;
  if(!A.controlesCache) A.controlesCache={};
  _compartSync();
  A.controlesCache[A.controleAtivo]={};
  CONTROLE_CONTENT_FIELDS.forEach(k=>{ A.controlesCache[A.controleAtivo][k]=A[k]; });
  const cached=A.controlesCache[id];
  const data=cached?JSON.parse(JSON.stringify(cached)):_blankControleData();
  CONTROLE_CONTENT_FIELDS.forEach(k=>{ A[k]=data[k]; });
  A.controleAtivo=id;
  if(!opts.manterSel) A.ctlMultiSel=[id];
  A.filt='all';
  A.delId=null;A.delAcc=null;A.delCat=null;A.delFixa=null;A.delCtl=null;
  const nome=(A.controles.find(c=>c.id===id)||{}).nome||'';
  if(!opts.silencioso) toast('Controle aberto: '+nome,'var(--blue)');
  render();
}
function openControleForm(){ A.cteId=null; A.delCtl=null; A.ctlForm={name:'',icone:'💼',open:true}; render(); }
function editControle(id){
  const c=A.controles.find(x=>x.id===id); if(!c) return;
  A.cteId=id; A.delCtl=null; A.ctlForm={name:c.nome,icone:c.icone||'💼',open:true}; render();
}
function closeControleForm(){ A.cteId=null; A.ctlForm={...A.ctlForm,open:false}; render(); }
function saveControle(){
  const n=(A.ctlForm.name||'').trim();
  if(!n){ toast('Informe o nome do controle.','var(--expense)'); return; }
  const ic=A.ctlForm.icone||'💼';
  if(A.cteId!==null){
    const c=A.controles.find(x=>x.id===A.cteId);
    if(c){ c.nome=n; c.icone=ic; }
    toast('Controle atualizado!');
  } else {
    let newId=A.nid++;
    // Segurança extra: nunca reutiliza um id que já exista em A.controles
    while(A.controles.some(c=>c.id===newId)){ newId=A.nid++; }
    A.controles.push({id:newId,nome:n,icone:ic});

    A.controlesCache[newId]=_blankControleData();

function askDelControle(id){
  if(A.controles.length<=1){ toast('É preciso manter ao menos um controle.','#D97706'); return; }
  const c=A.controles.find(x=>x.id===id);
  if(_bloquearExclusao('o controle',c?.nome,_vinculosControle(id),'Só é possível excluir um controle vazio (sem lançamentos, contas, contas fixas e senhas).')) return;
  _showConfirm('Excluir controle?',
    `"<strong>${H(c?.nome)}</strong>" está vazio e será removido (as categorias e a família padrão dele também).`,

function doDelControle(id){
  if(A.controles.length<=1) return;
  A.controles=A.controles.filter(c=>c.id!==id);
  if(A.controlesCache) delete A.controlesCache[id];
  if(A.controleAtivo===id){
    const nextId=A.controles[0].id;
    const cached=A.controlesCache&&A.controlesCache[nextId];
    const data=cached?JSON.parse(JSON.stringify(cached)):_blankControleData();
    CONTROLE_CONTENT_FIELDS.forEach(k=>{ A[k]=data[k]; });
    A.controleAtivo=nextId;
  }
  A.delCtl=null;
  toast('Controle excluído.','#888780');

/* ═══ Cadastros compartilhados entre controles ═══
   Cada controle continua guardando sua cópia de categorias, família e regras;
   o que estiver marcado como compartilhado é copiado do controle aberto para
   todos os outros a cada salvamento e a cada troca de controle. Ao ligar,
   os cadastros de todos os controles são unidos (sem perder nada). */
const COMPART_ITENS=[
  {k:'despesa',  ic:'↓', nome:'Categorias de despesas',     desc:'Mesma árvore de categorias de despesa em todos os controles.'},
  {k:'receita',  ic:'↑', nome:'Categorias de receitas',     desc:'Mesma árvore de categorias de receita em todos os controles.'},
  {k:'transferencia',ic:'↔',nome:'Categorias de transferências',desc:'Mesmas categorias de transferência em todos os controles.'},
  {k:'familia',  ic:'👤',nome:'Família',                     desc:'Mesmos grupos e membros em todos os controles.'},
  {k:'regras',   ic:'⚡',nome:'Regras de categorização',     desc:'Mesmas regras de importação. Funciona melhor junto com as categorias compartilhadas.'},
];
function _compart(){ if(!A.compart||typeof A.compart!=='object') A.compart={}; COMPART_ITENS.forEach(i=>{ if(A.compart[i.k]===undefined) A.compart[i.k]=false; }); return A.compart; }
function _compartOn(k){ return !!_compart()[k]; }
function _compartAlgum(){ return COMPART_ITENS.some(i=>_compartOn(i.k)); }
const _clone=o=>JSON.parse(JSON.stringify(o));
function _outrosControles(){
  if(!A.controlesCache) A.controlesCache={};
  return (A.controles||[]).filter(c=>c.id!==A.controleAtivo).map(c=>{
    if(!A.controlesCache[c.id]) A.controlesCache[c.id]=_blankControleData();
    return A.controlesCache[c.id];
  });
}
// Copia o que é compartilhado do controle aberto para os demais
function _compartSync(){
  if(!_compartAlgum()||!A.controles||A.controles.length<2) return;
  const tipos=['despesa','receita','transferencia'].filter(_compartOn);
  _outrosControles().forEach(d=>{
    if(tipos.length){
      const meus=_clone((A.cats||[]).filter(c=>tipos.includes(c.tipo)));
      const ids=new Set(meus.map(c=>String(c.id)));
      d.cats=(d.cats||[]).filter(c=>!tipos.includes(c.tipo)&&!ids.has(String(c.id))).concat(meus);
    }
    if(_compartOn('familia')) d.familia=_clone(A.familia||[]);
    if(_compartOn('regras')) d.catRegras=_clone(A.catRegras||[]);
  });
}
// Une os cadastros de todos os controles no controle aberto (antes de ligar o compartilhamento)
function _compartUnir(k){
  const outros=_outrosControles();
  const novoId=usados=>{ let id=A.nid++; while(usados.has(String(id))) id=A.nid++; usados.add(String(id)); return id; };
  if(['despesa','receita','transferencia'].includes(k)){
    const tipo=k; let novas=0;
    outros.forEach(d=>{
      const usados=new Set((A.cats||[]).map(c=>String(c.id)).concat((d.cats||[]).map(c=>String(c.id))));
      const mapa={};
      // ordem da árvore: pais antes das filhas
      const lista=(d.cats||[]).filter(c=>c.tipo===tipo); const ord=[]; const vis=new Set();
      const add=c=>{ if(vis.has(c.id)) return; const pai=c.parentId!=null?lista.find(x=>x.id==c.parentId):null; if(pai) add(pai); vis.add(c.id); ord.push(c); };
      lista.forEach(add);
      ord.forEach(c=>{
        const pai=c.parentId!=null?(mapa[c.parentId]!=null?mapa[c.parentId]:c.parentId):null;
        const igual=(A.cats||[]).find(x=>x.tipo===tipo&&_normTxt(x.name)===_normTxt(c.name)&&String(x.parentId??'')===String(pai??''));
        if(igual){ mapa[c.id]=igual.id; return; }
        const conflito=(A.cats||[]).some(x=>String(x.id)===String(c.id));
        const id=conflito?novoId(usados):c.id;
        A.cats.push({..._clone(c),id,parentId:pai}); mapa[c.id]=id; novas++;
      });
      // categorias de outros tipos desse controle que batem com ids do controle aberto ganham id novo
      const meusIds=new Set((A.cats||[]).filter(c=>c.tipo===tipo).map(c=>String(c.id)));
      (d.cats||[]).forEach(c=>{ if(c.tipo!==tipo&&meusIds.has(String(c.id))){ const id=novoId(usados); (d.cats||[]).forEach(x=>{ if(x.parentId==c.id) x.parentId=id; }); mapa[c.id]=id; c.id=id; } });
      // reaponta lançamentos, contas fixas e regras desse controle
      const troca=o=>{ if(o&&o.catId!=null&&mapa[o.catId]!=null) o.catId=mapa[o.catId]; };
      (d.txs||[]).forEach(troca); (d.fixas||[]).forEach(troca); (d.catRegras||[]).forEach(troca);
    });
    return novas;
  }
  if(k==='familia'){
    let novos=0;
    outros.forEach(d=>{
      const usados=new Set((A.familia||[]).map(f=>String(f.id)));
      const mapa={}; const lista=d.familia||[];
      [...lista.filter(f=>!f.parentId),...lista.filter(f=>f.parentId)].forEach(f=>{
        const igual=(A.familia||[]).find(x=>_normTxt(x.name)===_normTxt(f.name));
        if(igual){ mapa[f.id]=igual.id; return; }
        const id=usados.has(String(f.id))?novoId(usados):f.id; usados.add(String(id));
        A.familia.push({id,name:f.name,parentId:f.parentId?(mapa[f.parentId]??null):null}); mapa[f.id]=id; novos++;
      });
      // lançamentos guardam o nome: alinha a grafia com a do cadastro unido
      (d.txs||[]).forEach(t=>{ if(!t.familia) return; const m=(A.familia||[]).find(x=>_normTxt(x.name)===_normTxt(t.familia)); if(m) t.familia=m.name; });
    });
    return novos;
  }
  if(k==='regras'){
    let novas=0; const usados=new Set(_regras().map(r=>String(r.id)));
    outros.forEach(d=>{
      (d.catRegras||[]).forEach(r=>{
        if(_regras().some(x=>_regraNorm(x.texto)===_regraNorm(r.texto)&&(x.modo||'contem')===(r.modo||'contem'))) return;
        const id=usados.has(String(r.id))?novoId(usados):r.id; usados.add(String(id));
        _regras().push({..._clone(r),id}); novas++;
      });
    });
    return novas;
  }
  return 0;
}
function compartToggle(k,el){
  const item=COMPART_ITENS.find(i=>i.k===k); if(!item) return;
  if(_multiActive()){ el.checked=_compartOn(k); toast('🔒 Selecione apenas 1 controle para alterar o compartilhamento.','#D97706',4500); return; }
  if(!el.checked){
    _compartSync(); // garante que todos os controles fiquem com a cópia mais recente antes de separar
    _compart()[k]=false; dbSave();
    toast(`${item.nome}: cada controle passa a ter a sua própria cópia.`,'#888780',4500); render(); return;
  }
  el.checked=false;
  const nCtl=(A.controles||[]).length;
  const nomeAtivo=H((A.controles.find(c=>c.id===A.controleAtivo)||{}).nome||'');
  _showConfirm('Compartilhar '+item.nome.toLowerCase()+'?',
    `Os cadastros dos ${nCtl} controles serão <strong>unidos</strong> no controle aberto (<strong>${nomeAtivo}</strong>) e, daqui em diante, qualquer alteração vale para todos.<br><span style="font-size:12px;color:var(--gray-500)">Itens com o mesmo nome viram um só; os lançamentos de cada controle são reapontados automaticamente. Nada é apagado.</span>`,
    ()=>{
      const n=_compartUnir(k);
      _compart()[k]=true;
      _compartSync(); dbSave();
      toast(`🔗 Compartilhado entre os controles: ${item.nome}${n?` · ${n} item(ns) trazido(s) de outros controles`:''}.`,'var(--transfer)',5000);
      render();
    },{okLabel:'Compartilhar',okColor:'var(--transfer)'});
}

function editCat(id){

  A.ceId=id;
  A.cf={name:cat.name,color:cat.color,tipo:cat.tipo,parentId:cat.parentId||null,orcamento:cat.orcamento?String(cat.orcamento):'',open:true};
  render();
}

function saveCat(){
  const n=A.cf.name.trim();
  if(!n){toast('Informe o nome.','var(--expense)');return;}
  if(A.ceId!==null){
    const c=A.cats.find(x=>x.id===A.ceId);
    if(c){c.name=n;c.color=A.cf.color;const o=parseFloat(A.cf.orcamento);if(c.tipo==='despesa'&&o>0)c.orcamento=+o.toFixed(2);else delete c.orcamento;}
    toast('Atualizada!');
  } else {
    const newCat={id:A.nid++,name:n,color:A.cf.color,tipo:A.cf.tipo,parentId:A.cf.parentId||null};
    const o=parseFloat(A.cf.orcamento);if(newCat.tipo==='despesa'&&o>0)newCat.orcamento=+o.toFixed(2);
    A.cats.push(newCat);
    A.catSelId=newCat.id;

    if(newCat.parentId!=null)_catCaminho(newCat.id).slice(0,-1).forEach(a=>{A.catExpanded[a.id]=true;});

function askDelCat(id){
  if(!id)return;
  const cat=A.cats.find(c=>c.id===id);
  if(_bloquearExclusao('a categoria',_catNomeCompleto(cat),_vinculosCategoria(id),'Mude a categoria dos lançamentos (ex.: pelo Extrato › Selecionar) e apague antes as subcategorias e regras ligadas a ela.')) return;
  const idsToRemove=_catDescIds(id);
  const subs=A.cats.filter(c=>idsToRemove.has(c.id)&&c.id!==id);
  const total=A.txs.filter(t=>idsToRemove.has(Number(t.catId))).length+(A.fixas||[]).filter(f=>idsToRemove.has(Number(f.catId))).length;
  if(total>0){
    _showConfirm('Não é possível excluir',
      `"<strong>${H(cat?.name)}</strong>" ou suas subcategorias têm <strong>${total}</strong> lançamento(s)/conta(s) fixa(s) vinculado(s).`,

  const subWarn=subs.length>0?`<br><span style="color:var(--amber)">⚠ ${subs.length} subcategoria(s) também serão apagadas.</span>`:'';
  _showConfirm('Apagar categoria?',

      toast('Removida.','#888780');render();

let _confirmCallback=null;
function _showConfirm(title,msg,onOk,opts){
  opts=opts||{};
  const overlay=document.getElementById('confirmOverlay');
  const titleEl=document.getElementById('confirmTitle');
  const msgEl=document.getElementById('confirmMsg');
  const okBtn=document.getElementById('confirmOkBtn');
  titleEl.textContent=title;
  msgEl.innerHTML=msg;
  okBtn.textContent=opts.okLabel||'Excluir';
  okBtn.style.background=opts.okColor||'var(--expense)';
  // Se não há callback de confirmação real (ex: apenas info), esconde botão excluir
  if(!onOk){
    okBtn.style.display='none';
    // o cancelar vira "OK"
    overlay.querySelector('.cd-actions button:first-child').textContent='OK';
  } else {
    okBtn.style.display='';
    overlay.querySelector('.cd-actions button:first-child').textContent='Cancelar';
  }
  _confirmCallback=onOk;
  overlay.style.display='flex';
  document.body.style.overflow='hidden';
}
// Guarda para fechar modal apenas quando o clique COMEÇOU no overlay
// (evita fechar ao soltar o mouse fora após selecionar texto dentro do modal)
let _overlayMousedownTarget = null;
function _overlayMousedown(e){ _overlayMousedownTarget = e.target; }
function _overlayClick(e, closeFn){
  if(_overlayMousedownTarget === e.currentTarget && e.target === e.currentTarget){ closeFn(); }
  _overlayMousedownTarget = null;
}
function _confirmCancel(){
  const overlay=document.getElementById('confirmOverlay');
  overlay.style.display='none';
  document.body.style.overflow='';
  _confirmCallback=null;
}
function _confirmOk(){
  const cb=_confirmCallback;
  _confirmCancel();
  if(cb)cb();
}
// Fechar com ESC
document.addEventListener('keydown',function(e){if(e.key==='Escape')_confirmCancel();});

// ── Handle OPFS reutilizável ──
let _opfsHandle = null;
async function _getOpfsHandle() {
  if (_opfsHandle) return _opfsHandle;
  const root = await navigator.storage.getDirectory();
  _opfsHandle = await root.getFileHandle(OPFS_FILE, { create: true });
  return _opfsHandle;
}

// ── Escrita atômica via createSyncAccessHandle (Worker) ou writable stream ──
async function _opfsWrite(text) {
  const handle = await _getOpfsHandle();
  const writable = await handle.createWritable();
  await writable.write(text);
  await writable.close();
}

async function _opfsRead() {
  try {
    const handle = await _getOpfsHandle();
    const file = await handle.getFile();
    return await file.text();
  } catch(e) {
    return null;
  }
}

// ── Estimativa de uso ──
async function _storageUsageKB() {
  if (_opfsOk && navigator.storage.estimate) {
    try {
      const est = await navigator.storage.estimate();
      return Math.round((est.usage || 0) / 1024);
    } catch(e) {}
  }
  // fallback localStorage
  let total = 0;
  for (const key in localStorage) {
    if (!localStorage.hasOwnProperty(key)) continue;
    total += (localStorage[key].length + key.length) * 2;
  }
  return Math.round(total / 1024);
}

// Armazena último valor para exibição síncrona na status bar
let _lastUsageKB = 0;
function _lsUsageKB() { return _lastUsageKB; }

// ── Salvamento sob demanda ──
// render() não grava mais a cada chamada (abrir dropdown, trocar aba…).
// Ele agenda um salvamento com debounce, que só grava se os dados
// persistidos mudaram desde o último save. Mudanças de UI (aba, filtros,
// itens expandidos) não fazem parte da assinatura e não disparam gravação.
let _saveTimer = null;
let _lastSavedSig = null;
function _dataSignature(){
  const o = {};
  GLOBAL_FIELDS.forEach(k => { o['g:'+k] = A[k]; });
  USER_FIELDS.forEach(k => { o[k] = A[k]; });
  o._sess = window._appSession ? window._appSession.id : null;
  try { return JSON.stringify(o); } catch(e) { return String(Math.random()); }
}
function scheduleSave(delay = 400){
  clearTimeout(_saveTimer);
  _saveTimer = setTimeout(flushSave, delay);
}
function flushSave(){
  clearTimeout(_saveTimer); _saveTimer = null;
  if (!window._bootDone) return;
  if (_dataSignature() === _lastSavedSig) return; // nada mudou
  dbSave();
}

// ── dbSave: Disco / OPFS / localStorage ──
function dbSave() {
  // ── 0) Sincroniza o conteúdo do Controle ativo no cache de controles,
  //    para que os demais controles não se percam ao salvar ──
  if(A.controleAtivo!=null){
    if(!A.controlesCache) A.controlesCache={};
    _compartSync();
    A.controlesCache[A.controleAtivo]={};
    CONTROLE_CONTENT_FIELDS.forEach(k=>{ A.controlesCache[A.controleAtivo][k]=A[k]; });
  }
  _lastSavedSig = _dataSignature();
  // ── 1) Dados GLOBAIS: lista de usuários de login + contador de IDs ──
  // Sempre gravados na mesma chave, independente de quem está logado.
  const globalPayload = {};
  GLOBAL_FIELDS.forEach(k => { globalPayload[k] = A[k]; });
  globalPayload._savedAt = new Date().toISOString();
  try { localStorage.setItem(GLOBAL_KEY, JSON.stringify(globalPayload)); } catch(e) {}

  // ── 2) Dados de CONTEÚDO (contas, transações, categorias, senhas, etc.) ──
  // Ficam isolados por usuário logado. Se não há usuários cadastrados
  // (modo livre) OU ainda ninguém logou nesta sessão, não grava nada de
  // conteúdo — evita misturar dados de contas diferentes.
  const s = window._appSession;
  const loginOn = _loginRequired();
  if (loginOn && !(s && s.id != null)) {
    _storageUsageKB().then(kb => { _lastUsageKB = kb; _updateDbStatus(); });
    return;
  }

  const payload = {};
  USER_FIELDS.forEach(k => { payload[k] = A[k]; });
  payload._savedAt = new Date().toISOString();
  const serialized = JSON.stringify(payload);
  const activeKey = _activeContentKey();

  if (_opfsOk) {
    _opfsWrite(serialized).catch(e => {
      console.warn('OPFS write error (silenciado):', e);
    });
    // Espelho leve no localStorage para leitura síncrona inicial (comprimido)
    try { localStorage.setItem(activeKey, serialized); } catch(e) { /* ignora quota */ }
  } else {
    // Fallback puro localStorage
    try {
      const kb = (serialized.length * 2) / 1024;
      if (kb > 4096) toast('⚠️ Armazenamento quase cheio! Faça um backup.', '#D97706', 5000);
      localStorage.setItem(activeKey, serialized);
    } catch(e) {
      if (e.name === 'QuotaExceededError' || e.name === 'NS_ERROR_DOM_QUOTA_REACHED') {
        toast('🚨 Armazenamento cheio! Exporte um backup imediatamente.', 'var(--expense)', 8000);
      } else {
        toast('Erro inesperado ao salvar.', 'var(--expense)');
      }
    }
  }

  // Atualiza estimativa de uso em background
  _storageUsageKB().then(kb => { _lastUsageKB = kb; _updateDbStatus(); });

  // ── Firebase: sincroniza automaticamente se logado ──
  if (window._fbUser && window._fb) {
    clearTimeout(window._fbSyncTimer);
    window._fbSyncTimer = setTimeout(() => {
      const fbPayload = {};
      DB_FIELDS.forEach(k => { fbPayload[k] = A[k]; });
      fbPayload._savedAt = new Date().toISOString();
      _updateFbChip('syncing');
      window._fb.save(window._fbUser.uid, fbPayload)
        .then(() => {
          const agora = new Date().toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit', second:'2-digit'});
          const env = window._fbEnv === 'producao' ? '🚀' : '🧪';
          window._fbLastSync = `${env} ☁️ ${agora}`;
          window._fbSyncError = false;
          _updateDbStatus();
          _updateFbChip('synced');
        })
        .catch(e => { console.warn('Firebase auto-sync error:', e); window._fbSyncError = true; _updateFbChip('error'); });
    }, 2000); // debounce 2s para não disparar a cada tecla
  }
}

// ── SHA-256 via WebCrypto (definida cedo — usada no boot) ──
async function _sha256(str){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

// ── Hash de senha de login: PBKDF2-SHA256 com salt aleatório ──
//    Formato salvo: "pbkdf2$<iterações>$<salt b64>$<hash b64>"
//    Hashes antigos (SHA-256 puro, sem salt) ainda são aceitos e são
//    convertidos automaticamente no próximo login bem-sucedido.
const PWD_ITER = 210000;
async function _pbkdf2Bits(pass, salt, iter){
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveBits']);
  return crypto.subtle.deriveBits({name:'PBKDF2', salt, iterations:iter, hash:'SHA-256'}, base, 256);
}
async function _hashPassword(pass){
  const salt = _rand(16);
  const bits = await _pbkdf2Bits(pass, salt, PWD_ITER);
  return `pbkdf2$${PWD_ITER}$${_b64e(salt.buffer)}$${_b64e(bits)}`;
}
function _isLegacyHash(h){ return !!h && !String(h).startsWith('pbkdf2$'); }
async function _verifyPassword(user, pass){
  const h = user && user.senhaHash;
  if(!h || !pass) return false;
  if(String(h).startsWith('pbkdf2$')){
    const [, it, saltB64, hashB64] = h.split('$');
    const bits = await _pbkdf2Bits(pass, new Uint8Array(_b64d(saltB64)), parseInt(it,10)||PWD_ITER);
    return _b64e(bits) === hashB64;
  }
  return (await _sha256(pass)) === h; // legado
}

// ── Autenticação local: confere login + senha e migra hash legado ──
async function _localAuth(login, pass){
  const l = String(login||'').toLowerCase();
  const user = (A.usuarios||[]).find(u => (u.login||'').toLowerCase() === l);
  if(!user || !(await _verifyPassword(user, pass))) return null;
  if(_isLegacyHash(user.senhaHash)){
    if(user.papel === 'admin') await _vaultMasterFromAdmin(user.id, pass); // migra a chave do cofre
    user.senhaHash = await _hashPassword(pass);
    dbSave();
  }
  return user;
}

// ── Estrutura "em branco" para um Controle novo: mantém as categorias e
//    membros da família padrão, mas sem contas/lançamentos/senhas ──
function _blankControleData(){
  return {
    familia:  JSON.parse(JSON.stringify(_SEED_DATA.familia)),
    cats:     JSON.parse(JSON.stringify(_SEED_DATA.cats)),
    catRegras:[],
    accounts: [],
    fixas:    [],
    txs:      [],
    senhas:   []
  };
}
// ── Garante que sempre exista ao menos 1 Controle e que o Controle ativo
//    seja válido. Roda no boot, no modo livre e a cada troca de usuário. ──
// O contador de ids (A.nid) é global; se ele "voltar" (ex.: dados vindos da
// nuvem ou de um backup), novos itens recebem ids que já existem — e aí, ao
// escolher uma conta, o app seleciona outra com o mesmo id. Garante nid > maior id.
function _ensureNid(){
  let max=0; const bump=v=>{const n=Number(v); if(Number.isFinite(n)&&n>max) max=n;};
  const scan=d=>{ if(!d) return; ['accounts','txs','fixas','cats','familia','senhas'].forEach(k=>(Array.isArray(d[k])?d[k]:[]).forEach(x=>x&&bump(x.id))); };
  scan(A);
  (A.sharedAccounts||[]).forEach(a=>bump(a.id));
  (A.controles||[]).forEach(c=>bump(c.id));
  (A.usuarios||[]).forEach(u=>bump(u.id));
  Object.values(A.controlesCache||{}).forEach(scan);
  if(!(Number(A.nid)>max)) A.nid=max+1;
}
// Contas com o mesmo id (em controles diferentes, ou igual ao de uma conta
// compartilhada) se confundem nos filtros e na visualização combinada.
// Dá um id novo à repetida e ajusta os lançamentos/fixas DO MESMO controle.
// Categorias: ids sempre numéricos e subcategoria sem pai vira principal
// (dados antigos/da nuvem podem trazer "3" em vez de 3 — aí a árvore não acha o pai)
function _normalizarCategorias(){
  if(!Array.isArray(A.cats)) return;
  const num=v=>{ if(v===null||v===undefined||v==='') return null; const n=Number(v); return Number.isFinite(n)?n:v; };
  A.cats.forEach(c=>{ c.id=num(c.id); c.parentId=num(c.parentId); });
  const ids=new Set(A.cats.map(c=>c.id));
  A.cats.forEach(c=>{ if(c.parentId!=null&&(!ids.has(c.parentId)||c.parentId===c.id)) c.parentId=null; });
  // ciclo (A dentro de B dentro de A) vira categoria principal
  A.cats.forEach(c=>{ let p=c.parentId, n=0; while(p!=null&&n<50){ if(p===c.id){ c.parentId=null; break; } const pc=A.cats.find(x=>x.id===p); p=pc?pc.parentId:null; n++; } });
  (A.txs||[]).forEach(t=>{ if(t.catId!=null&&t.catId!==''){ const n=Number(t.catId); if(Number.isFinite(n)) t.catId=n; } });
  (A.fixas||[]).forEach(f=>{ if(f.catId!=null&&f.catId!==''){ const n=Number(f.catId); if(Number.isFinite(n)) f.catId=n; } });
}
function _repairAccountIds(){
  _ensureNid();
  const reparos=[];
  const usado=new Set((A.sharedAccounts||[]).map(a=>String(a.id)));
  const lista=[{id:A.controleAtivo,data:A}].concat(Object.keys(A.controlesCache||{}).filter(k=>Number(k)!==A.controleAtivo).map(k=>({id:Number(k),data:A.controlesCache[k]})));
  lista.forEach(({id,data})=>{
    if(!data||!Array.isArray(data.accounts)) return;
    const local=new Set();
    data.accounts.forEach(acc=>{
      const k=String(acc.id);
      if(local.has(k)){
        // repetida dentro do mesmo controle: não dá para saber de qual são os lançamentos — só separa
        acc.id=A.nid++; reparos.push(acc.name);
      } else if(usado.has(k)){
        const novo=A.nid++;
        (data.txs||[]).forEach(t=>{ if(String(t.accId)===k) t.accId=novo; if(String(t.accDest)===k) t.accDest=novo; });
        (data.fixas||[]).forEach(f=>{ if(String(f.accId)===k) f.accId=novo; });
        acc.id=novo; reparos.push(acc.name);
      }
      local.add(String(acc.id));
    });
    data.accounts.forEach(a=>usado.add(String(a.id)));
  });
  if(reparos.length){
    console.warn('Contas com id repetido corrigidas:',reparos);
    setTimeout(()=>toast('Corrigido: '+reparos.length+' conta(s) com identificador repetido ('+reparos.slice(0,3).join(', ')+(reparos.length>3?'…':'')+'). Confira os saldos.','var(--amber)',7000),1500);
  }
  return reparos;
}
function _ensureControles(){
  if(!Array.isArray(A.controles) || A.controles.length===0){
    A.controles=[{id:1,nome:'Principal',icone:'💼'}];
  }
  if(!A.controlesCache || typeof A.controlesCache!=='object'){
    A.controlesCache={};
  }
  // ── Corrige controles com IDs duplicados ──
  // Se dois controles compartilham o mesmo id, eles acabam apontando para o
  // mesmo slot em A.controlesCache: ao ativar um, o outro também aparece
  // marcado como "Ativo agora" (mesmo bug visto na tela de Controles).
  // Aqui detectamos duplicados e damos um id novo e único para eles.
  // ids de controle sempre numéricos (dados antigos/da nuvem podem vir como texto)
  A.controles.forEach(c=>{ const n=Number(c.id); if(Number.isFinite(n)) c.id=n; });
  if(A.controleAtivo!=null) A.controleAtivo=Number(A.controleAtivo);
  if(Array.isArray(A.ctlMultiSel)) A.ctlMultiSel=A.ctlMultiSel.map(Number);
  _ensureNid();
  const seen = new Set();
  let fixedDup = false;
  A.controles.forEach(c=>{
    if(seen.has(c.id)){
      fixedDup = true;
      const newId = A.nid++;
      A.controlesCache[newId] = _blankControleData();
      c.id = newId;
    } else {
      seen.add(c.id);
    }
  });
  if(fixedDup){
    toast('⚠️ Havia controles com o mesmo ID interno — foram separados automaticamente. Confira as contas de cada um.', '#D97706', 7000);
  }
  if(A.controleAtivo==null || !A.controles.some(c=>c.id===A.controleAtivo)){
    A.controleAtivo=A.controles[0].id;
  }
  // ── Seleção múltipla de controles (visualização combinada) ──
  // Auto-corrige se estiver vazia, ausente, ou referenciar controles que não existem mais.
  if(!Array.isArray(A.ctlMultiSel) || A.ctlMultiSel.length===0 || !A.ctlMultiSel.every(id=>A.controles.some(c=>c.id===id))){
    A.ctlMultiSel=[A.controleAtivo];
  }
}

// ── Visualização combinada de múltiplos Controles (somente leitura) ──
// Quando A.ctlMultiSel tem mais de 1 id, as telas de conteúdo passam a
// enxergar dados mesclados de todos os controles selecionados (cada item
// marcado com _ctlId/_ctlNome/_ctlIcone para exibir a "etiqueta" de origem).
// Como os IDs são gerados por um contador global (A.nid), não há colisão
// entre itens de controles diferentes ao mesclar.
let _ctlPanelOpen=false;
let _ctlPanelPos=null;   // posição fixa do painel, calculada ao abrir
let _ctlUltimoToggle={id:null,t:0};

// Visão combinada: a mesma categoria (mesmo id) e o mesmo membro (mesmo nome)
// existem em vários controles — junta em um só para não repetir nos filtros,
// gráficos e totais por categoria/membro.
function _mergedSemDuplicar(field){
  const lista=_mergedField(field);
  if(field==='cats'){
    const vistos=new Set();
    return lista.filter(c=>{ const k=String(c.id); if(vistos.has(k)) return false; vistos.add(k); return true; });
  }
  if(field==='familia'){
    const porNome=new Map(), mapaId={}, out=[];
    const chave=n=>_normTxt(String(n||'')).trim();
    // raízes primeiro, depois membros (para remapear o grupo de cada membro)
    [...lista.filter(f=>!f.parentId),...lista.filter(f=>f.parentId)].forEach(f=>{
      const k=chave(f.name);
      if(porNome.has(k)){ mapaId[f.id]=porNome.get(k).id; return; }
      const novo={...f}; if(novo.parentId&&mapaId[novo.parentId]!=null) novo.parentId=mapaId[novo.parentId];
      porNome.set(k,novo); mapaId[f.id]=novo.id; out.push(novo);
    });
    // membro cujo grupo virou outro id: aponta para o grupo que ficou
    out.forEach(f=>{ if(f.parentId&&mapaId[f.parentId]!=null) f.parentId=mapaId[f.parentId]; if(f.parentId===f.id) f.parentId=null; });
    return out;
  }
  return lista;
}

// ── Migrações de schema que precisam rodar sempre que dados de CONTEÚDO
//    são carregados (no boot, no modo livre, e a cada troca de usuário) ──
// [SEG] Neutraliza HTML em textos vindos de backup/nuvem/arquivos: < e > viram ‹ ›
//       (descrições financeiras não precisam de tags) e links só http(s).
const _SAN_SKIP=new Set(['enc','iv','salt','senhaHash','verifierEnc','verifierIv']);
function _sanTxt(s){ return /[<>]/.test(s)?s.replace(/</g,'‹').replace(/>/g,'›'):s; }
function _sanDeep(o,depth){
  if(!o||typeof o!=='object'||depth>8) return;
  for(const k of Object.keys(o)){
    if(k==='__proto__'||k==='constructor'){ delete o[k]; continue; }
    const v=o[k];
    if(typeof v==='string'){ if(_SAN_SKIP.has(k)) continue; let n=_sanTxt(v); if(k==='url'&&n&&!_safeUrl(n)) n=''; if(n!==v) o[k]=n; }
    else if(v&&typeof v==='object' && !(v instanceof Set)) _sanDeep(v,depth+1);
  }
}
function _runContentSchemaMigrations(){
  try{ USER_FIELDS.forEach(k=>_sanDeep(A[k],0)); _sanDeep(A.usuarios,0); }catch(e){}
  _ensureControles();
  _repairAccountIds();
  _normalizarCategorias();
  if(!Array.isArray(A.catRegras)) A.catRegras=[];
  _compart();
  (A.fixas||[]).forEach(f=>{
    if(!f.inicioEm){
      const pagMeses=Object.keys(f.pagamentos||{}).sort();
      f.inicioEm=pagMeses.length>0?pagMeses[0]:thisMonth();
    }
  });
  if(!Array.isArray(A.sharedAccounts)) A.sharedAccounts=[];
  (A.accounts||[]).concat(A.sharedAccounts||[]).forEach(a=>{
    if(a.iniDate===undefined) a.iniDate='';
    if(a.iniDateActive===undefined) a.iniDateActive=false;
    a.iniDateActive=(a.iniDateActive===true||a.iniDateActive==='true');
  });
  migrateFamilia();
  if(!A.ctpExp) A.ctpExp={};
  if(!A.famForm) A.famForm={name:'',parentId:null};
  if(A.famSelId===undefined) A.famSelId=null;
  if(!A.famExpanded) A.famExpanded={};
}

async function dbLoadAsync() {
  // ── 1) Carrega dados GLOBAIS (lista de usuários + contador de IDs) ──
  let globalRaw = null;
  try { globalRaw = localStorage.getItem(GLOBAL_KEY); } catch(e) {}

  // Lê o blob legado (versões antigas — um único conjunto de dados compartilhado)
  let legacyRaw = null;
  if (_opfsOk) legacyRaw = await _opfsRead();
  if (!legacyRaw) { try { legacyRaw = localStorage.getItem(DB_KEY); } catch(e) {} }

  let legacyData = null;
  if (legacyRaw) { try { legacyData = JSON.parse(legacyRaw); } catch(e) {} }

  if (globalRaw) {
    try {
      const g = JSON.parse(globalRaw);
      GLOBAL_FIELDS.forEach(k => { if (g[k] !== undefined) A[k] = g[k]; });
    } catch(e) {}
  } else if (legacyData) {
    // Primeira execução após a atualização: extrai usuários/contador do blob antigo
    GLOBAL_FIELDS.forEach(k => { if (legacyData[k] !== undefined) A[k] = legacyData[k]; });
  }

  const loginOn = _loginRequired();
  let hadData = false;

  if (!loginOn) {
    // ── Modo livre (nenhum usuário cadastrado): comportamento antigo, dados únicos e compartilhados ──
    if (legacyData) {
      USER_FIELDS.forEach(k => { if (legacyData[k] !== undefined) A[k] = legacyData[k]; });
      hadData = true;
    }
  } else if (legacyData && !localStorage.getItem(MIGRATION_FLAG_KEY)) {
    // ── Migração única: dados antigos compartilhados viram os dados privados do admin padrão ──
    const adminUser = (A.usuarios||[]).find(u => u.papel === 'admin');
    if (adminUser) {
      const migPayload = {};
      USER_FIELDS.forEach(k => { migPayload[k] = legacyData[k] !== undefined ? legacyData[k] : A[k]; });
      migPayload._savedAt = new Date().toISOString();
      try { localStorage.setItem(userDataKey(adminUser.id), JSON.stringify(migPayload)); } catch(e) {}
    }
    try { localStorage.setItem(MIGRATION_FLAG_KEY, '1'); } catch(e) {}
  }

  _runContentSchemaMigrations();
  // Garante admin padrão mesmo após carregar dados do Firebase
  await _ensureDefaultAdmin();
  return hadData || !!globalRaw || !!legacyData;
}

// Versão síncrona legada (só localStorage, modo livre) para compatibilidade
function dbLoad() {
  try {
    const raw = localStorage.getItem(DB_KEY);
    if (!raw) return false;

}

  // evitando que dados do usuário anterior fiquem visíveis/sejam salvos por engano

    window._fbAuthReadyResolve = null;

  // Após o boot: atualiza status
  if (window._bootDone) {
    _updateDbStatus();
  }
}
