// ── Login/troca de conta a partir do modal ──
async function _fbSwitchLogin(mode) {
  const email = (document.getElementById('fb-sw-email')?.value || '').trim();
  const pass  = document.getElementById('fb-sw-pass')?.value || '';
  const errEl = document.getElementById('fb-sw-err');
  const btn   = mode === 'criar' ? document.getElementById('fb-sw-btn-criar') : document.getElementById('fb-sw-btn');
  if (errEl) errEl.style.display = 'none';
  if (!email || !pass) { if(errEl){errEl.style.display='block';errEl.textContent='Preencha e-mail e senha.';} return; }
  if (mode === 'criar' && pass.length < 6) { if(errEl){errEl.style.display='block';errEl.textContent='A senha deve ter pelo menos 6 caracteres.';} return; }
  if (btn) { btn.textContent = '⏳ Conectando…'; btn.disabled = true; }
  try {
    // Faz logout da conta atual se houver
    if (window._fbUser && window._fb) { try { await window._fb.signOut(); } catch(e){} }
    if (mode === 'criar') {
      await window._fb.signUp(email, pass);
    } else {
      await window._fb.signIn(email, pass);
    }
    localStorage.setItem('pfp_fb_last_email', email);
    // Aguarda onAuthStateChanged confirmar
    if (!window._fbUser) {
      await Promise.race([
        new Promise(r => { const u = window._fb.onAuth(usr => { if(usr){u();r(usr);} }); }),
        new Promise(r => setTimeout(r, 3000))
      ]);
    }
    const uid   = window._fbUser?.uid || 'fbuser';
    const eml   = window._fbUser?.email || email;

    // Limpa os dados em memória (que ainda pertencem à conta anterior) ANTES
    // de buscar os dados reais da conta recém-logada. Isso evita que os dados
    // do usuário antigo sejam exibidos e, principalmente, sobrescrevam por
    // engano os dados na nuvem do novo usuário.
    _resetAppDataToSeed();
    try {
      const data = await window._fb.load(uid);
      if (data) {
        DB_FIELDS.forEach(k => { if (data[k] !== undefined) A[k] = data[k]; });
      }
      _runContentSchemaMigrations();
    } catch(loadErr) {
      console.warn('Erro ao carregar dados da conta trocada:', loadErr);
    }

    window._appSession = { id: 'fb:' + uid, nome: eml.split('@')[0], login: eml, papel: 'admin' };
    _sessionSet(window._appSession);
    _updateFbChip('synced');
    document.getElementById('fb-modal-overlay')?.remove();
    toast(mode === 'criar' ? '☁️ Conta criada! Dados sincronizando...' : '☁️ Conectado: ' + eml, mode === 'criar' ? 'var(--income)' : '#2563EB', 4000);
    if (mode === 'criar') dbSave(); else render();
  } catch(e) {
    const msgs = {
      'auth/invalid-credential':    'E-mail ou senha incorretos.',
      'auth/user-not-found':        'Usuário não encontrado.',
      'auth/wrong-password':        'Senha incorreta.',
      'auth/invalid-email':         'E-mail inválido.',
      'auth/too-many-requests':     'Muitas tentativas. Aguarde.',
      'auth/email-already-in-use':  'Este e-mail já está em uso.',
      'auth/weak-password':         'Senha muito fraca (mín. 6 caracteres).',
    };
    if (errEl) { errEl.style.display='block'; errEl.textContent = msgs[e.code] || 'Erro: ' + e.message; }
    if (btn) { btn.textContent = mode === 'criar' ? 'Criar conta nova' : 'Entrar'; btn.disabled = false; }
  }
}




async function fbPush() {
  // "Salvar local" = exporta os dados para arquivo no computador do usuário
  const btn = document.querySelector('#fb-modal-overlay button[onclick="fbPush()"]');
  if (btn) { btn.textContent = '⏳ Salvando…'; btn.disabled = true; }

  const suggestedName = 'financas_' + localDate() + '.json';
  const payload = {};
  DB_FIELDS.forEach(k => { payload[k] = A[k]; });
  payload._savedAt = new Date().toISOString();
  const json = JSON.stringify(payload, null, 2);

  try {
    // Abre o seletor nativo "Salvar como" se disponível
    if (window.showSaveFilePicker) {
      const fileHandle = await window.showSaveFilePicker({
        suggestedName,
        types: [{ description: 'Arquivo de dados JSON', accept: { 'application/json': ['.json'] } }]
      });
      const writable = await fileHandle.createWritable();
      await writable.write(json);
      await writable.close();
      document.getElementById('fb-modal-overlay')?.remove();
      toast('💾 Arquivo salvo: ' + fileHandle.name, 'var(--income)', 4000);
    } else {
      // Fallback: download direto pelo browser
      const blob = new Blob([json], { type: 'application/json' });
      const url  = URL.createObjectURL(blob);
      const a    = document.createElement('a');
      a.href = url; a.download = suggestedName;
      document.body.appendChild(a); a.click();
      setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1000);
      document.getElementById('fb-modal-overlay')?.remove();
      toast('💾 Download iniciado: ' + suggestedName, 'var(--income)', 4000);
    }
  } catch(e) {
    if (e.name === 'AbortError') {
      // Usuário cancelou o seletor — silencioso
    } else {
      console.error('fbPush (salvar local) error:', e);
      toast('Erro ao salvar arquivo: ' + (e.message || 'erro desconhecido'), 'var(--expense)', 5000);
    }
    if (btn) { btn.textContent = '⬆️ Salvar local'; btn.disabled = false; }
  }
}

async function fbPull() {
  if (!window._fbUser) return;
  if (!window._fb) { toast('Firebase não inicializado.', 'var(--expense)'); return; }

  // Confirmação visual dentro do modal
  const btn = document.querySelector('#fb-modal-overlay button[onclick="fbPull()"]');
  if (btn && !btn.dataset.confirming) {
    btn.dataset.confirming = '1';
    btn.textContent = '⚠️ Confirmar? Dados locais serão substituídos!';
    btn.style.background = '#D97706';
    btn.style.color = '#fff';
    btn.style.border = 'none';
    setTimeout(() => {
      if (btn) {
        btn.dataset.confirming = '';
        btn.textContent = '⬇️ Carregar nuvem';
        btn.style.background = '';
        btn.style.color = '#2563EB';
        btn.style.border = '1px solid #BFDBFE';
      }
    }, 4000);
    return;
  }

  if (btn) { btn.textContent = '⏳ Baixando...'; btn.disabled = true; }
  try {
    const data = await window._fb.load(window._fbUser.uid);
    if (!data) { toast('Nenhum dado encontrado na nuvem.', '#D97706', 4000); if(btn){btn.textContent='⬇️ Carregar nuvem';btn.disabled=false;btn.dataset.confirming='';} return; }

    // Aplica os dados na memória
    DB_FIELDS.forEach(k => { if (data[k] !== undefined) A[k] = data[k]; });
    _runContentSchemaMigrations();

    // Tenta abrir seletor de local de salvamento (File System Access API)
    const suggestedName = 'financas_' + localDate() + '.json';
    if (window.showSaveFilePicker) {
      try {
        const fileHandle = await window.showSaveFilePicker({
          suggestedName,
          types: [{ description: 'Arquivo de dados PFP', accept: { 'application/json': ['.json'] } }]
        });
        // Grava a cópia no arquivo escolhido (sem vincular) e salva internamente
        const payload = {};
        DB_FIELDS.forEach(k => { payload[k] = A[k]; });
        payload._savedAt = new Date().toISOString();
        const w = await fileHandle.createWritable();
        await w.write(JSON.stringify(payload));
        await w.close();
        dbSave();
        document.getElementById('fb-modal-overlay')?.remove();
        render();
        toast('⬇️ Dados salvos em: ' + (fileHandle.name || suggestedName), '#2563EB', 5000);
        _updateDbStatus();
        return;
      } catch(e2) {
        if (e2.name === 'AbortError') {
          // Usuário cancelou o seletor — encerra sem fazer nada
          if (btn) { btn.textContent = '⬇️ Baixar dados da Nuvem → Local'; btn.disabled = false; btn.dataset.confirming = ''; }
          return;
        } else {
          console.warn('fbPull showSaveFilePicker error:', e2);
          // Continua para fallback de download
        }
      }
    }

    // Fallback: gera download via <a> (o browser pergunta o local se configurado para isso)
    try {
      const payload = {};
      DB_FIELDS.forEach(k => { payload[k] = A[k]; });
      payload._savedAt = new Date().toISOString();
      const blob = new Blob([JSON.stringify(payload)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = suggestedName;
      document.body.appendChild(a);
      a.click();
      setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1000);
      document.getElementById('fb-modal-overlay')?.remove();
      dbSave();
      render();
      toast('⬇️ Dados baixados: ' + suggestedName, '#2563EB', 4000);
    } catch(e3) {
      console.warn('fbPull download fallback error:', e3);
      // Último recurso: salva apenas no armazenamento interno
      document.getElementById('fb-modal-overlay')?.remove();
      dbSave();
      render();
      toast('⬇️ Dados restaurados da nuvem com sucesso!', '#2563EB', 4000);
    }
  } catch(e) {
    if (btn) { btn.textContent = '⬇️ Baixar dados da Nuvem → Local'; btn.disabled = false; btn.dataset.confirming = ''; }
    console.error('fbPull error:', e);
    toast('Erro ao baixar: ' + (e.message || e.code || 'erro desconhecido'), 'var(--expense)', 5000);
  }
}

const _EXTRATO_PREFIXOS = /^(?:(?:pix|ted|doc|tef|transf\w*|transferencia\w*|enviad[oa]|recebid[oa]|qrs|qr ?code|int|internet|mobile|mobilepag|pag|pagto|pagamento|tit|boleto|sispag|deb\w*|debito|aut\w*|automatico|cred\w*|credito|compra|cartao|visa|elo|master\w*|maestro|electron|cielo|da|de|do|em|no|na|para|p\/|-|\/)\s+)+/;
// Descrição "limpa" para comparar com o histórico: sem prefixo do banco, datas, códigos e parcelas
function _descLimpa(desc){
  let d=_normTxt(_regraLimparTexto(desc||''))
    .replace(/\d{2}\/\d{2}(?:\/\d{2,4})?\s*$/,'')   // "LUZINET06/05" → "LUZINET"
    .replace(/[\/*#|]+/g,' ').replace(/\s+/g,' ').trim();
  const sem=d.replace(_EXTRATO_PREFIXOS,'').trim();
  return sem||d;
}
// Categoria pela palavra-chave padrão (tipo precisa bater; se a categoria do id não existir mais, procura pelo nome)
function _catPorPalavra(desc,tipo){
  const d=' '+_normTxt(desc||'').replace(/[\/*#|.,]+/g,' ').replace(/\s+/g,' ')+' ';
  for(const rule of CSV_CAT_MAP){
    if(rule.tipo!==tipo||!rule.pat.test(d)) continue;
    let c=rule.soNome?null:_catById(rule.catId);
    if(!c||c.tipo!==tipo) c=A.cats.find(x=>x.tipo===tipo&&rule.nomes.some(n=>_normTxt(x.name)===_normTxt(n)))||null;
    if(c) return c.id;
  }
  return null;
}

// ── Regras de categoria: "se a descrição contém X → categoria Y" ──
const REGRA_MODOS={contem:'contém',comeca:'começa com',igual:'é igual a'};
function _regras(){ if(!Array.isArray(A.catRegras)) A.catRegras=[]; return A.catRegras; }
// tira o "(8/10)", "Parcela 8/10" e espaços extras do fim — a regra vale para todas as parcelas
function _regraLimparTexto(t){ return String(t||'').replace(/\s*[-–]?\s*(?:parc(?:ela)?\.?\s*)?\(?\s*\d{1,2}\s*(?:\/|de)\s*\d{1,2}\s*\)?\s*$/i,'').replace(/\s+/g,' ').trim(); }
function _regraNorm(t){ return _normTxt(t).replace(/\s+/g,' ').trim(); }
function _regraBate(r,descNorm){
  const t=_regraNorm(r.texto); if(!t) return false;
  if(r.modo==='comeca') return descNorm.startsWith(t);
  if(r.modo==='igual') return _regraNorm(_regraLimparTexto(descNorm))===t;
  return descNorm.includes(t);
}
// Regra mais específica (texto mais longo) ganha; respeita o tipo (despesa/receita) quando informado
function _catPorRegra(desc,tipo){
  const d=_regraNorm(desc); if(!d) return null;
  const lista=_regras().filter(r=>r.ativa!==false).slice().sort((a,b)=>_regraNorm(b.texto).length-_regraNorm(a.texto).length);
  for(const r of lista){
    const c=_catById(r.catId); if(!c) continue;
    if(tipo&&c.tipo!==tipo) continue;
    if(_regraBate(r,d)) return {catId:c.id,regra:r};
  }
  return null;
}
// Membro da família pela regra (a mais específica que tenha membro gravado)
function _famPorRegra(desc,tipo){
  const d=_regraNorm(desc); if(!d) return null;
  const nomes=famNames();
  const lista=_regras().filter(r=>r.ativa!==false&&r.familia&&nomes.includes(r.familia)).slice().sort((a,b)=>_regraNorm(b.texto).length-_regraNorm(a.texto).length);
  for(const r of lista){
    const c=_catById(r.catId);
    if(tipo&&c&&c.tipo!==tipo) continue;
    if(_regraBate(r,d)) return {familia:r.familia,regra:r};
  }
  return null;
}
function _regraUsos(r){ const d=x=>_regraNorm(x.desc||''); return (A.txs||[]).filter(t=>t.type!=='transferencia'&&_regraBate(r,d(t))).length; }
function _catEhOutros(id){ const c=_catById(id); return !c||_normTxt(c.name)==='outros'; }

function _rgForm(){ if(!A.rgForm) A.rgForm={id:null,texto:'',modo:'contem',catId:null,familia:''}; if(A.rgForm.familia===undefined) A.rgForm.familia=''; return A.rgForm; }
function rgSalvar(){
  const f=_rgForm(); const texto=_regraLimparTexto(f.texto);
  if(!texto){ toast('Digite o texto que deve aparecer na descrição.','var(--expense)'); document.getElementById('rg-texto')?.focus(); return; }

  const setFam=r=>{ if(fam) r.familia=fam; else delete r.familia; };
  const igual=_regras().find(r=>r.id!==f.id&&_regraNorm(r.texto)===_regraNorm(texto)&&r.modo===f.modo);

  else if(f.id){ const r=_regras().find(x=>x.id===f.id); if(r){ r.texto=texto; r.modo=f.modo; r.catId=catOk?f.catId:null; setFam(r); delete r.auto; } toast('Regra atualizada.'); }

  A.rgForm={id:null,texto:'',modo:f.modo,catId:f.catId,familia:fam};

}
function rgEditar(id){ const r=_regras().find(x=>x.id===id); if(!r) return; A.rgForm={id:r.id,texto:r.texto,modo:r.modo||'contem',catId:r.catId,familia:r.familia||''}; render(); setTimeout(()=>{const i=document.getElementById('rg-texto'); if(i){i.focus(); i.select();}},30); }
function rgCancelar(){ A.rgForm={id:null,texto:'',modo:'contem',catId:null,familia:''}; render(); }
function rgApagar(id){

// ── Na revisão da importação: criar regra a partir de uma linha ──
const RG_AUTO_KEY='pfp_rg_auto';
function _rgAutoLigado(){ try{ return localStorage.getItem(RG_AUTO_KEY)!=='0'; }catch(e){ return true; } }
function _rgAutoSet(v){ try{ localStorage.setItem(RG_AUTO_KEY,v?'1':'0'); }catch(e){} }
const RG_ORIGEM={ia:'sugestão da IA',historico:'histórico de lançamentos',palavra:'palavra-chave padrão',planilha:'categoria da planilha',manual:'escolha na revisão'};
// Texto da regra a partir da descrição: corta no 1º código/número longo (ex.: "JIM.COM 55021848 VICTOR S" → "JIM.COM")
function _regraTextoAuto(desc){
  const base=_regraLimparTexto(desc).replace(/(\D)\d{2}\/\d{2}(?:\/\d{2,4})?\s*$/,'$1').trim();
  const toks=base.split(' '); const out=[];
  for(const t of toks){ if((t.match(/\d/g)||[]).length>=4) break; out.push(t); }
  let txt=out.join(' ').replace(/[\s\-–*#.,:;\/]+$/,'').trim();
  if(_regraNorm(txt).replace(/[^a-z0-9]/g,'').length<3) txt=base;
  // só prefixo de banco ("PIX TRANSF", "INT", "MOBILE PAG TIT") pegaria tudo: usa a descrição inteira
  if(_normTxt(txt+' ').replace(/[\/*#|]+/g,' ').replace(_EXTRATO_PREFIXOS,'').replace(/[^a-z0-9]/g,'').length<3) txt=base;
  return txt;
}
// Quais linhas da revisão viram regra nova (categoria achada sem regra, e diferente de "Outros")
function _rgAutoPlano(){
  const s=_csvState; if(!s||!s.rows) return [];
  const plano=[]; const vistos=new Set();
  s.rows.forEach((r,i)=>{
    if(!s.selected.has(i)||r.isTransf) return;
    const tipo=r.val>=0?'receita':'despesa';
    // categoria: achada sem regra e diferente de "Outros"
    let catId=null, origem=null, conflito=null;
    const origemC=r._catManual?'manual':r.catOrigem; const c=_catById(r.catId);
    const ja=_catPorRegra(r.desc,tipo);
    if(origemC&&origemC!=='regra'&&!_catEhOutros(r.catId)&&c&&c.tipo===tipo&&!(ja&&ja.catId===r.catId)){ catId=r.catId; origem=origemC; conflito=ja?ja.regra:null; }
    // membro da família: gravado junto com a regra nova, ou quando você escolheu/veio do portador
    let familia=null; const fam=r.fam||'';
    const jaF=_famPorRegra(r.desc,tipo);
    if(fam&&famNames().includes(fam)&&!(jaF&&jaF.familia===fam)&&(r._famManual||(catId&&r.famOrigem!=='portador'))) familia=fam;
    if(!catId&&!familia) return;
    // só o membro mudou e a categoria veio de uma regra: grava o membro nessa mesma regra
    const regraId=(!catId&&ja&&ja.regra)?ja.regra.id:null;
    const texto=regraId?ja.regra.texto:_regraTextoAuto(r.desc); const k=_regraNorm(texto); if(!k||vistos.has(k)) return; vistos.add(k);
    plano.push({texto,catId,familia,regraId,origem:origem||'manual',exemplo:r.desc,conflito});
  });
  return plano;
}
function _rgAutoCriar(plano,fonte){
  let novas=0, atualizadas=0;
  plano.forEach(p=>{
    const igual=p.regraId?_regras().find(x=>x.id===p.regraId):_regras().find(x=>_regraNorm(x.texto)===_regraNorm(p.texto)&&(x.modo||'contem')==='contem');
    if(igual){
      let mudou=false;
      if(p.catId&&igual.catId!==p.catId){ igual.catId=p.catId; mudou=true; }
      if(p.familia&&igual.familia!==p.familia){ igual.familia=p.familia; mudou=true; }
      if(mudou){ igual.auto=true; igual.origem=p.origem; igual.criadaEm=today(); igual.fonte=fonte; igual.exemplo=p.exemplo; atualizadas++; }
      return;
    }
    _regras().push({id:A.nid++,texto:p.texto,modo:'contem',catId:p.catId||null,...(p.familia?{familia:p.familia}:{}),ativa:true,auto:true,origem:p.origem,criadaEm:today(),fonte,exemplo:p.exemplo});
    novas++;
  });
  return {novas,atualizadas};
}
function rgConfirmar(id){ const r=_regras().find(x=>x.id===id); if(r){ delete r.auto; toast('Regra confirmada.'); render(); } }
function rgConfirmarTodas(){ let n=0; _regras().forEach(r=>{ if(r.auto){ delete r.auto; n++; } }); toast(`${n} regra(s) confirmada(s).`); render(); }
function _csvCriarRegra(i){
  const r=_csvState.rows[i]; if(!r) return;
  const tipo=r.val>=0?'receita':'despesa';
  const temCat=!_catEhOutros(r.catId); const fam=(r.fam&&famNames().includes(r.fam))?r.fam:'';
  if(!temCat&&!fam){ toast('Escolha a categoria ou o membro desta linha primeiro; depois clique em ⚡ para lembrar.','var(--amber)',4500); return; }
  const texto=_regraLimparTexto(r.desc);
  let reg=_regras().find(x=>_regraNorm(x.texto)===_regraNorm(texto)&&(x.modo||'contem')==='contem');
  if(!reg){ reg={id:A.nid++,texto,modo:'contem',catId:null,ativa:true}; _regras().push(reg); }
  if(temCat) reg.catId=r.catId;
  if(fam) reg.familia=fam; else delete reg.familia;
  // aplica nas outras linhas desta importação que você não mexeu
  let n=0; _csvState.rows.forEach((o,k)=>{ if(k===i) return; const tp=o.val>=0?'receita':'despesa'; let mexeu=false;
    if(!o._catManual){ const m=_catPorRegra(o.desc,tp); if(m&&m.regra.id===reg.id&&o.catId!==m.catId){ o.catId=m.catId; o.regraTxt=reg.texto; mexeu=true; } }
    if(!o._famManual&&reg.familia){ const mf=_famPorRegra(o.desc,tp); if(mf&&mf.regra.id===reg.id&&o.fam!==mf.familia){ o.fam=mf.familia; o.famOrigem='regra'; mexeu=true; } }
    if(mexeu) n++; });
  if(temCat) r.regraTxt=reg.texto;
  if(fam){ r.famOrigem='regra'; }
  scheduleSave(); _renderCsvModal();
  toast(`Regra salva: contém “${texto}” → ${[reg.catId?_catNomeCompleto(_catById(reg.catId)):'',fam?'👤 '+fam:''].filter(Boolean).join(' · ')}${n?` · ${n} outra(s) linha(s) ajustada(s)`:''}. Edite em Categorias › Regras.`,'var(--income)',5000);
}

function csvGuessCategory(desc, val) {
  const d = desc || '';
  const tipo = val >= 0 ? 'receita' : 'despesa';
  // 1º: suas regras (Categorias › Regras)
  const _rg = _catPorRegra(d, tipo);
  if (_rg) return { catId: _rg.catId, isTransf: false, regraTxt: _rg.regra.texto };
  // 2º: palavra-chave padrão (na descrição inteira e na descrição sem o prefixo do banco)
  const pc = _catPorPalavra(d, tipo) || _catPorPalavra(_descLimpa(d), tipo);
  if (pc) return { catId: pc, isTransf: false, palavra: true };
  // Fallback: 'Outros' do tipo
  const defCat = A.cats.find(c => c.tipo === tipo && _normTxt(c.name) === 'outros') || A.cats.find(c => c.tipo === tipo);
  return { catId: defCat ? defCat.id : null, isTransf: false };
}

/* ═══ Categorização automática — a MESMA cadeia para fatura PDF, extrato e planilha ═══
   1. Regra sua (Categorias › Regras)       — sempre ganha
   2. Categoria escrita na própria planilha  — se o nome bater com uma categoria sua
   3. IA (Claude), quando ligada              — PDF: vem junto da leitura; extrato/planilha: só as descrições são enviadas
   4. Histórico                               — mesma categoria do último lançamento parecido
   5. Palavra-chave padrão                    — mercado, posto, Sabesp, rendimento...
   6. "Outros"                                                                                    */
const CAT_ORIGEM_INFO={
  regra:{ic:'⚡',txt:'regra',tit:'Pela sua regra de categorização'},
  planilha:{ic:'📄',txt:'planilha',tit:'Categoria que já veio escrita no arquivo'},
  ia:{ic:'✨',txt:'IA',tit:'Sugerida pelo Claude'},
  historico:{ic:'🕘',txt:'histórico',tit:'Mesma categoria de um lançamento parecido que você já tem'},
  palavra:{ic:'🔤',txt:'palavra-chave',tit:'Pela palavra-chave padrão'},
  manual:{ic:'✋',txt:'você',tit:'Escolhida por você'}
};
function _aplicarAutoCat(rows){
  _histCache=null;
  const cont={regra:0,planilha:0,ia:0,historico:0,palavra:0,nenhuma:0};
  rows.forEach(r=>{
    const tipo=r.val>=0?'receita':'despesa';
    const ok=id=>{ const c=_catById(id); return c&&c.tipo===tipo&&!_catEhOutros(id)?id:null; };
    const g=csvGuessCategory(r.desc,r.val);
    delete r.regraTxt; r.isTransf=false;
    let catId=null, origem=null;
    if(g.regraTxt){ catId=g.catId; origem='regra'; r.regraTxt=g.regraTxt; }
    else if(ok(r.catPlanilha)){ catId=r.catPlanilha; origem='planilha'; }
    else if(ok(r.catIA)){ catId=r.catIA; origem='ia'; }
    else { const h=ok(_catAprendida(r.desc,tipo)); if(h){ catId=h; origem='historico'; }
      else if(g.palavra){ catId=g.catId; origem='palavra'; }
      else catId=g.catId; }
    r.catId=catId; r.catOrigem=origem; cont[origem||'nenhuma']++;
  });
  return cont;
}

// ── Parsers de formatos conhecidos ──
// Texto salvo em UTF-8 e relido como Latin-1 ("DISPONÃVEL") → volta ao normal
function _fixMojibake(t){ t=String(t||''); if(!/Ã[\u0080-¿]|Â[\u0080-¿]/.test(t)) return t; try{ return decodeURIComponent(escape(t)); }catch(e){ return t; } }
function csvDetectAndParse(text) {
  const res = _csvDetectAndParse(text);
  res.rows.forEach(r => { r.desc = _fixMojibake(r.desc).replace(/\s+/g, ' ').trim(); if (r.familia) r.familia = _fixMojibake(r.familia); });
  return res;
}
function _csvDetectAndParse(text) {
  // Remove BOM UTF-8 se presente
  text = text.replace(/^﻿/, '');
  const lines = text.trim().split(/\r?\n/).filter(l => l.trim());
  if (!lines.length) return { rows: [], format: 'desconhecido' };

  // Itaú conta corrente: tem metadados no topo, depois header "data,lançamento,...,valor (R$),saldos (R$)"
  const itauHeaderIdx = lines.findIndex(l => /data.*lan.*amento.*valor/i.test(l));
  if (itauHeaderIdx >= 0) {
    const futuros = { n: 0 };
    const rows = csvParseItau(lines, itauHeaderIdx, futuros);
    if (rows.length) return { rows, format: 'Itaú (conta corrente)', futuros: futuros.n };
  }

  const h = lines[0].toLowerCase();

  // Fatura cartão: "Data;Estabelecimento;Portador;Valor;Parcela"
  if (h.includes('estabelecimento') && h.includes('portador')) {
    return { rows: csvParseFaturaCartao(lines), format: 'Fatura Cartão (Itaú/Bradesco)' };
  }
  // Nubank cartão: "date,category,title,amount"
  if (h.includes('date') && h.includes('category') && h.includes('title') && h.includes('amount')) {
    return { rows: csvParseNubankCartao(lines), format: 'Nubank (cartão)' };
  }
  // Qualquer planilha: acha a linha de cabeçalho e as colunas (data, descrição, valor ou débito/crédito, tipo, categoria)
  const tab = csvParseTabela(lines);
  if (tab && tab.rows.length) return tab;
  // Nubank conta: "Data,Descrição,Valor"  (pt-BR, sem category)
  if ((h.includes('data') && h.includes('descri') && h.includes('valor')) && !h.includes('category')) {
    return { rows: csvParseGeneric(lines, { dateCol: 0, descCol: 1, valCol: 2, sep: ',', dateFormat: 'dmy' }), format: 'Nubank (conta)' };
  }
  // Inter: "Data Lançamento;Histórico;Descrição;Valor"
  if (h.includes('hist') && (h.includes(';') || h.includes('lançamento'))) {
    return { rows: csvParseInter(lines), format: 'Banco Inter' };
  }
  // BB/Bradesco/genérico com ponto-e-vírgula
  if (h.includes(';')) {
    return { rows: csvParseSemicolon(lines), format: 'Genérico (;)' };
  }
  // Genérico vírgula
  return { rows: csvParseGeneric(lines, { dateCol: 0, descCol: 1, valCol: 2, sep: ',', dateFormat: 'auto' }), format: 'Genérico (,)' };
}

// ── Planilha qualquer (controle de finanças, extrato de outro banco, export de app) ──
// Procura nas primeiras 40 linhas um cabeçalho com data + descrição + (valor | débito/crédito).
// Entende também colunas de tipo (Receita/Despesa, Entrada/Saída, D/C), categoria/subcategoria e membro.
const _TAB_COLS = {
  data:  /^(data|date|dt|dia)\b|data (do |da |de )?(lancamento|movimento|movimentacao|compra|transacao|pagamento)|^vencimento$/,
  desc:  /descri|historico|^lancamento$|estabelecimento|^title$|memo|detalhe|^item$|^nome$|favorecido|beneficiario|^local$|^o que/,
  valor: /^valor|amount|quantia|montante|^r\$|^total$|^gasto|^preco/,
  deb:   /debito|^saida|^saidas|despesa$|^despesas$|retirada|^pago$/,
  cred:  /credito|^entrada|^entradas|receita$|^receitas$|deposito|^recebido$/,
  tipo:  /^tipo|natureza|^d\/c$|^dc$|^c\/d$|entrada\/saida|^movimento$|^operacao$/,
  cat:   /^categoria|^category|classifica|^grupo$|^conta contabil/,
  sub:   /^sub ?categoria|^subcategory/,
  membro:/^membro|^pessoa|responsavel|^portador|^titular|^quem/,
};
function _tabSep(l){ const c={';':(l.match(/;/g)||[]).length,'\t':(l.match(/\t/g)||[]).length,',':(l.match(/,/g)||[]).length}; return Object.keys(c).sort((a,b)=>c[b]-c[a])[0]; }
function _tabValor(str){
  if (str == null) return null; let t = String(str).trim(); if (!t) return null;
  let neg = false;
  if (/^\(.*\)$/.test(t)) { neg = true; t = t.slice(1, -1); }
  const dc = t.match(/\s*([DC])$/i); if (dc) { if (dc[1].toUpperCase() === 'D') neg = true; t = t.slice(0, -1); }

function _tabCat(nome, sub, tipo){

        || (a.includes(' › ') ? A.cats.find(c => c.tipo === tp && n(c.name) === a.split(' › ').pop()) : null);

function csvParseTabela(lines) {

    const cells = csvSplit(lines[i], sp).map(c => _normTxt(c).replace(/\s+/g, ' ').trim());
    const ach = {};
    Object.keys(_TAB_COLS).forEach(k => { const j = cells.findIndex((c, ix) => c && _TAB_COLS[k].test(c) && !Object.values(ach).includes(ix) && !(k === 'valor' && /saldo/.test(c)) && !(k === 'cat' && _TAB_COLS.sub.test(c))); if (j >= 0) ach[k] = j; });
    if (ach.data >= 0 && ach.desc >= 0 && (ach.valor >= 0 || ach.deb >= 0 || ach.cred >= 0)) { hi = i; sep = sp; col = ach; break; }
  }
  if (hi < 0) return null;
  const brutas = [];
  for (let i = hi + 1; i < lines.length; i++) {
    const c = csvSplit(lines[i], sep);

    const date = csvParseDate(String(c[col.data] || '').trim().replace(/^(\d)(?=[\/.-])/, '0$1').replace(/^(\d{2})([\/.-])(\d)(?=[\/.-])/, '$1$2' + '0$3').replace(/^(\d{2})[.-](\d{2})[.-](\d{2,4})/, '$1/$2/$3'));

    else if (semSinal) {

}

// Parser fatura de cartão: Data;Estabelecimento;Portador;Valor;Parcela
function csvParseFaturaCartao(lines) {
  const rows = [];
  for (let i = 1; i < lines.length; i++) {
    const cols = csvSplit(lines[i], ';');
    if (cols.length < 4) continue;
    const date = csvParseDate(cols[0]);
    if (!date) continue;
    const estabelecimento = (cols[1] || '').trim();
    const portador = (cols[2] || '').trim();
    const parcela = (cols[4] || '').trim();
    // Monta descrição com parcela se houver
    const parcelaInfo = (parcela && parcela !== '-' && parcela !== '') ? ` (${parcela})` : '';
    const desc = estabelecimento + parcelaInfo;
    // Valor: "R$ 1.234,56" ou "R$ -1.234,56"
    const val = csvParseVal(cols[3]);
    if (val === null || !desc) continue;
    // Ignora pagamentos de fatura (valores negativos = crédito/pagamento)
    if (val < 0) continue;
    const row = { date, desc, val: -val }; // cartão = despesa (negativo)
    if (portador) row.familia = portador;
    rows.push(row);
  }
  return rows;
}

// Parser Itaú conta corrente
// Header: data,lançamento,ag./origem,valor (R$),saldos (R$)
// Linhas de saldo/anterior devem ser ignoradas
const ITAU_SKIP = /saldo\s*(total|anterior|disponível|dia)|^,+$|lançamentos/i;
function csvParseItau(lines, headerIdx, futuros) {
  const rows = [];
  // Detecta separador do header
  const headerLine = lines[headerIdx];
  const sep = headerLine.includes(';') ? ';' : ',';
  const header = csvSplit(headerLine.toLowerCase(), sep);
  const dateCol  = header.findIndex(h => /^data/.test(h.trim()));
  const descCol  = header.findIndex(h => /lan.*amento|descri|histórico|hist/.test(h.trim()));
  const valCol   = header.findIndex(h => /valor/.test(h.trim()));

  for (let i = headerIdx + 1; i < lines.length; i++) {
    const line = lines[i];
    // "lançamentos futuros / saídas futuras": agendamentos que ainda não aconteceram — ficam de fora
    if (/^[,;\s"]*(lan\S*amentos futuros|sa\S*das futuras|entradas futuras)/i.test(line)) {
      if (futuros) futuros.n = lines.slice(i + 1).filter(l => /^[\s"]*\d{2}\/\d{2}\/\d{4}/.test(l)).length;
      break;
    }
    if (!line.trim() || ITAU_SKIP.test(_fixMojibake(line))) continue;
    const cols = csvSplit(line, sep);
    const date = csvParseDate(cols[dateCol >= 0 ? dateCol : 0]);
    const desc = (cols[descCol >= 0 ? descCol : 1] || '').trim();
    // Valor: coluna específica; ignora coluna de saldo
    let rawVal = (cols[valCol >= 0 ? valCol : 3] || '').trim();
    // Itaú às vezes tem valor na col 3 e saldo na col 4; ignora se rawVal vazio
    if (!rawVal) continue;
    const val = csvParseVal(rawVal);
    if (!date || val === null || val === 0 || !desc) continue;
    rows.push({ date, desc, val });
  }
  return rows;
}

function csvSplit(line, sep) {
  // Respeita aspas
  const result = [];
  let cur = '', inQ = false;
  for (let i = 0; i < line.length; i++) {
    const c = line[i];
    if (c === '"') { inQ = !inQ; continue; }
    if (c === sep && !inQ) { result.push(cur.trim()); cur = ''; continue; }
    cur += c;
  }
  result.push(cur.trim());
  return result;
}

function csvParseDate(str) {
  if (!str) return null;
  str = str.trim();
  // yyyy-mm-dd
  if (/^\d{4}-\d{2}-\d{2}/.test(str)) return str.slice(0, 10);
  // dd/mm/yyyy or dd/mm/yy
  const dm = str.match(/^(\d{2})\/(\d{2})\/(\d{2,4})/);
  if (dm) {
    let y = dm[3]; if (y.length === 2) y = '20' + y;
    return `${y}-${dm[2]}-${dm[1]}`;
  }
  // mm/dd/yyyy (americano)
  const md = str.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  if (md) return `${md[3]}-${md[1].padStart(2,'0')}-${md[2].padStart(2,'0')}`;
  return null;
}

function csvParseVal(str) {
  if (!str && str !== 0) return null;
  // Remove R$, espaços, aspas
  str = String(str).replace(/R\$|\s|"/g, '').trim();
  if (!str) return null;
  // Formato BR: 1.234,56 → 1234.56
  if (/\d\.\d{3},/.test(str) || /,\d{2}$/.test(str)) {
    str = str.replace(/\./g, '').replace(',', '.');
  } else {
    // Remove separador de milhar americano se houver
    str = str.replace(/,(?=\d{3})/g, '');
  }
  const n = parseFloat(str);
  return isNaN(n) ? null : n;
}

function csvParseNubankCartao(lines) {
  const rows = [];
  for (let i = 1; i < lines.length; i++) {
    const cols = csvSplit(lines[i], ',');
    if (cols.length < 4) continue;
    const date = csvParseDate(cols[0]);
    const desc = (cols[2] || cols[1] || '').trim();
    const val = csvParseVal(cols[3]);
    if (!date || val === null) continue;
    rows.push({ date, desc, val: -Math.abs(val) }); // cartão = sempre despesa
  }
  return rows;
}

function csvParseInter(lines) {
  const rows = [];
  const sep = ';';
  // Detecta colunas pelo header
  const header = csvSplit(lines[0].toLowerCase(), sep);
  const dIdx = header.findIndex(h => h.includes('data'));
  const descIdx = header.findIndex(h => h.includes('descri') || h.includes('hist'));
  const valIdx = header.findIndex(h => h.includes('valor'));
  const tipoIdx = header.findIndex(h => h.includes('tipo') || h.includes('dc') || h.includes('crédito') || h.includes('débito'));
  for (let i = 1; i < lines.length; i++) {
    const cols = csvSplit(lines[i], sep);
    const date = csvParseDate(cols[dIdx]);
    const desc = (cols[descIdx] || '').trim();
    let val = csvParseVal(cols[valIdx]);
    if (!date || val === null) continue;
    // Alguns bancos têm coluna de tipo D/C
    if (tipoIdx >= 0) {
      const tipo = (cols[tipoIdx] || '').trim().toUpperCase();
      if (tipo === 'D' || tipo === 'DEB' || tipo.includes('DÉB')) val = -Math.abs(val);
      else if (tipo === 'C' || tipo === 'CRE' || tipo.includes('CRÉ')) val = Math.abs(val);
    }
    rows.push({ date, desc, val });
  }
  return rows;
}

function csvParseSemicolon(lines) {
  return csvParseGeneric(lines, { dateCol: 0, descCol: 1, valCol: 2, sep: ';', dateFormat: 'auto' });
}

function csvParseGeneric(lines, { dateCol, descCol, valCol, sep, dateFormat }) {
  const rows = [];
  for (let i = 1; i < lines.length; i++) {
    const cols = csvSplit(lines[i], sep);
    const date = csvParseDate(cols[dateCol]);
    const desc = (cols[descCol] || '').trim();
    const val = csvParseVal(cols[valCol]);
    if (!date || val === null || !desc) continue;
    rows.push({ date, desc, val });
  }
  return rows;
}

/* ═══════════ IA: LEITURA DE FATURA EM PDF ═══════════
   Dois modos:
   • "Leitura no aparelho" (padrão): extrai o texto do PDF com pdf.js e um
     analisador reconhece data, descrição, parcela e valor de cada compra.
     Nada sai do navegador. Funciona com PDFs de texto (os que o banco gera).
   • "Claude (Anthropic)": envia o PDF para a API do Claude com a chave do
     próprio usuário. Lê também PDFs escaneados e sugere a categoria.
   O resultado sempre passa pela tela de revisão antes de virar lançamento. */
const PDFJS_URL='https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js';
const PDFJS_SRI='sha384-/1qUCSGwTur9vjf/z9lmu/eCUYbpOTgSjmpbMQZ1/CtX2v/WcAIKqRv+U1DUCG6e';
const PDFJS_WORKER='https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
const IA_CFG_KEY='pfp_ia_cfg';
const IA_MODELOS=[['claude-haiku-4-5-20251001','Claude Haiku 4.5 — rápido e barato'],['claude-sonnet-5-5','Claude Sonnet 5.5 — mais preciso']];
function iaCfg(){try{return Object.assign({motor:'local',chave:'',modelo:IA_MODELOS[0][0]},JSON.parse(localStorage.getItem(IA_CFG_KEY)||'{}'));}catch(e){return {motor:'local',chave:'',modelo:IA_MODELOS[0][0]};}}
function iaSalvar(patch){try{localStorage.setItem(IA_CFG_KEY,JSON.stringify(Object.assign(iaCfg(),patch)));}catch(e){}}

let _pdfjsPromise=null;
function _carregarPdfjs(){
  if(window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
  if(_pdfjsPromise) return _pdfjsPromise;
  _pdfjsPromise=new Promise((ok,erro)=>{
    const sc=document.createElement('script'); sc.src=PDFJS_URL; sc.integrity=PDFJS_SRI; sc.crossOrigin='anonymous';
    sc.onload=()=>{ try{ window.pdfjsLib.GlobalWorkerOptions.workerSrc=PDFJS_WORKER; ok(window.pdfjsLib);}catch(e){ _pdfjsPromise=null; erro(e);} };
    sc.onerror=()=>{ _pdfjsPromise=null; erro(new Error('Não foi possível carregar o leitor de PDF (verifique a internet).')); };
    document.head.appendChild(sc);
  });
  return _pdfjsPromise;
}
// Extrai linhas de texto (agrupando itens pela altura) e separa colunas lado a lado
// Junta os pedaços de uma linha: só põe espaço quando há um vão de verdade entre eles
function _pdfJuntar(seg){
  let out='', fim=null;
  seg.forEach(it=>{
    const t=it.t;
    if(fim!==null){
      const vao=it.x-fim, lim=Math.max(1.2,(it.h||10)*0.18);
      if(vao>lim&&!/\s$/.test(out)&&!/^\s/.test(t)) out+=' ';
    }
    out+=t; fim=it.x+it.w;
  });
  return out.replace(/\s+/g,' ').trim();
}
async function _pdfLinhas(buf){
  const pdfjs=await _carregarPdfjs();
  const doc=await pdfjs.getDocument({data:buf,isEvalSupported:false,enableXfa:false}).promise; // [SEG] CVE-2024-4367
  const linhas=[];
  for(let pn=1;pn<=doc.numPages;pn++){
    const pg=await doc.getPage(pn); const tc=await pg.getTextContent();
    const itens=tc.items.filter(it=>it.str&&it.str.trim()).map(it=>({x:it.transform[4],y:Math.round(it.transform[5]),w:it.width||0,h:Math.abs(it.transform[3])||it.height||10,t:it.str}));
    const grupos=[];
    itens.sort((a,b)=>b.y-a.y||a.x-b.x).forEach(it=>{
      const g=grupos.find(g=>Math.abs(g.y-it.y)<=3); if(g) g.itens.push(it); else grupos.push({y:it.y,itens:[it]});
    });
    grupos.forEach(g=>{
      g.itens.sort((a,b)=>a.x-b.x);
      // quebra a linha em segmentos quando há um vão grande seguido de uma data (fatura em 2 colunas)
      let seg=[], fim=null; const segs=[];
      g.itens.forEach(it=>{
        const vao=fim===null?0:it.x-fim;
        // nova coluna: vem uma data depois de um vão grande, ou depois de um trecho que já terminou em valor
        const fechouValor=seg.length&&_RE_VALOR.test(_pdfJuntar(seg));
        if(seg.length&&_RE_DATA.test(it.t.trim())&&(vao>40||(fechouValor&&vao>8))){ segs.push(seg); seg=[]; }
        seg.push(it); fim=it.x+it.w;
      });
      if(seg.length) segs.push(seg);
      segs.forEach(sg=>linhas.push(_pdfJuntar(sg)));
    });
  }
  return linhas;
}
const _MESES={JAN:1,FEV:2,MAR:3,ABR:4,MAI:5,JUN:6,JUL:7,AGO:8,SET:9,OUT:10,NOV:11,DEZ:12};
const _RE_DATA=/^(\d{1,2})[\/.\-](\d{1,2})(?:[\/.\-](\d{2,4}))?(?=\s|$)|^(\d{1,2})\s*(?:de\s+)?(JAN|FEV|MAR|ABR|MAI|JUN|JUL|AGO|SET|OUT|NOV|DEZ)[A-ZÇ]*\.?(?:\s+(?:de\s+)?(\d{4}))?(?=\s|$)/i;
const _RE_VALOR=/(?:^|\s)(-|−|\+)?\s*(?:R\$\s*)?(-|−)?\s*(\d{1,3}(?:\.\d{3})*,\d{2})\s*(-|−|D|C)?$/i;
const _RE_IGNORAR=/\b(pagamento|pgto|pagto|pag\.?\s*fatura|saldo\s+anterior|saldo\s+em\s+aberto|total|subtotal|limite|fatura\s+anterior|cr[eé]dito\s+de\s+pagamento|valor\s+m[ií]nimo|resumo)\b/i;
function _numBR(s){return parseFloat(String(s).replace(/\./g,'').replace(',','.'));}
// Analisa as linhas e devolve {vencimento, total, itens:[{date,desc,val,parcela,parcelas}], ignorados}
function analisarFaturaTexto(linhas,anoPadrao){
  const texto=linhas.join('\n');
  let venc=null;
  const mv=texto.match(/vencimento[^\d\n]{0,30}(\d{1,2})\s*(?:[\/.\-]|de\s+)?\s*(\d{1,2}|[A-Za-zç]{3,9})\s*(?:[\/.\-]|de\s+)?\s*(\d{4})?/i);
  if(mv){
    const mes=/^\d+$/.test(mv[2])?+mv[2]:_MESES[mv[2].slice(0,3).toUpperCase()];
    const ano=mv[3]?+mv[3]:(anoPadrao||new Date().getFullYear());
    if(mes>=1&&mes<=12) venc=ano+'-'+String(mes).padStart(2,'0')+'-'+String(+mv[1]).padStart(2,'0');
  }
  if(!venc){
    // rótulo "Vencimento" numa linha e a data na linha de baixo
    const mv2=texto.match(/vencimento[\s\S]{0,160}?(\d{1,2})\/(\d{1,2})\/(\d{4})/i);
    if(mv2&&+mv2[2]>=1&&+mv2[2]<=12) venc=mv2[3]+'-'+String(+mv2[2]).padStart(2,'0')+'-'+String(+mv2[1]).padStart(2,'0');
  }
  let total=null;
  const VAL='(-?\\d{1,3}(?:\\.\\d{3})*,\\d{2})';
  const padroesTotal=['valor\\s+total\\s+(?:devido|a\\s+pagar|da\\s+fatura)','total\\s+a\\s+pagar','total\\s+desta\\s+fatura','total\\s+da\\s+fatura(?!\\s+anterior)','fatura\\s+no\\s+valor\\s+de','no\\s+valor\\s+de','total\\s+(?:da|fatura|geral)(?!\\s+(?:da\\s+)?fatura\\s+anterior)'];
  for(const pt of padroesTotal){ const mt=texto.match(new RegExp(pt+'[^\\d\\n\\-]{0,40}'+VAL,'i')); if(mt){ total=_numBR(mt[1]); break; } }
  const anoV=venc?+venc.slice(0,4):(anoPadrao||new Date().getFullYear());
  const mesV=venc?+venc.slice(5,7):12;
  const itens=[]; let ignorados=0;
  // faturas com colunas "R$  US$" (XP, Itaú...): a linha termina com dois valores e o em reais vem antes
  const colunaUSD=/R\s?\$\s+US\s?\$/i.test(texto);
  let titular=null, finalCartao=null;
  linhas.forEach(l=>{
    // cabeçalho de cada cartão (titular/adicional): "NOME DO PORTADOR - 4998********4758"
    const mc=l.match(/^([A-Za-zÀ-ú][A-Za-zÀ-ú .']{2,60}?)\s*[-–]\s*\d{4}\s*[*xX•.\s]{4,}\s*(\d{4})\s*$/);
    if(mc){ titular=mc[1].trim(); finalCartao=mc[2]; return; }
    const md=l.match(_RE_DATA); if(!md) return;
    const resto=l.slice(md[0].length).trim();
    let mval=resto.match(_RE_VALOR); if(!mval) return;
    if(colunaUSD){ const antes=resto.slice(0,mval.index); const m2=antes.match(_RE_VALOR); if(m2) mval=m2; }
    let desc=resto.slice(0,mval.index).trim().replace(/\s*R\$\s*$/,'').trim();
    if(!desc||desc.length<2) return;
    if(_RE_IGNORAR.test(desc)){ ignorados++; return; }
    let dia,mes,ano;
    if(md[1]){dia=+md[1];mes=+md[2];ano=md[3]?(md[3].length===2?2000+ +md[3]:+md[3]):null;}
    else{dia=+md[4];mes=_MESES[md[5].slice(0,3).toUpperCase()];ano=md[6]?+md[6]:null;}
    if(!(mes>=1&&mes<=12&&dia>=1&&dia<=31)) return;
    if(!ano) ano=mes>mesV?anoV-1:anoV;
    // parcela: "02/10", "PARC 02/10", "Parcela 2 de 10"
    let parcela=null,parcelas=null;
    const mp=desc.match(/(?:\bparc(?:ela)?\.?\s*)?(\d{1,2})\s*(?:\/|de)\s*(\d{1,2})\s*$/i)||desc.match(/\bparc(?:ela)?\.?\s*(\d{1,2})\s*(?:\/|de)\s*(\d{1,2})/i);
    if(mp&&+mp[1]>=1&&+mp[1]<=+mp[2]&&+mp[2]>=2&&+mp[2]<=48){
      parcela=+mp[1];parcelas=+mp[2];
      desc=(desc.slice(0,mp.index)+desc.slice(mp.index+mp[0].length)).replace(/[\s\-–]+$/,'').trim();
      desc+=` (${parcela}/${parcelas})`;
    }
    const credito=!!(mval[1]==='-'||mval[1]==='−'||mval[2]||mval[4]==='-'||mval[4]==='−'||(mval[4]||'').toUpperCase()==='C');
    const v=_numBR(mval[3]);
    if(!(v>0)) return;
    itens.push({date:ano+'-'+String(mes).padStart(2,'0')+'-'+String(dia).padStart(2,'0'),desc:desc.replace(/\s+/g,' '),val:credito?v:-v,parcela,parcelas,...(finalCartao?{titular,finalCartao}:{})});
  });
  return {vencimento:venc,total,itens,ignorados};
}

// ── Leitura com Claude (API da Anthropic, chave do usuário) ──
function _b64DeBuffer(buf){let b='';const u=new Uint8Array(buf);for(let i=0;i<u.length;i+=0x8000)b+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(b);}
async function analisarFaturaClaude(buf){
  const cfg=iaCfg(); if(!cfg.chave) throw new Error('Informe sua chave da API do Claude em Configurações → Armazenamento.');
  const cats=A.cats.filter(c=>c.tipo==='despesa').map(c=>c.name);
  const instr=`Você recebe a fatura de um cartão de crédito brasileiro. Extraia TODOS os lançamentos da fatura e responda SOMENTE com JSON válido, sem texto antes ou depois, no formato:
{"vencimento":"AAAA-MM-DD","total":0.00,"lancamentos":[{"data":"AAAA-MM-DD","descricao":"texto","valor":0.00,"parcela":null,"parcelas":null,"tipo":"compra","categoria":"nome"}]}
Regras: "valor" positivo para compras, tarifas, juros e IOF; negativo para estornos e créditos. "tipo" é "compra", "credito", "pagamento" ou "tarifa". Pagamentos da fatura anterior devem vir com tipo "pagamento". Se for compra parcelada, preencha "parcela" (número desta parcela) e "parcelas" (total). Use o ano correto de cada compra (compras de meses anteriores ao vencimento podem ser do ano anterior). "categoria" deve ser exatamente um destes nomes: ${cats.join(', ')}.`;
  const resp=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':cfg.chave,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
    body:JSON.stringify({model:cfg.modelo,max_tokens:8000,messages:[{role:'user',content:[{type:'document',source:{type:'base64',media_type:'application/pdf',data:_b64DeBuffer(buf)}},{type:'text',text:instr}]}]})});
  if(!resp.ok){let m='';try{const j=await resp.json();m=j.error&&j.error.message||'';}catch(e){} throw new Error(resp.status===401?'Chave da API inválida.':('A API do Claude respondeu com erro '+resp.status+(m?': '+m:'')));}
  const j=await resp.json();
  const txt=(j.content||[]).filter(c=>c.type==='text').map(c=>c.text).join('').trim().replace(/^```(?:json)?\s*|\s*```$/g,'');
  let d; try{d=JSON.parse(txt.slice(txt.indexOf('{'),txt.lastIndexOf('}')+1));}catch(e){throw new Error('A resposta do Claude não veio em um formato que o app entende.');}
  let ignorados=0;
  const itens=(d.lancamentos||[]).filter(l=>{ if(l.tipo==='pagamento'){ignorados++;return false;} return l&&l.data&&+l.valor; }).map(l=>{
    let desc=String(l.descricao||'').trim(); if(l.parcela&&l.parcelas) desc+=` (${l.parcela}/${l.parcelas})`;
    const cat=A.cats.find(c=>c.tipo==='despesa'&&c.name.toLowerCase()===String(l.categoria||'').toLowerCase());
    return {date:String(l.data).slice(0,10),desc,val:-(+l.valor),parcela:l.parcela||null,parcelas:l.parcelas||null,catIA:cat?cat.id:null};
  });
  return {vencimento:d.vencimento||null,total:d.total!=null?+d.total:null,itens,ignorados};
}

// Categoria "aprendida": usa a mesma categoria do último lançamento parecido (mesmo tipo)
// A chave ignora o prefixo do banco: "PIX TRANSF SIDNEY 06/05" → "sidney"; "INT /SABESP 0812" → "sabesp"
function _chaveDesc(d){return _descLimpa(d).replace(/[^a-z0-9 ]/g,' ').split(/\s+/).filter(w=>w.length>2&&!/\d{3,}/.test(w)).slice(0,2).join(' ');}
let _histCache=null;
function _catAprendida(desc,tipo){
  tipo=tipo||'despesa';
  const k=_chaveDesc(desc); if(!k) return null;
  if(!_histCache||_histCache.n!==A.txs.length||_histCache.ref!==A.txs){
    const m=new Map();
    for(let i=0;i<A.txs.length;i++){ const t=A.txs[i]; if(!t.catId||t.type==='transferencia'||_catEhOutros(t.catId)) continue; const kk=_chaveDesc(t.desc); if(kk) m.set(t.type+'|'+kk,t.catId); }
    _histCache={n:A.txs.length,ref:A.txs,m};
  }
  return _histCache.m.get(tipo+'|'+k)||null;
}

// Ao importar para um cartão: cada compra entra na fatura do PDF (a data vai para o ciclo certo; a data original fica na observação)
function _ajustarParaFatura(r,acc,faturaAlvo){
  if(!isCC(acc)||!_ccOk(acc)||!faturaAlvo) return {date:r.date,obs:''};
  if(faturaMesDe(acc,r.date)===faturaAlvo) return {date:r.date,obs:''};
  const fech=_faturaDatas(acc,faturaAlvo).fechamento;      // dia do fechamento
  const d=new Date(fech+'T12:00:00'); d.setDate(d.getDate()-1); // último dia do ciclo
  return {date:localDate(d),obs:'Compra original em '+D(r.date)};
}

// ── IA para extrato/planilha: envia só descrição, tipo e valor (sem conta, saldo ou nome do arquivo) ──
async function iaCategorizarLinhas(rows){
  const cfg=iaCfg(); if(cfg.motor!=='claude'||!cfg.chave) return {n:0};
  const grupos=new Map();
  rows.forEach((r,i)=>{
    const tipo=r.val>=0?'receita':'despesa';
    if(_catPorRegra(r.desc,tipo)) return;                               // regra já resolve
    if(r.catPlanilha&&_catById(r.catPlanilha)) return;                 // planilha já trouxe
    const k=tipo+'|'+_regraNorm(_regraLimparTexto(r.desc).replace(/(\D)\d{2}\/\d{2}(?:\/\d{2,4})?\s*$/,'$1'));
    if(!grupos.has(k)) grupos.set(k,{tipo,desc:r.desc,val:Math.abs(r.val),idx:[]});
    grupos.get(k).idx.push(i);
  });
  const lista=[...grupos.values()]; if(!lista.length) return {n:0};
  const nomes=tp=>A.cats.filter(c=>c.tipo===tp).map(c=>_catNomeCompleto(c));
  const instr=`Você categoriza lançamentos de extrato bancário e de planilhas de finanças pessoais no Brasil.
Para cada item escolha UMA categoria da lista do tipo dele (despesa ou receita), copiando o nome exatamente como está na lista.
Se não houver pista suficiente (ex.: PIX para uma pessoa física só com o primeiro nome), responda "Outros".
Pistas comuns de extrato: "REND PAGO APLIC" = rendimento de investimento; "PIX QRS"/"QR" = compra por QR code no estabelecimento indicado; "INT"/"INTERNET"/"MOBILE PAG TIT"/"SISPAG" = pagamento de conta ou boleto do favorecido indicado; "TAR"/"CESTA" = tarifa bancária; "IOF"/"JUROS" = encargos; "DEV PIX" = devolução; "RESGATE"/"APLICACAO" = investimentos.
Responda SOMENTE com JSON válido, sem texto antes ou depois: {"r":[{"i":0,"c":"nome da categoria"}]}
Categorias de DESPESA: ${nomes('despesa').join(' | ')}
Categorias de RECEITA: ${nomes('receita').join(' | ')}`;
  const acha=(nome,tp)=>{ const n=_normTxt(String(nome||'')).replace(/\s*(›|>)\s*/g,' › ').trim(); if(!n||n==='outros') return null;
    const c=A.cats.find(c=>c.tipo===tp&&_normTxt(_catNomeCompleto(c))===n)||A.cats.find(c=>c.tipo===tp&&_normTxt(c.name)===n.split(' › ').pop());
    return c&&!_catEhOutros(c.id)?c.id:null; };
  const LOTE=120; const lotes=[]; for(let i=0;i<lista.length;i+=LOTE) lotes.push(lista.slice(i,i+LOTE));
  let n=0, erro=null;
  await Promise.all(lotes.map(async(lote,li)=>{
    const itens=lote.map((g,j)=>({i:j,tipo:g.tipo,d:g.desc,v:+g.val.toFixed(2)}));
    try{
      const resp=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':cfg.chave,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
        body:JSON.stringify({model:cfg.modelo,max_tokens:6000,messages:[{role:'user',content:instr+'\n\nItens:\n'+JSON.stringify(itens)}]})});
      if(!resp.ok){ let m=''; try{const j=await resp.json(); m=j.error&&j.error.message||'';}catch(e){} throw new Error(resp.status===401?'Chave da API inválida.':('A API do Claude respondeu com erro '+resp.status+(m?': '+m:''))); }
      const j=await resp.json();
      const txt=(j.content||[]).filter(c=>c.type==='text').map(c=>c.text).join('').trim();
      const d=JSON.parse(txt.slice(txt.indexOf('{'),txt.lastIndexOf('}')+1));
      (d.r||[]).forEach(x=>{ const g=lote[+x.i]; if(!g) return; const id=acha(x.c,g.tipo); if(!id) return; g.idx.forEach(k=>{ rows[k].catIA=id; }); n+=g.idx.length; });
    }catch(e){ erro=e; }
  }));
  return {n,erro};
}

// Lê os bytes e decide: Excel (.xls antigo, .xlsx, ou HTML "disfarçado" de .xls) ou texto (UTF-8 / Windows-1252)
function _arqTipo(u8){
  if(u8[0]===0xD0&&u8[1]===0xCF&&u8[2]===0x11&&u8[3]===0xE0) return 'excel';   // XLS (OLE) — o Itaú exporta assim, às vezes com nome .csv
  if(u8[0]===0x50&&u8[1]===0x4B&&u8[2]===0x03&&u8[3]===0x04) return 'excel';   // XLSX (zip)
  const ini=new TextDecoder('latin1').decode(u8.subarray(0,512)).trim().toLowerCase();
  if(/^<(\?xml|html|table|!doctype)/.test(ini)&&/<(table|workbook)/.test(new TextDecoder('latin1').decode(u8.subarray(0,20000)).toLowerCase())) return 'excel';
  return 'texto';
}
function _textoDeBytes(u8){
  const t=new TextDecoder('utf-8').decode(u8);
  return t.includes(' ')?new TextDecoder('windows-1252').decode(u8):t;   // CSV de banco costuma vir em Latin-1
}

function _csvHandleFile(file) {
  if (!file) return;
  const ext = file.name.split('.').pop().toLowerCase();
  if (ext === 'pdf') { _pdfHandleFile(file); return; }

  async function processar(res) {
    const { rows, format } = res;
    if (!rows.length) {
      _csvState.step = 'upload'; _renderCsvModal();
      toast('Nenhum lançamento encontrado no arquivo. Verifique se ele tem colunas de data, descrição e valor.', 'var(--expense)', 6000);
      return;
    }
    // IA (se ligada) antes do histórico e da palavra-chave — mesma ordem da fatura em PDF
    let ia = null;
    if (iaCfg().motor === 'claude' && iaCfg().chave) {
      _csvState.step = 'loading'; _csvState.fileName = file.name; _csvState.loadingMsg = 'Categorizando com o Claude…'; _csvState.loadingSub = `${rows.length} lançamentos · só as descrições são enviadas`; _renderCsvModal();
      ia = await iaCategorizarLinhas(rows);
      if (!_csvState) return;
      if (ia.erro) toast('IA indisponível (' + ia.erro.message + '). Segui com regras, histórico e palavras-chave.', 'var(--amber)', 6500);
    }
    const cont = _aplicarAutoCat(rows);
    const existingHashes = new Set(
      A.txs.flatMap(t => [
        t.date + '|' + (t.obs||t.desc||'') + '|' + (t.type==='despesa'?-t.val:t.val),
        t.date + '|' + (t.desc||'') + '|' + (t.type==='despesa'?-t.val:t.val),
      ])
    );
    function rowHash(r) { return r.date + '|' + r.desc + '|' + r.val; }
    const selected = new Set();
    rows.forEach((r, i) => {
      _csvFamInicial(r);
      if (!existingHashes.has(rowHash(r))) selected.add(i);
    });
    Object.assign(_csvState, { rows, format, selected, fileName: file.name, step: 'preview', filtro: '', verSel: 'todos', catCont: cont, futuros: res.futuros || 0, semSinal: !!res.semSinal, pdf: null });
    _renderCsvModal();
  }

  const reader = new FileReader();
  reader.onload = e => {
    const u8 = new Uint8Array(e.target.result);
    try {
      if (_arqTipo(u8) === 'excel' || ext === 'xls' || ext === 'xlsx') {
        if (typeof XLSX === 'undefined') { toast('Biblioteca de leitura de Excel ainda carregando. Aguarde um instante e tente novamente.', '#D97706', 4000); return; }
        // datas como número de série + formato BR (cellDates:true desloca um dia em alguns fusos)
        const _protoAntes = new Set(Object.getOwnPropertyNames(Object.prototype));
        const wb = XLSX.read(u8, { type: 'array', cellDates: false, dateNF: 'DD/MM/YYYY', raw: false });
        const _poluido = Object.getOwnPropertyNames(Object.prototype).filter(k => !_protoAntes.has(k));
        if (_poluido.length) { _poluido.forEach(k => { try { delete Object.prototype[k]; } catch(e) {} }); toast('Arquivo Excel recusado: conteúdo suspeito.', 'var(--expense)', 5000); return; }
        // testa todas as abas e fica com a que tiver mais lançamentos (o Itaú põe "Posição Consolidada" e "Limites" junto)
        let melhor = { rows: [], format: '' };
        wb.SheetNames.forEach(nm => {
          const csv = XLSX.utils.sheet_to_csv(wb.Sheets[nm], { dateNF: 'DD/MM/YYYY', blankrows: false });
          const r = csvDetectAndParse(csv);
          if (r.rows.length > melhor.rows.length) { melhor = r; if (wb.SheetNames.length > 1) melhor.format += ' · aba “' + nm + '”'; }
        });
        processar(melhor);
      } else {
        processar(csvDetectAndParse(_textoDeBytes(u8)));
      }
    } catch (err) {
      toast('Erro ao ler o arquivo: ' + err.message, 'var(--expense)', 5000);
    }
  };
  reader.readAsArrayBuffer(file);
}

// ── Filtro por descrição na revisão ──
// Sem acento e sem diferenciar maiúsculas. Vírgula = qualquer um dos termos ("pix transf, ted").
// Termo começando com "-" esconde quem contém ("-rend" = tudo menos rendimento).
function _csvFiltroTermos() {
  const f = (_csvState && _csvState.filtro) || '';
  return f.split(',').map(t => _normTxt(t).replace(/\s+/g, ' ').trim()).filter(t => t && t !== '-');
}
function _csvVisiveis() {
  const s = _csvState; if (!s || !s.rows) return [];
  const ver = s.verSel || 'todos';
  const okSel = i => ver === 'todos' || (ver === 'sim' ? s.selected.has(i) : !s.selected.has(i));
  const tt = _csvFiltroTermos(); if (!tt.length) return s.rows.map((_, i) => i).filter(okSel);
  const inc = tt.filter(t => t[0] !== '-'), exc = tt.filter(t => t[0] === '-').map(t => t.slice(1).trim()).filter(Boolean);
  return s.rows.map((r, i) => i).filter(i => {
    const d = _normTxt(s.rows[i].desc || '').replace(/\s+/g, ' ');
    return okSel(i) && (!inc.length || inc.some(t => d.includes(t))) && !exc.some(t => d.includes(t));
  });
}
// Totalizador do rodapé: receitas, despesas e saldo do que está marcado (e do que aparece no filtro)
function _csvTotais(idx) {
  const rows = _csvState.rows; let rec = 0, desp = 0, nr = 0, nd = 0;
  idx.forEach(i => { const v = rows[i].val; if (v >= 0) { rec += v; nr++; } else { desp += -v; nd++; } });
  return { rec, desp, saldo: rec - desp, nr, nd };
}

}
function _csvFiltroAtivo() { return !!_csvFiltroTermos().length || ((_csvState && _csvState.verSel) || 'todos') !== 'todos'; }
function _csvVer(v) { _csvState.verSel = v; const box = document.querySelector('#csv-modal-overlay .csv-tbl-wrap'); if (box) box.scrollTop = 0; _csvRenderMantendo(); }
// Redesenha mantendo o foco/cursor no campo de filtro e a rolagem da tabela

function _csvConfirmImport() {
  if (!_accExiste(_csvState.accId)) { toast('Escolha a conta de destino antes de importar.', 'var(--expense)', 4500); return; }
  const { rows, selected, accId } = _csvState;
  let count = 0;
  const famDefault = A.familia[0]?.name || '';

  const _acc = accBy(accId);
  const _alvo = _csvState.pdf ? _csvState.pdf.faturaAlvo : null;
  selected.forEach(i => {
    const r = rows[i];
    const type = r.val >= 0 ? 'receita' : 'despesa';
    const _aj = _csvState.pdf ? _ajustarParaFatura(r, _acc, _alvo) : { date: r.date, obs: '' };
    const catId = r.catId || (A.cats.find(c => c.tipo === type && c.name === 'Outros') || A.cats.find(c => c.tipo === type))?.id || null;
    // Membro escolhido na revisão (regra, portador ou o que você marcou)
    let familia = famDefault;
    if (r.fam !== undefined) familia = r.fam; else {
    // fatura com cartões adicionais: usa o membro da família com o mesmo nome do portador, se houver
    if (!r.familia && r.titular) {
      const tn = _normTxt(r.titular);
      const fm = famNames().find(n => { const nn=_normTxt(n); return nn.length>2 && (tn===nn || tn.startsWith(nn+' ') || tn.split(' ')[0]===nn); });
      if (fm) familia = fm;
    }
    if (r.familia) {
      // Tenta encontrar membro da família pelo nome (match parcial case-insensitive)
      const famMatch = famNames().find(n => r.familia.toLowerCase().includes(n.toLowerCase()) || n.toLowerCase().includes(r.familia.split(' ')[0].toLowerCase()));
      familia = famMatch || r.familia;
    }
    }
    A.txs.push({
      id: A.nid++,
      type,
      desc: r.desc,
      val: Math.abs(r.val),
      date: _aj.date,
      catId,
      accId,
      accDest: null,
      recur: 'none',
      obs: [_aj.obs, r.finalCartao ? `Cartão final ${r.finalCartao}${r.titular ? ' · ' + r.titular : ''}` : ''].filter(Boolean).join(' · '),
      ...(r.parcelas ? { parcela: r.parcela, parcelas: r.parcelas } : {}),
      ...(_csvState.pdf ? { origem: 'pdf' } : {}),
      planned: false,
      done: true,
      familia,
    });
    count++;
  });

  let _rgRes=null;
  if (_csvState.criarRegras !== false && _rgAutoLigado()) {
    _rgRes = _rgAutoCriar(_rgAutoPlano(), _csvState.fileName || 'importação');
  }
  closeCsvImport();
  render();
  const _rgMsg = _rgRes && (_rgRes.novas || _rgRes.atualizadas) ? ` ⚡ ${_rgRes.novas} regra(s) nova(s)${_rgRes.atualizadas?`, ${_rgRes.atualizadas} atualizada(s)`:''} — veja em Categorias › Regras.` : '';
  toast(`✅ ${count} lançamento${count!==1?'s':''} importado${count!==1?'s':''}!${_rgMsg}`, 'var(--income)', _rgMsg?6500:4000);
}

/* ═══════════════════════════════════════════════════════════
   COFRE CRIPTOGRAFADO — WebCrypto AES-GCM + PBKDF2
   ═══════════════════════════════════════════════════════════
   Fluxo:
   • A.senhas[] armazena apenas dados CIFRADOS {id,site,url,enc,iv,salt}
   • A.cofre.senhasDecrypt[] é o cache descriptografado em memória (apagado ao travar)
   • A senha master NUNCA é persistida — só a chave derivada fica em memória
   • Suporte a migração de dados antigos (texto puro → criptografado ao definir master)
   ═══════════════════════════════════════════════════════════ */

const VAULT_META_KEY = 'pfp_vault_meta'; // localStorage: {salt, verifier}

// Segredos só em memória (somem ao recarregar, travar o cofre ou sair).
// Versões anteriores guardavam a senha master em texto no sessionStorage ('_vmp').
var _vaultMasterMem = null;  // senha master, enquanto o cofre está aberto
var _sessionPassMem = null;  // senha digitada no login, enquanto a sessão está aberta
try { sessionStorage.removeItem('_vmp'); } catch(e) {}

// ── Utilitários de bytes ──
function _b64e(buf){ return btoa(String.fromCharCode(...new Uint8Array(buf))); }
function _b64d(s){ const b=atob(s); const u=new Uint8Array(b.length); for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i); return u.buffer; }
function _rand(n){ const b=new Uint8Array(n); crypto.getRandomValues(b); return b; }

// ── Derivação de chave (PBKDF2 → AES-GCM) ──
async function _deriveKey(password, salt){
  const enc = new TextEncoder();
  const base = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    {name:'PBKDF2', salt, iterations:310000, hash:'SHA-256'},
    base,
    {name:'AES-GCM', length:256},
    false,
    ['encrypt','decrypt']
  );
}

// ── Cifrar string → {enc, iv} (base64) ──
async function _encrypt(key, plaintext){
  const iv = _rand(12);
  const enc = new TextEncoder();
  const buf = await crypto.subtle.encrypt({name:'AES-GCM', iv}, key, enc.encode(plaintext));
  return {enc: _b64e(buf), iv: _b64e(iv.buffer)};
}

// ── Decifrar {enc, iv} → string ──
async function _decrypt(key, enc, iv){
  try{
    const buf = await crypto.subtle.decrypt({name:'AES-GCM', iv: new Uint8Array(_b64d(iv))}, key, _b64d(enc));
    return new TextDecoder().decode(buf);
  }catch(e){ return null; }
}

// ── Verifica se senha master está definida ──
function vaultHasMaster(){
  return !!localStorage.getItem(VAULT_META_KEY);
}

// ── Carrega metadados (salt + verifier) ──
function _vaultLoadMeta(){
  try{ return JSON.parse(localStorage.getItem(VAULT_META_KEY)||'null'); }catch(e){ return null; }
}

// ── Verifica senha master (tenta decifrar o verifier) ──
async function vaultVerify(password){
  const meta = _vaultLoadMeta();
  if(!meta) return false;
  const salt = new Uint8Array(_b64d(meta.salt));
  const key = await _deriveKey(password, salt);
  const plain = await _decrypt(key, meta.verifierEnc, meta.verifierIv);
  return plain === 'pfp-vault-ok';
}

// ── Chaves delegadas: cada admin pode abrir o cofre com a própria senha ──
// A senha master é cifrada com uma chave PBKDF2 derivada da SENHA do admin
// (digitada no login), nunca do hash salvo. Formato v2.
// Entradas antigas (v1) eram derivadas do hash SHA-256 salvo no navegador —
// qualquer um com acesso ao localStorage abria o cofre. São migradas para v2
// no primeiro uso com a senha correta.
async function _vaultSetAdminKey(masterPass, adminId, adminPass){
  const meta = _vaultLoadMeta();
  if(!meta || !masterPass || !adminPass) return;
  if(!meta.adminKeys) meta.adminKeys = {};
  const salt = _rand(32);
  const k = await _deriveKey(adminPass, salt);
  const {enc, iv} = await _encrypt(k, masterPass);
  meta.adminKeys[adminId] = {v:2, salt:_b64e(salt.buffer), enc, iv};
  localStorage.setItem(VAULT_META_KEY, JSON.stringify(meta));
}
function _vaultRemoveAdminKey(adminId){
  const meta = _vaultLoadMeta();
  if(!meta || !meta.adminKeys || !meta.adminKeys[adminId]) return;
  delete meta.adminKeys[adminId];
  localStorage.setItem(VAULT_META_KEY, JSON.stringify(meta));
}
async function _vaultMasterFromAdmin(adminId, adminPass){
  const meta = _vaultLoadMeta();
  const d = meta && meta.adminKeys && meta.adminKeys[adminId];
  if(!d || !adminPass) return null;
  const material = d.v === 2 ? adminPass : await _sha256(adminPass); // v1 = hash SHA-256 legado
  const k = await _deriveKey(material, new Uint8Array(_b64d(d.salt)));
  const master = await _decrypt(k, d.enc, d.iv);
  if(master && d.v !== 2) await _vaultSetAdminKey(master, adminId, adminPass); // migra p/ v2
  return master;
}
// Registra a chave do admin logado, se ainda não houver uma v2
async function _vaultEnsureSessionAdminKey(masterPass){
  const s = window._appSession;
  if(!s || s.papel !== 'admin' || !_sessionPassMem) return;
  const meta = _vaultLoadMeta();
  const d = meta && meta.adminKeys && meta.adminKeys[s.id];
  if(!d || d.v !== 2) await _vaultSetAdminKey(masterPass, s.id, _sessionPassMem);
}

// ── Define senha master (primeira vez ou redefinição) ──
async function vaultSetMaster(password){
  const salt = _rand(32);
  const key = await _deriveKey(password, salt);
  const {enc, iv} = await _encrypt(key, 'pfp-vault-ok');
  const meta = {salt: _b64e(salt.buffer), verifierEnc: enc, verifierIv: iv, adminKeys:{}};
  localStorage.setItem(VAULT_META_KEY, JSON.stringify(meta));
  A.cofre.key = key;
  A.cofre.locked = false;
  A.cofre.masterSet = true;
  _vaultMasterMem = password;
  // Admin logado passa a abrir o cofre também com a própria senha
  await _vaultEnsureSessionAdminKey(password);
  return key;
}

// ── Desbloqueia o cofre com senha master ──
async function vaultUnlock(password){
  const ok = await vaultVerify(password);
  if(!ok) return false;
  const meta = _vaultLoadMeta();
  const salt = new Uint8Array(_b64d(meta.salt));
  const key = await _deriveKey(password, salt);
  A.cofre.key = key;
  A.cofre.locked = false;
  A.cofre.masterSet = true;
  _vaultMasterMem = password;
  await _vaultEnsureSessionAdminKey(password);
  // Descriptografa todas as senhas para cache em memória
  await _vaultDecryptAll();
  return true;
}

// ── Trava o cofre (apaga chave e cache da memória) ──
function vaultLock(){
  A.cofre.key = null;
  A.cofre.locked = true;
  A.cofre.senhasDecrypt = null;
  A.senhaMostrar = {};
  _vaultMasterMem = null;
  render();
  toast('🔒 Cofre travado.', '#475569');
}

// ── Descriptografa todos os registros para o cache em memória ──
async function _vaultDecryptAll(){
  if(!A.cofre.key) return;
  const results = [];
  for(const s of (A.senhas||[])){
    if(s.enc){
      // Registro criptografado
      const usuario = s.encU ? (await _decrypt(A.cofre.key, s.encU, s.ivU)||'') : (s.usuario||'');
      const senha   = s.enc  ? (await _decrypt(A.cofre.key, s.enc,  s.iv )||'') : '';
      results.push({...s, _usuario: usuario, _senha: senha});
    } else {
      // Registro legado (texto puro) — ainda não migrado
      results.push({...s, _usuario: s.usuario||'', _senha: s.senha||''});
    }
  }
  A.cofre.senhasDecrypt = results;
}

// ── Cifra um registro e salva em A.senhas ──
async function _vaultEncryptRecord(id, site, url, usuario, senhaPlain, obs){
  if(!A.cofre.key) throw new Error('Cofre travado');
  const {enc: encU, iv: ivU} = await _encrypt(A.cofre.key, usuario);
  const {enc, iv}             = await _encrypt(A.cofre.key, senhaPlain);
  return {id, site, url, obs, enc, iv, encU, ivU, _crypt: true};
}

// ── Migra registros de texto puro → criptografados ──
async function vaultMigrateAll(){
  if(!A.cofre.key) return;
  const migrated = [];
  for(const s of (A.senhas||[])){
    if(s._crypt || s.enc){
      // Já criptografado
      migrated.push(s);
    } else {
      // Texto puro — migrar
      const rec = await _vaultEncryptRecord(s.id, s.site||'', s.url||'', s.usuario||'', s.senha||'', s.obs||'');
      migrated.push(rec);
    }
  }
  A.senhas = migrated;
  await _vaultDecryptAll();
  dbSave();
}

function _vaultStrength(pass){
  const fill = document.getElementById('vault-strength-fill');
  const lbl  = document.getElementById('vault-strength-label');
  if(!fill||!lbl) return;
  let score = 0;
  if(pass.length >= 8)  score++;
  if(pass.length >= 12) score++;
  if(/[A-Z]/.test(pass)) score++;
  if(/[0-9]/.test(pass)) score++;
  if(/[^A-Za-z0-9]/.test(pass)) score++;
  const levels = [
    {pct:0,   color:'#DC2626', label:''},
    {pct:20,  color:'#DC2626', label:'Muito fraca'},
    {pct:40,  color:'#D97706', label:'Fraca'},
    {pct:60,  color:'#F59E0B', label:'Média'},
    {pct:80,  color:'#059669', label:'Boa'},
    {pct:100, color:'#065F46', label:'Forte'},
  ];
  const l = levels[score]||levels[0];
  fill.style.width  = l.pct + '%';
  fill.style.background = l.color;
  lbl.textContent = pass.length ? l.label : '';
}

async function vaultDoUnlock(){
  const p = document.getElementById('vault-pass1')?.value||'';
  const btn = document.getElementById('vault-submit-btn');
  if(!p){ _vaultShowErr('Digite a senha master ou sua senha de admin.'); return; }
  const _esp=_rlEspera('pfp_vault_rl');
  if(_esp){ _vaultShowErr('Muitas tentativas erradas. Aguarde '+_rlMsg(_esp)+'.'); return; }
  if(btn){ btn.textContent='⏳ Verificando…'; btn.disabled=true; }

  // 1ª tentativa: senha master
  let ok = await vaultUnlock(p);

  // 2ª tentativa: senha de um admin (a chave delegada é derivada da própria senha)
  if(!ok){
    const sess = window._appSession;
    const candidatos = [];
    if(sess && sess.papel==='admin' && _sessionPassMem && p===_sessionPassMem) candidatos.push({id:sess.id});
    for(const u of (A.usuarios||[]).filter(u=>u.papel==='admin')){
      if(candidatos.some(c=>c.id===u.id)) continue;
      if(await _verifyPassword(u, p)) candidatos.push({id:u.id, user:u});
    }
    for(const c of candidatos){
      const master = await _vaultMasterFromAdmin(c.id, p);
      if(master && await vaultUnlock(master)){
        ok = true;
        if(c.user && (!sess || sess.id!==c.user.id)) _sessionSet(c.user);
        break;
      }
    }
  }

  if(ok) _rlOk('pfp_vault_rl'); else _rlFalha('pfp_vault_rl');
  if(!ok){
    if(btn){ btn.textContent='Desbloquear'; btn.disabled=false; }
    await new Promise(r=>setTimeout(r,500));
    _vaultShowErr('Senha incorreta. Use a senha master ou sua senha de admin.');
    document.getElementById('vault-pass1').value='';
    document.getElementById('vault-pass1').focus();
    return;
  }
  toast('🔓 Cofre desbloqueado!','var(--income)');
  render();
}

    return true;
  }

  // ── lançamentos efetivados ──
  let txs=A.txs.filter(t=>t.done);
  if(f.accId!=='all')txs=txs.filter(t=>String(t.accId)===String(f.accId));
  txs=txs.filter(filtPeriodo);
  if(f.tipo!=='todos')txs=txs.filter(t=>t.type===f.tipo);
